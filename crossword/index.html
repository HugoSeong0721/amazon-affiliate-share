<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Slang Crossword — Learn Modern English</title>
<style>
  :root {
    --bg: #fdf8ef;
    --card: #ffffff;
    --ink: #262a35;
    --muted: #7d7f8c;
    --accent: #f4506b;
    --accent-ink: #ffffff;
    --highlight: #ffd447;
    --success: #2fae82;
    --success-bg: #d9f2e7;
    --danger: #e5484d;
    --danger-bg: #fdeaea;
    --border: #262a35;
    --soft: #f4eee1;
    --shadow: #262a35;
    --cell-sel: #ffe9a8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1c26;
      --card: #252836;
      --ink: #f0efe9;
      --muted: #9698a8;
      --accent: #ff7a93;
      --accent-ink: #2a1017;
      --highlight: #e8bd2e;
      --success: #4ecca0;
      --success-bg: #23473a;
      --danger: #ff6b70;
      --danger-bg: #43242a;
      --border: #0f1017;
      --soft: #20222f;
      --shadow: #0f1017;
      --cell-sel: #55491f;
    }
  }
  :root[data-theme="light"] {
    --bg: #fdf8ef;
    --card: #ffffff;
    --ink: #262a35;
    --muted: #7d7f8c;
    --accent: #f4506b;
    --accent-ink: #ffffff;
    --highlight: #ffd447;
    --success: #2fae82;
    --success-bg: #d9f2e7;
    --danger: #e5484d;
    --danger-bg: #fdeaea;
    --border: #262a35;
    --soft: #f4eee1;
    --shadow: #262a35;
    --cell-sel: #ffe9a8;
  }
  :root[data-theme="dark"] {
    --bg: #1a1c26;
    --card: #252836;
    --ink: #f0efe9;
    --muted: #9698a8;
    --accent: #ff7a93;
    --accent-ink: #2a1017;
    --highlight: #e8bd2e;
    --success: #4ecca0;
    --success-bg: #23473a;
    --danger: #ff6b70;
    --danger-bg: #43242a;
    --border: #0f1017;
    --soft: #20222f;
    --shadow: #0f1017;
    --cell-sel: #55491f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 12px 30px;
    user-select: none;
    -webkit-user-select: none;
  }
  .app { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 14px; }
  .screen { display: none; flex-direction: column; gap: 14px; }
  .screen.active { display: flex; }

  .home-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .bubble-title {
    align-self: flex-start;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    padding: 12px 18px;
    border: 2px solid var(--border);
    border-radius: 20px 20px 20px 4px;
    box-shadow: 4px 4px 0 var(--shadow);
  }
  .lang-btn, .back-btn {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 10px;
    box-shadow: 2px 2px 0 var(--shadow);
    font: inherit;
    font-weight: 700;
    font-size: 13px;
    color: var(--ink);
    padding: 8px 12px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .subtitle { color: var(--muted); font-size: 14px; line-height: 1.6; }
  .subtitle strong { color: var(--ink); }

  .progress-pill {
    display: flex; align-items: center; gap: 10px;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 11px 15px;
    box-shadow: 3px 3px 0 var(--shadow);
    font-size: 14px; font-weight: 700;
  }
  .progress-track { flex: 1; height: 10px; background: var(--soft); border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
  .progress-fill { height: 100%; background: var(--success); width: 0%; transition: width 0.4s ease; }

  .level-list { display: flex; flex-direction: column; gap: 11px; }
  .level-card {
    display: flex; align-items: center; gap: 13px;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 15px;
    padding: 13px 15px;
    box-shadow: 4px 4px 0 var(--shadow);
    cursor: pointer; text-align: left; font: inherit; color: inherit;
    transition: transform 0.08s ease;
  }
  .level-card:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--shadow); }
  .level-card.locked { opacity: 0.55; box-shadow: 2px 2px 0 var(--shadow); }
  .level-card .num {
    flex-shrink: 0; width: 42px; height: 42px;
    display: flex; align-items: center; justify-content: center;
    background: var(--highlight); color: #262a35;
    font-weight: 800; font-size: 16px;
    border: 2px solid var(--border); border-radius: 11px;
  }
  .level-card.cleared .num { background: var(--success); color: #fff; }
  .level-card .info { flex: 1; min-width: 0; }
  .level-card .name { display: block; font-weight: 800; font-size: 15px; }
  .level-card .words-preview { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .level-card .state { font-size: 19px; flex-shrink: 0; }
  footer { margin-top: 14px; font-size: 12px; color: var(--muted); text-align: center; }
  footer button { background: none; border: none; color: var(--muted); font-size: 12px; text-decoration: underline; cursor: pointer; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .level-tag { font-weight: 800; font-size: 14px; flex: 1; text-align: center; }
  .stat-chip {
    background: var(--card); border: 2px solid var(--border); border-radius: 10px;
    box-shadow: 2px 2px 0 var(--shadow);
    font-size: 12px; font-weight: 700; padding: 8px 10px; flex-shrink: 0;
  }

  .board-wrap { display: flex; justify-content: center; }
  #board { position: relative; display: grid; gap: 0; }
  .cw-cell {
    position: relative;
    background: var(--card);
    border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 0.62em;
    cursor: pointer;
    color: var(--ink);
  }
  .cw-cell .cnum {
    position: absolute; top: 1px; left: 2px;
    font-size: 0.32em; font-weight: 700; color: var(--muted); line-height: 1;
  }
  .cw-cell.hl { background: var(--cell-sel); }
  .cw-cell.cur { background: var(--highlight); color: #262a35; }
  .cw-cell.cur .cnum { color: #262a35; }
  .cw-cell.solved { background: var(--success-bg); }
  .cw-cell.flash-bad { animation: shake 0.3s ease; background: var(--danger-bg); }
  @keyframes shake { 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
  @media (prefers-reduced-motion: reduce) { .cw-cell.flash-bad { animation: none; } }

  .clue-bar {
    display: flex; align-items: stretch; gap: 8px;
  }
  .clue-nav {
    background: var(--card); border: 2px solid var(--border); border-radius: 10px;
    box-shadow: 2px 2px 0 var(--shadow);
    font: inherit; font-weight: 800; font-size: 16px; color: var(--ink);
    width: 44px; cursor: pointer; flex-shrink: 0;
  }
  .clue-text {
    flex: 1;
    background: var(--card); border: 2px solid var(--border); border-radius: 12px;
    box-shadow: 2px 2px 0 var(--shadow);
    padding: 9px 12px;
    font-size: 13px; line-height: 1.45;
    display: flex; flex-direction: column; justify-content: center;
    min-height: 52px;
  }
  .clue-text .tag { font-weight: 800; color: var(--accent); font-size: 12px; }

  .kb { display: flex; flex-direction: column; gap: 6px; }
  .kb-row { display: flex; gap: 5px; justify-content: center; }
  .kb button {
    flex: 1; max-width: 44px;
    padding: 12px 0;
    background: var(--card); border: 2px solid var(--border); border-radius: 8px;
    box-shadow: 2px 2px 0 var(--shadow);
    font: inherit; font-weight: 800; font-size: 15px; color: var(--ink);
    cursor: pointer;
  }
  .kb button:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--shadow); }
  .kb button.wide { max-width: 68px; }
  .kb-actions { display: flex; gap: 8px; }
  .action-btn {
    flex: 1;
    background: var(--card); border: 2px solid var(--border); border-radius: 12px;
    box-shadow: 3px 3px 0 var(--shadow);
    font: inherit; font-weight: 800; font-size: 13px; color: var(--ink);
    padding: 11px 0; cursor: pointer;
  }
  .action-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow); }
  .action-btn:disabled { opacity: 0.4; pointer-events: none; }

  .clue-lists { display: flex; flex-direction: column; gap: 10px; }
  .clue-section {
    background: var(--card); border: 2px solid var(--border); border-radius: 14px;
    box-shadow: 3px 3px 0 var(--shadow);
    padding: 12px 14px;
  }
  .clue-section h3 { font-size: 13px; font-weight: 800; color: var(--accent); margin-bottom: 6px; letter-spacing: 0.03em; }
  .clue-item {
    display: block; width: 100%; text-align: left;
    background: none; border: none; font: inherit; color: var(--ink);
    font-size: 13px; line-height: 1.5; padding: 4px 2px; cursor: pointer;
    border-radius: 6px;
  }
  .clue-item b { color: var(--accent); }
  .clue-item.on { background: var(--cell-sel); }
  .clue-item.done { color: var(--muted); text-decoration: line-through; }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(20, 22, 40, 0.55);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 10; backdrop-filter: blur(3px);
  }
  .overlay.hidden { display: none; }
  .modal {
    background: var(--card); border: 2px solid var(--border); border-radius: 18px;
    padding: 30px 26px; text-align: center; max-width: 340px; width: 100%;
    box-shadow: 6px 6px 0 var(--shadow);
    display: flex; flex-direction: column; gap: 10px;
  }
  .modal .emoji { font-size: 48px; }
  .modal h2 { font-size: 22px; font-weight: 800; }
  .modal p { font-size: 14px; color: var(--muted); line-height: 1.7; }
  .modal p strong { color: var(--ink); }
  .modal button {
    background: var(--accent); color: var(--accent-ink);
    border: 2px solid var(--border); border-radius: 12px;
    box-shadow: 3px 3px 0 var(--shadow);
    font: inherit; font-weight: 800; font-size: 15px;
    padding: 13px 0; cursor: pointer;
  }
  .modal button.secondary { background: var(--card); color: var(--ink); }
  button:focus-visible { outline: 3px solid var(--highlight); outline-offset: 2px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">

  <!-- Home -->
  <section class="screen active" id="homeScreen">
    <div class="home-top">
      <div class="bubble-title" id="appTitle">Slang Crossword 🧩</div>
      <button class="lang-btn" id="langBtn">🌐</button>
    </div>
    <p class="subtitle" id="appSubtitle"></p>
    <div class="progress-pill">
      <span id="homeProgressText"></span>
      <div class="progress-track"><div class="progress-fill" id="homeProgressFill"></div></div>
    </div>
    <div class="level-list" id="levelList"></div>
    <footer><button id="resetBtn"></button></footer>
  </section>

  <!-- Puzzle -->
  <section class="screen" id="gameScreen">
    <div class="topbar">
      <button class="back-btn" id="gameBackBtn">←</button>
      <span class="level-tag" id="gameLevelTag"></span>
      <span class="stat-chip" id="mistakeChip">❌ 0</span>
      <button class="action-btn" id="hintBtn" style="flex:0 0 auto; padding:8px 12px;">💡 <span id="hintCount"></span></button>
    </div>
    <div class="board-wrap"><div id="board"></div></div>
    <div class="clue-bar">
      <button class="clue-nav" id="prevClueBtn">◀</button>
      <div class="clue-text" id="clueText"></div>
      <button class="clue-nav" id="nextClueBtn">▶</button>
    </div>
    <div class="kb" id="kb"></div>
    <div class="clue-lists">
      <div class="clue-section"><h3 id="acrossLabel"></h3><div id="acrossList"></div></div>
      <div class="clue-section"><h3 id="downLabel"></h3><div id="downList"></div></div>
    </div>
  </section>

</div>

<div class="overlay hidden" id="overlay">
  <div class="modal">
    <div class="emoji" id="modalEmoji">🎉</div>
    <h2 id="modalTitle"></h2>
    <p id="modalText"></p>
    <button id="modalBtn"></button>
    <button class="secondary" id="modalSecondaryBtn"></button>
  </div>
</div>

  // ---------- word data ----------
  // a: answer (A-Z only) / c: clue per language
  const LEVELS = [

  // ---------- generator (criss-cross, multi-cluster) ----------
  const MAXW = 13;
  const shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  function greedyCluster(words) {
    let best = null;
    for (let t = 0; t < 150; t++) {
      const order = shuffle(words);
      const grid = new Map();
      const placed = [];
      const key = (r, c) => r + ',' + c;
      const get = (r, c) => grid.get(key(r, c));
      function fits(word, r0, c0, dr, dc) {
        if (get(r0 - dr, c0 - dc) !== undefined) return false;
        if (get(r0 + dr * word.length, c0 + dc * word.length) !== undefined) return false;
        let cross = 0;
        for (let i = 0; i < word.length; i++) {
          const r = r0 + dr * i, c = c0 + dc * i, e = get(r, c);
          if (e !== undefined) { if (e !== word[i]) return false; cross++; }
          else if (get(r + dc, c + dr) !== undefined || get(r - dc, c - dr) !== undefined) return false;
        }
        if (!cross) return false;
        let minR = r0, maxR = r0 + dr * (word.length - 1), minC = c0, maxC = c0 + dc * (word.length - 1);
        for (const k of grid.keys()) {
          const [r, c] = k.split(',').map(Number);
          minR = Math.min(minR, r); maxR = Math.max(maxR, r);
          minC = Math.min(minC, c); maxC = Math.max(maxC, c);
        }
        return (maxR - minR + 1 <= MAXW && maxC - minC + 1 <= MAXW);
      }
      function put(word, r0, c0, dr, dc) {
        for (let i = 0; i < word.length; i++) grid.set(key(r0 + dr * i, c0 + dc * i), word[i]);
        placed.push({ word, r0, c0, dr, dc });
      }
      put(order[0], 0, 0, 0, 1);
      let pending = order.slice(1);
      let progress = true;
      while (progress && pending.length) {
        progress = false;
        const next = [];
        for (const word of pending) {
          const cands = [];
          for (const [k, ch] of grid) {
            const [r, c] = k.split(',').map(Number);
            for (let i = 0; i < word.length; i++) {
              if (word[i] !== ch) continue;
              for (const [dr, dc] of [[1, 0], [0, 1]]) {
                const r0 = r - dr * i, c0 = c - dc * i;
                if (fits(word, r0, c0, dr, dc)) cands.push([r0, c0, dr, dc]);
              }
            }
          }
          if (cands.length) {
            const [r0, c0, dr, dc] = cands[Math.floor(Math.random() * cands.length)];
            put(word, r0, c0, dr, dc);
            progress = true;
          } else next.push(word);
        }
        pending = next;
      }
      if (!best || placed.length > best.length) best = placed;
      if (placed.length === words.length) break;
    }
    return best;
  }

  function buildLayout(wordObjs) {
    let remaining = wordObjs.map((w) => w.a);
    const clusters = [];
    while (remaining.length) {
      if (remaining.length === 1) {
        clusters.push([{ word: remaining[0], r0: 0, c0: 0, dr: 0, dc: 1 }]);
        break;
      }
      const placed = greedyCluster(remaining);
      clusters.push(placed);
      const used = new Set(placed.map((p) => p.word));
      remaining = remaining.filter((w) => !used.has(w));
      if (placed.length <= 1 && remaining.length) {
        remaining.forEach((w, i) => clusters.push([{ word: w, r0: 0, c0: 0, dr: 0, dc: 1 }]));
        break;
      }
    }
    // 클러스터 세로로 쌓기 (가운데 정렬, 1줄 간격)
    const norm = clusters.map((placed) => {
      let minR = Infinity, maxR = -Infinity, minC = Infinity, maxC = -Infinity;
      for (const p of placed) {
        const r2 = p.r0 + p.dr * (p.word.length - 1), c2 = p.c0 + p.dc * (p.word.length - 1);
        minR = Math.min(minR, p.r0); maxR = Math.max(maxR, r2);
        minC = Math.min(minC, p.c0); maxC = Math.max(maxC, c2);
      }
      return { placed, minR, minC, w: maxC - minC + 1, h: maxR - minR + 1 };
    });
    const W = Math.max(...norm.map((n) => n.w));
    let top = 0;
    const entries = [];
    const cellMap = new Map();
    for (const cl of norm) {
      const offC = Math.floor((W - cl.w) / 2);
      for (const p of cl.placed) {
        const wordObj = wordObjs.find((w) => w.a === p.word);
        const cells = [];
        const er = top + (p.r0 - cl.minR), ec = offC + (p.c0 - cl.minC);
        for (let i = 0; i < p.word.length; i++) {
          const r = er + p.dr * i, c = ec + p.dc * i;
          const k = r + ',' + c;
          if (!cellMap.has(k)) cellMap.set(k, { r, c, sol: p.word[i] });
          cells.push(k);
        }
        entries.push({ wordObj, dir: p.dr ? 'D' : 'A', cells, r: er, c: ec, solved: false });
      }
      top += cl.h + 1;
    }
    // 번호 매기기 (같은 시작 칸은 번호 공유)
    const sorted = entries.slice().sort((a, b) => a.r - b.r || a.c - b.c || (a.dir === 'A' ? -1 : 1));
    const startNums = new Map();
    let num = 0;
    for (const e of sorted) {
      const k = e.r + ',' + e.c;
      if (!startNums.has(k)) startNums.set(k, ++num);
      e.num = startNums.get(k);
    }
    return { entries, cellMap, W, H: top - 1 };
  }

  // ---------- puzzle ----------
  function openLevel(levelIdx) {
    if (!isUnlocked(levelIdx)) { showPaywall(levelIdx); return; }
    currentLevel = levelIdx;

  function renderBoard() {
    const board = $('board');
    board.innerHTML = '';
    board.style.gridTemplateColumns = 'repeat(' + layout.W + ', 1fr)';
    board.style.gridTemplateRows = 'repeat(' + layout.H + ', 1fr)';
    cellEls = new Map();
    // 시작 칸 번호
    const numAt = new Map();
    for (const e of layout.entries) {
      const k = e.r + ',' + e.c;
      if (!numAt.has(k)) numAt.set(k, e.num);
    }
    for (const [k, cell] of layout.cellMap) {
      const el = document.createElement('div');
      el.className = 'cw-cell';
      el.style.gridRow = (cell.r + 1);
      el.style.gridColumn = (cell.c + 1);

  function fitBoard() {
    const board = $('board');
    if (!layout) return;
    const wrapW = board.parentElement.clientWidth;
    const maxH = Math.max(220, window.innerHeight * 0.42);
    const px = Math.min(wrapW / layout.W, maxH / layout.H, 46);
    board.style.width = (px * layout.W) + 'px';
    board.style.height = (px * layout.H) + 'px';
    board.style.fontSize = (px) + 'px';
  }
  window.addEventListener('resize', fitBoard);

  const entriesAtCell = (k) => layout.entries.map((e, i) => ({ e, i })).filter(({ e }) => e.cells.includes(k));

  function tapCell(k) {
    const here = entriesAtCell(k);
    if (!here.length) return;
    const cur = layout.entries[curEntry];
    const onSameCell = cur.cells[curCell] === k;
    let pick;
    if (onSameCell && here.length > 1) {
      pick = here.find(({ i }) => i !== curEntry) || here[0];
    } else {
      pick = here.find(({ i }) => i === curEntry) || here.find(({ e }) => e.dir === 'A') || here[0];
    }
    curEntry = pick.i;
    curCell = pick.e.cells.indexOf(k);
    updateSelection();
  }

  function updateSelection() {
    const cur = layout.entries[curEntry];
    for (const [k, el] of cellEls) {
      el.classList.remove('hl', 'cur');
      const cell = layout.cellMap.get(k);
      const inSolved = entriesAtCell(k).some(({ e }) => e.solved);
      el.classList.toggle('solved', inSolved);
      el.querySelector('.ltr').textContent = cellVals.get(k) || '';
    }
    cur.cells.forEach((k) => cellEls.get(k).classList.add('hl'));
    cellEls.get(cur.cells[curCell]).classList.add('cur');
    // 힌트 바
    const dirLabel = cur.dir === 'A' ? S().acrossShort : S().downShort;
    $('clueText').innerHTML =
      '<span class="tag">' + cur.num + ' ' + dirLabel + ' · ' + S().letters(cur.wordObj.a.length) + '</span>' +
      '<span>' + cur.wordObj.c[lang] + '</span>';
    renderClueLists();
  }

  function renderClueLists() {
    const across = layout.entries.map((e, i) => ({ e, i })).filter(({ e }) => e.dir === 'A').sort((a, b) => a.e.num - b.e.num);
    const down = layout.entries.map((e, i) => ({ e, i })).filter(({ e }) => e.dir === 'D').sort((a, b) => a.e.num - b.e.num);
    const fill = (listEl, items) => {
      listEl.innerHTML = '';
      for (const { e, i } of items) {
        const btn = document.createElement('button');
        btn.className = 'clue-item' + (i === curEntry ? ' on' : '') + (e.solved ? ' done' : '');
        btn.innerHTML = '<b>' + e.num + '.</b> ' + e.wordObj.c[lang] + ' (' + e.wordObj.a.length + ')';
        btn.addEventListener('click', () => { curEntry = i; curCell = firstEditable(e); updateSelection(); });
        listEl.appendChild(btn);
      }
    };
    fill($('acrossList'), across);
    fill($('downList'), down);
  }

  const firstEditable = (e) => {
    const idx = e.cells.findIndex((k) => !lockedCells.has(k));
    return idx === -1 ? 0 : idx;
  };

  function updateHud() {
    $('mistakeChip').textContent = '❌ ' + mistakes;
    $('hintCount').textContent = hintsLeft;
    $('hintBtn').disabled = hintsLeft <= 0;
  }

  function typeLetter(ch) {
    const cur = layout.entries[curEntry];
    if (cur.solved) { advanceEntry(1); return; }
    let k = cur.cells[curCell];
    // 잠긴 칸이면 다음 편집 가능한 칸으로
    if (lockedCells.has(k)) {
      const next = cur.cells.findIndex((kk, i) => i > curCell && !lockedCells.has(kk));
      if (next === -1) return;
      curCell = next;
      k = cur.cells[curCell];
    }
    cellVals.set(k, ch);
    // 다음 칸으로 이동
    const next = cur.cells.findIndex((kk, i) => i > curCell && !lockedCells.has(kk));
    if (next !== -1) curCell = next;
    updateSelection();
    checkEntry(curEntry);
  }

  function backspace() {
    const cur = layout.entries[curEntry];
    if (cur.solved) return;
    let k = cur.cells[curCell];
    if (cellVals.get(k) && !lockedCells.has(k)) {
      cellVals.delete(k);
    } else {
      // 이전 편집 가능한 칸으로
      for (let i = curCell - 1; i >= 0; i--) {
        if (!lockedCells.has(cur.cells[i])) { curCell = i; cellVals.delete(cur.cells[i]); break; }
      }
    }
    updateSelection();
  }

  function checkEntry(ei) {
    const e = layout.entries[ei];
    if (e.solved) return;
    if (!e.cells.every((k) => cellVals.get(k))) return;
    const ok = e.cells.every((k) => cellVals.get(k) === layout.cellMap.get(k).sol);
    if (ok) {
      e.solved = true;
      e.cells.forEach((k) => lockedCells.add(k));
      updateSelection();
      if (layout.entries.every((x) => x.solved)) { win(); return; }
      // 다음 미해결 항목으로
      advanceEntry(1);
    } else {
      mistakes++;
      updateHud();
      e.cells.forEach((k) => {
        const el = cellEls.get(k);
        el.classList.add('flash-bad');
        setTimeout(() => el.classList.remove('flash-bad'), 350);
      });
    }
  }

  function advanceEntry(dirStep) {
    const n = layout.entries.length;
    const ordered = layout.entries.map((e, i) => ({ e, i }))
      .sort((a, b) => (a.e.dir === b.e.dir ? a.e.num - b.e.num : a.e.dir === 'A' ? -1 : 1));
    const pos = ordered.findIndex(({ i }) => i === curEntry);
    for (let step = 1; step <= n; step++) {
      const cand = ordered[(pos + dirStep * step % n + n) % n];
      if (!cand.e.solved || step === n) {
        curEntry = cand.i;
        curCell = firstEditable(cand.e);
        updateSelection();
        return;
      }
    }
  }

  function useHint() {
    if (hintsLeft <= 0) return;
    const cur = layout.entries[curEntry];
    if (cur.solved) return;
    const k = cur.cells[curCell];
    if (lockedCells.has(k)) return;
    hintsLeft--;
    hintsUsed++;
    cellVals.set(k, layout.cellMap.get(k).sol);
    revealedCells.add(k);
    const next = cur.cells.findIndex((kk, i) => i > curCell && !lockedCells.has(kk));
    if (next !== -1) curCell = next;
    updateHud();
    updateSelection();
    checkEntry(curEntry);
  }

  function win() {
    if (currentLevel === clearedCount) {
      clearedCount++;
      saveProgress();
    }
    const allDone = clearedCount >= LEVELS.length;
    $('modalEmoji').textContent = '🎉';
    $('modalTitle').textContent = S().clearTitle;
    $('modalText').innerHTML = S().clearText(mistakes, hintsUsed) + (allDone ? '<br><br>' + S().allClearText : '');
    const main = $('modalBtn');
    const sec = $('modalSecondaryBtn');
    sec.classList.remove('hidden');
    const nextIdx = currentLevel + 1;
    if (!allDone && nextIdx < LEVELS.length && isUnlocked(nextIdx)) {
      main.textContent = S().nextLevel;
      main.onclick = () => { $('overlay').classList.add('hidden'); openLevel(nextIdx); };
    } else if (nextIdx < LEVELS.length && !isUnlocked(nextIdx)) {
      main.textContent = S().nextLevel + ' 💎';
      main.onclick = () => { showPaywall(nextIdx); };
    } else {
      main.textContent = S().replay;
      main.onclick = () => { $('overlay').classList.add('hidden'); openLevel(currentLevel); };
    }
    sec.textContent = S().backHome;
    sec.onclick = () => { $('overlay').classList.add('hidden'); renderHome(); show('home'); };
    $('overlay').classList.remove('hidden');
  }

  // ---------- keyboard ----------
  const kb = $('kb');
  ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM⌫'].forEach((row) => {
    const div = document.createElement('div');
    div.className = 'kb-row';
    for (const ch of row) {
      const btn = document.createElement('button');
      btn.textContent = ch;
      if (ch === '⌫') { btn.classList.add('wide'); btn.addEventListener('click', backspace); }
      else btn.addEventListener('click', () => typeLetter(ch));
      div.appendChild(btn);
    }
    kb.appendChild(div);
  });

  document.addEventListener('keydown', (e) => {
    if (!screens.game.classList.contains('active')) return;
    if (!$('overlay').classList.contains('hidden')) return;
    const ch = e.key.toUpperCase();
    if (ch.length === 1 && ch >= 'A' && ch <= 'Z') { typeLetter(ch); e.preventDefault(); }
    else if (e.key === 'Backspace') { backspace(); e.preventDefault(); }
    else if (e.key === 'Tab' || e.key === 'ArrowRight' || e.key === 'ArrowDown') { advanceEntry(1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { advanceEntry(-1); e.preventDefault(); }
  });

  // ---------- bindings ----------
  $('prevClueBtn').addEventListener('click', () => advanceEntry(-1));
  $('nextClueBtn').addEventListener('click', () => advanceEntry(1));
  $('hintBtn').addEventListener('click', useHint);
  $('gameBackBtn').addEventListener('click', () => {
    if (layout.entries.some((e) => e.solved) && !layout.entries.every((e) => e.solved)) {
      if (!confirm(S().quitConfirm)) return;
    }
    renderHome();
    show('home');
  });
  $('resetBtn').addEventListener('click', () => {
    if (confirm(S().resetConfirm)) {
      clearedCount = 0;
      saveProgress();
      renderHome();
    }
  });
  $('langBtn').addEventListener('click', () => {
    lang = lang === 'en' ? 'ko' : 'en';
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) { /* private mode */ }
    applyLang();
    renderHome();
  });

  applyLang();
  renderHome();
  if (justPaidLevel) showThanks(justPaidLevel);
})();
</script>
</body>
</html>
