<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧲</text></svg>">
<title>자석 구슬 — 색깔별로 모으는 퍼즐</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1830">
<style>
:root {
  --board-bg: radial-gradient(125% 100% at 50% 0%, #1d2a4f 0%, #0f1830 55%, #080d1c 100%);
  --panel: #1c2846;
  --panel-line: rgba(255, 255, 255, 0.09);
  --text: #eaf0ff;
  --muted: #8794b8;
  --accent: #4fb8ff;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}

html, body { height: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  background: var(--board-bg);
  color: var(--text);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

#app {
  position: relative;
  height: 100dvh;
  width: 100%;
  max-width: 540px;
  display: flex;
  flex-direction: column;
  padding: calc(6px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom));
  background: var(--board-bg);
}

/* 넓은 화면에서는 여백에 흩어지지 않도록 기기 형태의 프레임 안에 담는다 */
@media (min-width: 600px) and (min-height: 700px) {
  body {
    background: radial-gradient(120% 85% at 50% -10%, #16203d 0%, #080c18 62%, #05070f 100%);
    padding: 24px;
  }
  #app {
    height: min(calc(100dvh - 48px), 900px);
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, 0.09);
    box-shadow: 0 34px 90px rgba(0, 0, 0, 0.62);
    overflow: hidden;
    padding-top: 16px;
    padding-bottom: 16px;
  }
}

#topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 2px;
}

#levelLabel { font-weight: 800; font-size: 19px; letter-spacing: -0.2px; }
#moveLabel {
  color: var(--muted);
  font-size: 13px;
  margin-top: 1px;
  font-variant-numeric: tabular-nums;
}

.hud-right { display: flex; gap: 7px; }

.hud-btn {
  width: 40px;
  height: 40px;
  border-radius: 13px;
  border: 1px solid var(--panel-line);
  background: var(--panel);
  color: var(--text);
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: transform 0.08s, opacity 0.15s;
}
.hud-btn:active { transform: scale(0.92); }
.hud-btn:disabled { opacity: 0.35; }

#board { flex: 1; width: 100%; display: block; min-height: 0; }

#banner {
  position: absolute;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  max-width: min(92vw, 480px);
  background: #23305a;
  border: 1px solid #3d5088;
  padding: 11px 18px;
  border-radius: 15px;
  font-size: 14px;
  font-weight: 600;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  z-index: 20;
}

#overlay {
  position: absolute;
  inset: 0;
  background: rgba(6, 10, 22, 0.68);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  display: grid;
  place-items: center;
  z-index: 30;
}

.overlay-card {
  background: var(--panel);
  padding: 30px 34px;
  border-radius: 22px;
  text-align: center;
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
  animation: pop 0.32s cubic-bezier(0.2, 1.4, 0.4, 1);
}
@keyframes pop {
  from { transform: scale(0.72); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.overlay-card h2 { font-size: 25px; margin-bottom: 8px; letter-spacing: -0.3px; }
#overlayInfo { color: var(--muted); font-size: 14px; margin-bottom: 20px; }

.overlay-actions { display: flex; gap: 10px; justify-content: center; }

.ghost-btn {
  background: rgba(255, 255, 255, 0.07);
  color: var(--text);
  border: 1px solid rgba(255, 255, 255, 0.14);
  font-size: 15px;
  font-weight: 700;
  font-family: inherit;
  padding: 13px 20px;
  border-radius: 15px;
  cursor: pointer;
  transition: transform 0.08s;
}
.ghost-btn:active { transform: scale(0.95); }

#btnNext {
  background: linear-gradient(180deg, #5cc4ff, #2b7ff0);
  color: #fff;
  border: 0;
  font-size: 16px;
  font-weight: 800;
  font-family: inherit;
  padding: 13px 28px;
  border-radius: 15px;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(43, 127, 240, 0.45);
  transition: transform 0.08s;
}
#btnNext:active { transform: scale(0.95); }

/* 레벨 목차 */
#levelSelect {
  position: absolute;
  inset: 0;
  z-index: 40;
  background: rgba(6, 10, 22, 0.74);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  /* grid + place-items 로는 카드의 max-height 가 안 먹어서 화면을 넘친다.
     flex 컨테이너에서는 자식의 max-height 가 확실히 적용된다. */
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  overflow: hidden;
}

.ls-card {
  width: 100%;
  max-height: 100%;
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 4px;
  background: var(--panel);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 22px;
  padding: 18px;
  box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
  animation: pop 0.26s cubic-bezier(0.2, 1.4, 0.4, 1);
}

.ls-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.ls-head h2 { font-size: 19px; letter-spacing: -0.2px; }
.ls-note { color: var(--muted); font-size: 12px; margin-bottom: 10px; }

/* 별 — 이모지는 기기마다 렌더링이 제각각이라 도형으로 그린다 */
.stars { display: flex; gap: 7px; justify-content: center; margin-bottom: 10px; }

.star {
  width: 28px;
  height: 28px;
  background: rgba(255, 255, 255, 0.13);
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
}
.star.on {
  background: linear-gradient(180deg, #ffe27a, #ffb524);
  animation: starPop 0.42s cubic-bezier(0.2, 1.6, 0.4, 1) backwards;
}
.star.on:nth-child(2) { animation-delay: 0.13s; }
.star.on:nth-child(3) { animation-delay: 0.26s; }

@keyframes starPop {
  0% { transform: scale(0.2) rotate(-40deg); opacity: 0; }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}

.rescue-note {
  color: #ffd98a;
  font-size: 14px;
  font-weight: 700;
  margin: -8px 0 18px;
}

/* 전면 광고 자리 */
#adSlot {
  position: absolute;
  inset: 0;
  z-index: 50;
  background: rgba(4, 6, 14, 0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
}

.ad-frame {
  width: 100%;
  max-width: 420px;
  max-height: 100%;
  display: flex;
  flex-direction: column;
  border-radius: 18px;
  border: 1px dashed rgba(255, 255, 255, 0.22);
  background: #131b30;
  overflow: hidden;
}

.ad-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 10px 9px 12px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.ad-tag {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.14em;
  color: var(--muted);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 5px;
  padding: 2px 6px;
}

.ad-close {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.16);
  background: rgba(255, 255, 255, 0.07);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  display: grid;
  place-items: center;
  cursor: pointer;
}
.ad-close:disabled { cursor: default; color: var(--muted); }

.ad-body {
  flex: 1;
  min-height: 190px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 28px 22px;
  text-align: center;
}
.ad-title { font-size: 17px; font-weight: 800; color: var(--muted); }
.ad-sub { font-size: 12px; color: var(--muted); opacity: 0.8; line-height: 1.5; max-width: 30ch; }

/* 여정 지도 */
.j-total {
  margin-left: auto;
  margin-right: 4px;
  display: flex;
  align-items: center;
  gap: 5px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.j-total .star { width: 15px; height: 15px; }

#journey {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  overflow-y: auto;
  padding: 10px 0 14px;
  /* 세로 플렉스 안에서 스크롤되려면 min-height: 0 이 있어야 한다.
     없으면 내용 높이만큼 늘어나 카드가 화면을 넘치고 헤더가 밀려난다. */
  flex: 1;
  min-height: 0;
}

/* 길 — 노드 뒤로 흐르는 점선 */
#journey::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 4px;
  bottom: 4px;
  width: 3px;
  margin-left: -1.5px;
  background: repeating-linear-gradient(
    180deg,
    rgba(255, 255, 255, 0.17) 0 6px,
    transparent 6px 14px
  );
}

.jn {
  position: relative;
  /* 세로 플렉스 안에서 눌려 타원이 되지 않게 축소를 막는다 */
  flex: 0 0 auto;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.14);
  background: #22304f;
  color: var(--text);
  font-family: inherit;
  font-size: 17px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: transform 0.08s;
}
.jn:active { transform: scale(0.92); }

/* 길을 따라 좌우로 흔들리게 */
#journey > .jn:nth-of-type(4n + 1) { transform: translateX(-56px); }
#journey > .jn:nth-of-type(4n + 3) { transform: translateX(56px); }
#journey > .jn:nth-of-type(4n + 1):active { transform: translateX(-56px) scale(0.92); }
#journey > .jn:nth-of-type(4n + 3):active { transform: translateX(56px) scale(0.92); }

.jn .jstars {
  position: absolute;
  bottom: -9px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 2px;
}
.jn .jstars .star { width: 11px; height: 11px; }

.jn.cleared {
  background: linear-gradient(180deg, #2f76c9, #1f4f96);
  border-color: rgba(140, 205, 255, 0.55);
}
.jn.current {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(79, 184, 255, 0.35), 0 0 18px rgba(79, 184, 255, 0.5);
}

/* 구출 지점 — 갇힌 친구 */
.jf {
  position: relative;
  flex: 0 0 auto;
  width: 66px;
  height: 66px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at 32% 30%, rgba(255, 255, 255, 0.5), var(--c) 42%, rgba(0, 0, 0, 0.35));
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
  filter: saturate(0.15) brightness(0.5);
  transition: filter 0.4s;
}
.jf.freed {
  filter: none;
  box-shadow: 0 0 22px -2px var(--c), 0 6px 20px rgba(0, 0, 0, 0.4);
}

/* 얼굴 — 갇혀 있을 땐 자고, 구출되면 웃는다 */
.jf .eye {
  position: absolute;
  top: 26px;
  width: 7px;
  height: 8px;
  border-radius: 50%;
  background: rgba(28, 26, 48, 0.85);
}
.jf .eye.l { left: 20px; }
.jf .eye.r { right: 20px; }
.jf:not(.freed) .eye { height: 2px; border-radius: 2px; top: 30px; }

.jf .mouth {
  position: absolute;
  top: 38px;
  width: 20px;
  height: 11px;
  border: 2px solid rgba(28, 26, 48, 0.8);
  border-top: 0;
  border-radius: 0 0 20px 20px;
}
.jf:not(.freed) .mouth { width: 10px; height: 6px; }

/* 마지막 친구는 왕관을 쓴다 */
.jf .crown {
  position: absolute;
  top: -13px;
  width: 30px;
  height: 15px;
  background: linear-gradient(180deg, #ffe27a, #ffb524);
  clip-path: polygon(0 100%, 100% 100%, 100% 28%, 78% 58%, 50% 0, 22% 58%, 0 28%);
}
.jf:not(.freed) .crown { filter: grayscale(1) brightness(0.6); }

/* 길(점선)이 글자를 관통하지 않게 배경을 깐다 */
.jf-label {
  position: relative;
  flex: 0 0 auto;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  margin-top: -4px;
  padding: 2px 9px;
  border-radius: 8px;
  background: var(--panel);
}

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.hidden { display: none !important; }

</style>
</head>
<body>
<div id="app">
    <header id="topbar">
      <div class="hud-left">
        <div id="levelLabel">레벨 1</div>
        <div id="moveLabel">0수</div>
      </div>
      <div class="hud-right">
        <button id="btnLevels" class="hud-btn" title="여정 지도" aria-label="여정 지도">☰</button>
        <button id="btnUndo" class="hud-btn" title="되돌리기" aria-label="되돌리기">↩︎</button>
        <button id="btnRestart" class="hud-btn" title="다시하기" aria-label="다시하기">⟳</button>
        <button id="btnMute" class="hud-btn" title="소리 켜기/끄기" aria-label="소리">🔊</button>
      </div>
    </header>

    <canvas id="board"></canvas>

    <div id="banner" class="hidden"></div>

    <div id="overlay" class="hidden">
      <div class="overlay-card">
        <h2 id="overlayTitle">레벨 클리어!</h2>
        <div id="starRow" class="stars">
          <span class="star"></span><span class="star"></span><span class="star"></span>
        </div>
        <p id="overlayInfo"></p>
        <p id="overlayRescue" class="rescue-note hidden"></p>
        <div class="overlay-actions">
          <button id="btnLevelsFromWin" class="ghost-btn">여정</button>
          <button id="btnNext">다음 레벨 ▶</button>
        </div>
      </div>
    </div>

    <div id="adSlot" class="hidden">
      <div class="ad-frame">
        <div class="ad-head">
          <span class="ad-tag">광고</span>
          <button id="adClose" class="ad-close" disabled>5</button>
        </div>
        <div class="ad-body">
          <p class="ad-title">광고 자리</p>
          <p class="ad-sub">광고 SDK를 연결하면 이 자리에 전면 광고가 표시됩니다.</p>
        </div>
      </div>
    </div>

    <div id="levelSelect" class="hidden">
      <div class="ls-card">
        <div class="ls-head">
          <h2>여정</h2>
          <div id="journeyTotal" class="j-total"></div>
          <button id="btnCloseLevels" class="hud-btn" title="닫기" aria-label="닫기">✕</button>
        </div>
        <div id="journey"></div>
      </div>
    </div>
  </div>
<script type="module">

const safeStorage = (() => {
  try {
    localStorage.setItem('__probe', '1');
    localStorage.removeItem('__probe');
    return localStorage;
  } catch {
    const mem = new Map();
    return {
      getItem: (k) => (mem.has(k) ? mem.get(k) : null),
      setItem: (k, v) => mem.set(k, String(v)),
      removeItem: (k) => mem.delete(k),
    };
  }
})();

// ===== sort-engine/colors.js =====
// 색 정의와 혼합 규칙 (RYB 물감 모델)
// 1차색 둘을 섞으면 2차색이 된다. 2차색은 더 이상 섞이지 않는다.

const PRIMARIES = ['R', 'Y', 'B'];
const SECONDARIES = ['O', 'G', 'P'];

const MIX_TABLE = {
  'R|Y': 'O', // 빨강 + 노랑 = 주황
  'B|Y': 'G', // 노랑 + 파랑 = 초록
  'B|R': 'P', // 빨강 + 파랑 = 보라
};

function isPrimary(color) {
  return PRIMARIES.includes(color);
}

// 두 색이 만났을 때의 결과 색. 같은 색이면 그대로, 섞을 수 없는 조합이면 null.
function mixOf(a, b) {
  if (a === b) return a;
  return MIX_TABLE[[a, b].sort().join('|')] ?? null;
}

// 2차색을 구성하는 1차색 쌍. 1차색이 들어오면 null.
function componentsOf(color) {
  for (const [pair, result] of Object.entries(MIX_TABLE)) {
    if (result === color) return pair.split('|');
  }
  return null;
}

// 물감 한 통을 흔들었을 때 나오는 색.
// - 전부 같은 색이면 그 색 (흔들 필요 없음)
// - 서로 다른 두 1차색이 정확히 반반이면 2차색
// - 그 외(비율이 안 맞거나, 3색 이상이거나, 2차색이 섞여 있으면)는 null = 섞을 수 없음
// 순서는 상관없다. 중요한 건 비율뿐이다.
function blendOf(units) {
  if (!units.length) return null;
  const counts = new Map();
  for (const u of units) counts.set(u, (counts.get(u) || 0) + 1);
  if (counts.size === 1) return units[0];
  if (counts.size !== 2) return null;
  const [[a, ca], [b, cb]] = [...counts];
  if (ca !== cb) return null;
  if (!isPrimary(a) || !isPrimary(b)) return null;
  return mixOf(a, b);
}

// ===== sort-engine/state.js =====
// 게임 상태: { capacity, bottles }
// bottles[i]는 색 문자열 배열, 인덱스 0이 병 바닥이고 마지막이 맨 위.

function createState(capacity, bottles) {
  return { capacity, bottles: bottles.map((b) => b.slice()) };
}

function cloneState(state) {
  return { capacity: state.capacity, bottles: state.bottles.map((b) => b.slice()) };
}

// 병 맨 위에서 이어지는 같은 색 구간
function topRun(bottle) {
  const n = bottle.length;
  if (!n) return null;
  const color = bottle[n - 1];
  let count = 1;
  while (count < n && bottle[n - 1 - count] === color) count++;
  return { color, count };
}

function isUniform(bottle) {
  if (!bottle.length) return false;
  for (let i = 1; i < bottle.length; i++) if (bottle[i] !== bottle[0]) return false;
  return true;
}

function isComplete(state, i) {
  const b = state.bottles[i];
  return b.length === state.capacity && isUniform(b);
}

// 병 순서를 무시한 정규화 키 (탐색 중복 제거용)
function stateKey(state) {
  return state.bottles.map((b) => b.join('')).sort().join(',');
}

// 승리: 모든 병이 (빈 병) 또는 (가득 찬 단색 병)이고,
// 완성된 색 목록이 목표 색 목록과 정확히 일치한다.
function isWin(state, targets) {
  const done = [];
  for (let i = 0; i < state.bottles.length; i++) {
    const b = state.bottles[i];
    if (b.length === 0) continue;
    if (!isComplete(state, i)) return false;
    done.push(b[0]);
  }
  if (done.length !== targets.length) return false;
  return done.slice().sort().join('') === targets.slice().sort().join('');
}

// ===== sort-engine/moves.js =====
// 수(move) 규칙.
//
// 이 엔진은 두 가지 행동을 안다:
//   { type: 'pour',  from, to }  — 맨 위 같은 색 덩어리를 다른 병으로 옮긴다. 절대 섞이지 않는다.
//   { type: 'shake', at }        — 병을 흔들어 안의 물감을 비율대로 한 색으로 만든다.
//
// 붓기가 섞지 않는 게 핵심이다. 병 안에 다른 색이 층층이 쌓여 있어도 그냥 쌓여 있을 뿐이고,
// 흔들어야 비로소 섞인다. 그래서 "이미 닿아 있는데 왜 안 섞이지?"라는 모순이 없다.
//
// rules.freePour = true  → 아무 색 위에나 부을 수 있다 (섞이지 않으니 막을 이유가 없다)
// rules.freePour = false → 같은 색 위 또는 빈 병에만 (클래식 워터소트)
// rules.shake            → 흔들기 사용 가능 여부



const CLASSIC_RULES = { freePour: false, shake: false };
const SHAKE_RULES = { freePour: true, shake: true };

// 완성돼서 더 이상 손댈 수 없는 병.
// 흔들어 만든 2차색 병은 목표 그 자체라 잠근다 (실수로 부어서 스스로 망칠 수 없게).
// 1차색으로 가득 찬 병은 잠그지 않는다 — 거기서 정확한 양을 덜어내야 하는 경우가 많다.
function isLocked(state, i, rules = CLASSIC_RULES) {
  const b = state.bottles[i];
  if (!b || b.length !== state.capacity || !isUniform(b)) return false;
  return rules.shake ? !isPrimary(b[0]) : true;
}

function canPour(state, from, to, rules = CLASSIC_RULES) {
  if (from === to) return false;
  const src = state.bottles[from];
  const dst = state.bottles[to];
  if (!src || !dst) return false;
  if (src.length === 0) return false;
  if (dst.length >= state.capacity) return false;
  if (isLocked(state, from, rules)) return false;
  if (rules.freePour) return true;
  if (dst.length === 0) return true;
  return src[src.length - 1] === dst[dst.length - 1];
}

// 붓기 실행. 맨 위 같은 색 구간이 (공간이 허락하는 만큼) 그대로 옮겨간다.
// 색은 절대 변하지 않는다. 정확한 양을 옮기고 싶으면 목적지의 남은 공간으로 조절해야 한다 —
// 이 "공간으로 양을 재는" 감각이 퍼즐의 핵심이다.
// 반환: { state, from, to, amount, color } 또는 불가 시 null
function pour(state, from, to, rules = CLASSIC_RULES) {
  if (!canPour(state, from, to, rules)) return null;
  const next = cloneState(state);
  const src = next.bottles[from];
  const dst = next.bottles[to];
  const run = topRun(src);
  const amount = Math.min(run.count, next.capacity - dst.length);
  src.length -= amount;
  for (let i = 0; i < amount; i++) dst.push(run.color);
  return { state: next, from, to, amount, color: run.color };
}

// 흔들 수 있는가. 가득 찬 병이면서, 서로 다른 두 1차색이 정확히 반반일 때만.
// 이미 단색인 병은 흔들어봐야 그대로라 제외한다.
function canShake(state, i, rules = CLASSIC_RULES) {
  if (!rules.shake) return false;
  const b = state.bottles[i];
  if (!b || b.length !== state.capacity) return false;
  if (isUniform(b)) return false;
  return blendOf(b) !== null;
}

// 흔들었을 때 나올 색 (미리보기용). 못 흔들면 null.
function shakePreview(state, i, rules = CLASSIC_RULES) {
  return canShake(state, i, rules) ? blendOf(state.bottles[i]) : null;
}

// 흔들기 실행. 반환: { state, at, color, from } 또는 불가 시 null
function shake(state, i, rules = CLASSIC_RULES) {
  if (!canShake(state, i, rules)) return null;
  const next = cloneState(state);
  const before = next.bottles[i].slice();
  const color = blendOf(before);
  next.bottles[i] = new Array(before.length).fill(color);
  return { state: next, at: i, color, from: before };
}

function applyMove(state, move, rules = CLASSIC_RULES) {
  return move.type === 'shake'
    ? shake(state, move.at, rules)
    : pour(state, move.from, move.to, rules);
}

// 탐색용 합법 수 나열. 무의미한 수는 쳐낸다:
// - 잠긴 병에서는 나갈 수 없다
// - 단색 병 → 빈 병 이동은 상태가 사실상 그대로라 제외
// - 흔들기는 항상 유의미하다 (되돌릴 수 없는 확정 행동)
function legalMoves(state, rules = CLASSIC_RULES) {
  const moves = [];
  const n = state.bottles.length;

  for (let i = 0; i < n; i++) {
    if (canShake(state, i, rules)) moves.push({ type: 'shake', at: i });
  }

  for (let from = 0; from < n; from++) {
    const src = state.bottles[from];
    if (!src.length) continue;
    if (isLocked(state, from, rules)) continue;
    const uniform = isUniform(src);
    for (let to = 0; to < n; to++) {
      if (to === from) continue;
      if (uniform && state.bottles[to].length === 0) continue;
      if (canPour(state, from, to, rules)) moves.push({ type: 'pour', from, to });
    }
  }
  return moves;
}

// ===== sort-engine/solver.js =====
// 가중 A* (greedy 성향) 솔버.
// solved=false && exhausted=true 이면 탐색 공간을 전부 확인한 것 → 확실히 풀 수 없는 상태.
// solved=false && exhausted=false 는 노드 예산 초과 → 판단 불가.



class MinHeap {
  constructor() { this.a = []; }
  get size() { return this.a.length; }
  push(item) {
    const a = this.a;
    a.push(item);
    let i = a.length - 1;
    while (i > 0) {
      const p = (i - 1) >> 1;
      if (a[p].f <= a[i].f) break;
      [a[p], a[i]] = [a[i], a[p]];
      i = p;
    }
  }
  pop() {
    const a = this.a;
    if (!a.length) return null;
    const top = a[0];
    const last = a.pop();
    if (a.length) {
      a[0] = last;
      let i = 0;
      for (;;) {
        const l = 2 * i + 1;
        const r = l + 1;
        let m = i;
        if (l < a.length && a[l].f < a[m].f) m = l;
        if (r < a.length && a[r].f < a[m].f) m = r;
        if (m === i) break;
        [a[m], a[i]] = [a[i], a[m]];
        i = m;
      }
    }
    return top;
  }
}

// 휴리스틱: 아직 못 만든 목표 수 + 물감이 흩어진 정도.
// 같은 색이 여러 병에 나뉘어 있을수록 모으는 데 수가 든다.
function heuristic(state, targets) {
  const done = [];
  const spread = new Map();
  for (const b of state.bottles) {
    if (!b.length) continue;
    if (b.length === state.capacity && isUniform(b)) done.push(b[0]);
    for (const c of new Set(b)) spread.set(c, (spread.get(c) || 0) + 1);
  }
  const remaining = targets.slice();
  for (const c of done) {
    const idx = remaining.indexOf(c);
    if (idx >= 0) remaining.splice(idx, 1);
  }
  let scatter = 0;
  for (const count of spread.values()) scatter += count - 1;
  return remaining.length * 2 + scatter;
}

function solve(state, targets, rules = CLASSIC_RULES, opts = {}) {
  const maxNodes = opts.maxNodes ?? 200000;
  const maxDepth = opts.maxDepth ?? 120;
  const weight = opts.weight ?? 3;

  if (isWin(state, targets)) return { solved: true, moves: [], nodes: 0, exhausted: false };

  const heap = new MinHeap();
  const visited = new Set([stateKey(state)]);
  heap.push({ state, moves: [], f: heuristic(state, targets) * weight });
  let nodes = 0;

  while (heap.size > 0) {
    if (nodes >= maxNodes) return { solved: false, nodes, exhausted: false };
    const cur = heap.pop();
    nodes++;
    if (cur.moves.length >= maxDepth) continue;
    for (const mv of legalMoves(cur.state, rules)) {
      const res = applyMove(cur.state, mv, rules);
      if (!res) continue;
      const key = stateKey(res.state);
      if (visited.has(key)) continue;
      visited.add(key);
      const moves = cur.moves.concat([mv]);
      if (isWin(res.state, targets)) return { solved: true, moves, nodes, exhausted: false };
      heap.push({ state: res.state, moves, f: moves.length + heuristic(res.state, targets) * weight });
    }
  }
  return { solved: false, nodes, exhausted: true };
}

// ===== magnet-ball-sort/render.js =====
// 캔버스 렌더러 — 튜브, 구슬, 자석 집기/날아가기 애니메이션, 충격 연출.
// 게임 로직은 전혀 모르고, 상태와 수(move) 결과만 받아 그린다.
//
// 이 게임의 규칙은 설명 대신 애니메이션으로 전달된다:
// 튜브를 누르면 맨 위 같은 색 구슬들이 자석처럼 딱 붙어 함께 떠오른다.
// 몇 개가 움직일지 손대기 전에 눈으로 보이므로 규칙을 글로 읽을 필요가 없다.
//
// 손맛은 "부딪히는 느낌"에서 나온다. 구슬이 도착만 하지 않고,
// 착지할 때 눌리고 · 아래 구슬들이 밀리고 · 링이 퍼지고 · 화면이 흔들린다.

const COLOR_HEX = {
  R: '#ff4d5a',
  O: '#ff9838',
  Y: '#ffd93d',
  G: '#35d07f',
  C: '#2fd3d3',
  B: '#4a90ff',
  P: '#a96bff',
  K: '#ff6bd0',
};

const COLOR_NAME = {
  R: '빨강', O: '주황', Y: '노랑', G: '초록',
  C: '청록', B: '파랑', P: '보라', K: '분홍',
};

const rgbCache = new Map();
function hexToRgb(hex) {
  let c = rgbCache.get(hex);
  if (!c) {
    c = [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
    rgbCache.set(hex, c);
  }
  return c;
}

// amt > 0 이면 흰쪽, < 0 이면 검은쪽으로. 검정을 직접 섞지 않아 색 정체성이 유지된다.
function shade(hex, amt) {
  const [r, g, b] = hexToRgb(hex);
  const t = Math.abs(amt);
  const target = amt > 0 ? 255 : 0;
  return `rgb(${Math.round(r + (target - r) * t)},${Math.round(g + (target - g) * t)},${Math.round(
    b + (target - b) * t
  )})`;
}
function rgba(hex, a) {
  const [r, g, b] = hexToRgb(hex);
  return `rgba(${r},${g},${b},${a})`;
}

const clamp01 = (t) => Math.max(0, Math.min(1, t));
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeOutBack = (t) => 1 + 2.2 * Math.pow(t - 1, 3) + 1.4 * Math.pow(t - 1, 2);

function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) {
    ctx.roundRect(x, y, w, h, r);
    return;
  }
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// 2차 베지어
function qbez(p0, cp, p1, t) {
  const u = 1 - t;
  return {
    x: u * u * p0.x + 2 * u * t * cp.x + t * t * p1.x,
    y: u * u * p0.y + 2 * u * t * cp.y + t * t * p1.y,
  };
}

const LIFT_GAP = 15; // 튜브 입구와 떠오른 구슬 사이 간격
const IMPACT_DUR = 190; // 착지 충격이 잦아드는 시간(ms)

class Renderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.dpr = Math.min(window.devicePixelRatio || 1, 3);
    this.cssW = 0;
    this.cssH = 0;
    this.state = null;
    this.capacity = 4;
    this.held = null; // { tube, color, count, t0 }
    this.flight = null;
    this.nudge = null; // 잘못 눌렀을 때 흔들기
    this.guide = null;
    this.impacts = []; // 착지·완성 충격 { tube, index, t0, dur, amp }
    this.rings = []; // 퍼지는 링 { x, y, t0, dur, hex, r0, r1 }
    this.faces = new Map(); // 튜브 → 얼굴이 뜨기 시작한 시각
    this.screenShake = null;
    this.particles = [];
    this.rects = [];
    this._loop = this._loop.bind(this);
    requestAnimationFrame(this._loop);
  }

  resize() {
    const w = this.canvas.clientWidth;
    const h = this.canvas.clientHeight;
    if (w < 10 || h < 10) return;
    this.cssW = w;
    this.cssH = h;
    this.canvas.width = Math.round(w * this.dpr);
    this.canvas.height = Math.round(h * this.dpr);
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this._layout();
  }

  setState(state) {
    this.state = state;
    this.capacity = state.capacity;
    this._layout();
  }

  // 맨 위 같은 색 구슬 묶음을 자석처럼 집어 올린다. null이면 놓는다.
  hold(tube, color, count) {
    this.held = tube === null ? null : { tube, color, count, t0: performance.now() };
  }

  setGuide(i) {
    this.guide = i;
  }

  nudgeTube(i) {
    this.nudge = { i, t0: performance.now() };
  }

  clearEffects() {
    this.held = null;
    this.flight = null;
    this.nudge = null;
    this.guide = null;
    this.impacts = [];
    this.rings = [];
    this.faces.clear();
    this.screenShake = null;
    this.particles = [];
  }

  _layout() {
    if (!this.state || this.cssW < 10) {
      this.rects = [];
      return;
    }
    const n = this.state.bottles.length;
    // 한 줄에 최대 5개까지. 튜브가 많아지면 줄을 늘린다.
    const rows = Math.ceil(n / 5);
    const perRow = Math.ceil(n / rows);
    const padX = 14;
    const gap = Math.max(10, Math.min(16, (this.cssW - padX * 2) * 0.035));
    // 구슬이 관 폭을 꽉 채우도록: 한 칸 높이 ≈ 관 내부 폭이 되는 비율
    const ratio = this.capacity * 0.9;
    let tw = Math.min(66, (this.cssW - padX * 2 - gap * (perRow - 1)) / perRow);
    const topPad = 34; // 떠오른 구슬 + 완성 배지 여유
    const bottomPad = 16;
    const rowGap = 52;
    const availH = this.cssH - topPad - bottomPad;
    const thMax = (availH - (rows - 1) * rowGap) / rows;
    const th = Math.min(tw * ratio, thMax);
    tw = th / ratio;

    const contentH = rows * th + (rows - 1) * rowGap;
    const startY = topPad + Math.max(0, (availH - contentH) / 2);
    this.rects = [];
    for (let r = 0; r < rows; r++) {
      const start = r * perRow;
      const count = Math.min(perRow, n - start);
      const totalW = count * tw + (count - 1) * gap;
      const x0 = (this.cssW - totalW) / 2;
      const y = startY + r * (th + rowGap);
      for (let k = 0; k < count; k++) {
        this.rects.push({ x: x0 + k * (tw + gap), y, w: tw, h: th });
      }
    }
  }

  tubeCenter(i) {
    const r = this.rects[i];
    return r ? { x: r.x + r.w / 2, y: r.y + r.h / 2 } : null;
  }

  hitTest(x, y) {
    for (let i = 0; i < this.rects.length; i++) {
      const r = this.rects[i];
      // 위쪽은 떠오른 구슬까지 눌릴 수 있게 넉넉히 잡는다
      if (x >= r.x - 7 && x <= r.x + r.w + 7 && y >= r.y - 46 && y <= r.y + r.h + 10) return i;
    }
    return null;
  }

  _metrics(rect) {
    const pad = 4;
    const slotH = (rect.h - pad * 2) / this.capacity;
    const ballR = Math.min(rect.w - pad * 2, slotH) * 0.46;
    return { pad, slotH, ballR };
  }

  // 튜브 안 k번째 칸(0=바닥) 구슬 중심
  _slotPos(rect, k) {
    const { pad, slotH } = this._metrics(rect);
    return { x: rect.x + rect.w / 2, y: rect.y + rect.h - pad - slotH * (k + 0.5) };
  }

  // 떠오른 묶음의 j번째(0=아래) 구슬 중심. 자석처럼 딱 붙어 있다.
  _heldPos(rect, j) {
    const { ballR } = this._metrics(rect);
    return {
      x: rect.x + rect.w / 2,
      y: rect.y - LIFT_GAP - ballR - j * (ballR * 2 + 0.5),
    };
  }

  // 구슬이 날아가는 애니메이션.
  // amount개는 목적지로, 남은 것(공간 부족)은 원래 튜브로 되돌아간다.
  // onLand(slotIndex)는 구슬 하나가 실제로 착지하는 순간마다 호출된다 — 소리를 여기 맞춘다.
  animateMove({ result, heldCount, onLand, onDone }) {
    const { from, to, amount } = result;
    if (!this.rects[from] || !this.rects[to]) {
      onDone && onDone();
      return;
    }
    this.flight = {
      from,
      to,
      color: result.color,
      amount,
      returning: Math.max(0, heldCount - amount),
      t0: performance.now(),
      TRAVEL: 205, // 빠릿한 게 손맛이 좋다
      STAGGER: 26,
      onLand,
      onDone,
      doneFired: false,
      landedAt: new Map(),
    };
    this.held = null;
  }

  // 착지 충격: 맞은 칸이 눌리고 아래 구슬들이 밀린다.
  addImpact(tube, index, amp = 0.26, dur = IMPACT_DUR) {
    this.impacts.push({ tube, index, t0: performance.now(), dur, amp });
  }

  addRing(x, y, hex, { r0 = 4, r1 = 30, dur = 320 } = {}) {
    this.rings.push({ x, y, hex, r0, r1, dur, t0: performance.now() });
  }

  shakeScreen(mag = 4, dur = 200) {
    this.screenShake = { t0: performance.now(), mag, dur };
  }

  // 튜브 하나가 완성됐을 때: 링 + 구슬이 아래에서 위로 톡톡 튀는 파동 + 살짝 화면 흔들림.
  // 그리고 갇혀 있던 구슬 친구들이 눈을 뜬다 — 이게 정렬하는 이유다.
  completeTube(i, hex) {
    const rect = this.rects[i];
    if (!rect) return;
    const now = performance.now();
    for (let k = 0; k < this.capacity; k++) {
      this.impacts.push({ tube: i, index: k, t0: now + k * 45, dur: 230, amp: 0.3 });
    }
    this.addRing(rect.x + rect.w / 2, rect.y + rect.h / 2, hex, { r0: 8, r1: rect.w * 1.5, dur: 460 });
    this.shakeScreen(3.5, 190);
    this.burstAtTube(i, hex, 20);
    this.faces.set(i, now + 150); // 파동이 지나간 뒤 얼굴이 뜬다
  }

  burstAtTube(i, hex, n = 18) {
    const r = this.rects[i];
    if (!r) return;
    this._burst(r.x + r.w / 2, r.y + 8, hex, n);
  }

  _burst(x, y, hex, n = 14) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 60 + Math.random() * 170;
      this.particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 90,
        g: 420,
        ttl: 0.45 + Math.random() * 0.5,
        age: 0,
        size: 2 + Math.random() * 3,
        color: hex,
        shape: 'circle',
      });
    }
  }

  celebrate() {
    const colors = Object.values(COLOR_HEX);
    for (let i = 0; i < 120; i++) {
      this.particles.push({
        x: Math.random() * this.cssW,
        y: -20 - Math.random() * 60,
        vx: (Math.random() - 0.5) * 90,
        vy: 70 + Math.random() * 160,
        g: 230,
        ttl: 1.4 + Math.random() * 0.9,
        age: 0,
        w: 5 + Math.random() * 4,
        h: 8 + Math.random() * 5,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 9,
        color: colors[(Math.random() * colors.length) | 0],
        shape: 'rect',
      });
    }
  }

  // 특정 칸 구슬이 지금 받고 있는 충격량 → 눌림 정도와 밀림 거리
  _impactAt(tube, index, now) {
    let squash = 1;
    let dy = 0;
    for (const im of this.impacts) {
      if (im.tube !== tube) continue;
      const d = im.index - index; // 0 = 맞은 칸, 1 = 그 아래, 2 = 그 아래아래
      if (d < 0 || d > 2) continue;
      const p = (now - im.t0) / im.dur;
      if (p < 0 || p >= 1) continue;
      const decay = d === 0 ? 1 : d === 1 ? 0.45 : 0.18;
      const amp = Math.pow(1 - p, 2.2) * im.amp * decay;
      squash -= amp;
      dy += amp * 7;
    }
    return { squash: Math.max(0.62, squash), dy };
  }

  // ---------- 매 프레임 ----------

  _loop(now) {
    requestAnimationFrame(this._loop);
    const ctx = this.ctx;
    if (!this.state || !this.rects.length) {
      ctx && ctx.clearRect(0, 0, this.cssW, this.cssH);
      return;
    }
    ctx.clearRect(0, 0, this.cssW, this.cssH);

    // 끝난 충격/링 정리
    if (this.impacts.length) {
      this.impacts = this.impacts.filter((im) => now - im.t0 < im.dur);
    }
    if (this.rings.length) {
      this.rings = this.rings.filter((r) => now - r.t0 < r.dur);
    }

    let sx = 0;
    let sy = 0;
    if (this.screenShake) {
      const p = (now - this.screenShake.t0) / this.screenShake.dur;
      if (p >= 1) this.screenShake = null;
      else {
        const m = this.screenShake.mag * Math.pow(1 - p, 2);
        sx = Math.sin(now / 11) * m;
        sy = Math.cos(now / 8) * m * 0.6;
      }
    }

    ctx.save();
    if (sx || sy) ctx.translate(sx, sy);

    const F = this.flight;
    // 공중에 떠 있어서 튜브에 그리지 않을 구슬 수
    const airborne = new Map();
    if (F) {
      airborne.set(F.to, F.amount);
      if (F.returning) airborne.set(F.from, (airborne.get(F.from) || 0) + F.returning);
    }
    if (this.held) airborne.set(this.held.tube, this.held.count);

    for (let i = 0; i < this.state.bottles.length; i++) {
      const rect = { ...this.rects[i] };
      if (this.nudge && this.nudge.i === i) {
        const el = now - this.nudge.t0;
        if (el < 300) rect.x += Math.sin(el / 16) * 5 * (1 - el / 300);
        else this.nudge = null;
      }
      const balls = this.state.bottles[i];
      const hideTop = airborne.get(i) || 0;
      const visible = balls.slice(0, Math.max(0, balls.length - hideTop));
      const complete = balls.length === this.capacity && new Set(balls).size === 1;
      // 안내 중에는 다른 튜브를 물러나게 하되, 색 구분이 이 게임의 핵심이라 살짝만 죽인다
      const dim = this.guide !== null && i !== this.guide && !(this.held && this.held.tube === i);

      if (dim) ctx.save(), (ctx.globalAlpha = 0.62);
      this._drawTube(rect, visible, i, now, {
        selected: this.held?.tube === i,
        complete,
      });
      if (dim) ctx.restore();
    }

    this._drawRings(now);
    if (this.held) this._drawHeld(now);
    if (F) this._drawFlight(now, F);
    if (!this.held && !F) this._drawGuide(now);
    this._drawParticles(now);

    ctx.restore();
  }

  _drawRings(now) {
    const ctx = this.ctx;
    for (const ring of this.rings) {
      const p = clamp01((now - ring.t0) / ring.dur);
      const r = ring.r0 + (ring.r1 - ring.r0) * easeOutCubic(p);
      ctx.save();
      ctx.strokeStyle = rgba(ring.hex, 0.7 * (1 - p));
      ctx.lineWidth = 3 * (1 - p) + 0.6;
      ctx.beginPath();
      ctx.arc(ring.x, ring.y, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  // 떠오르는 중~떠 있는 묶음
  _drawHeld(now) {
    const H = this.held;
    const rect = this.rects[H.tube];
    if (!rect) return;
    const balls = this.state.bottles[H.tube];
    const base = balls.length - H.count; // 묶음 아래에 남는 구슬 수
    const raw = clamp01((now - H.t0) / 190);
    const t = easeOutBack(raw);
    const hex = COLOR_HEX[H.color];
    // 살짝 위아래로 떠 있는 느낌
    const bob = Math.sin(now / 420) * 2;
    // 솟아오를 때 살짝 늘어난다 (자석에 끌려 올라가는 느낌)
    const stretch = 1 + 0.2 * (1 - raw) * (raw > 0 ? 1 : 0);
    const { ballR } = this._metrics(rect);

    for (let j = 0; j < H.count; j++) {
      const from = this._slotPos(rect, base + j);
      const to = this._heldPos(rect, j);
      const p = {
        x: from.x + (to.x - from.x) * t,
        y: from.y + (to.y - from.y) * t + bob * t,
      };
      this._drawBall(p.x, p.y, ballR, hex, { magnet: raw > 0.55, squash: stretch });
    }
  }

  _drawFlight(now, F) {
    const el = now - F.t0;
    const srcRect = this.rects[F.from];
    const dstRect = this.rects[F.to];
    const hex = COLOR_HEX[F.color];
    const { ballR } = this._metrics(dstRect);
    const dstLen = this.state.bottles[F.to].length;
    const srcLen = this.state.bottles[F.from].length;
    let allDone = true;

    // 목적지로 날아가는 구슬
    for (let j = 0; j < F.amount; j++) {
      // 묶음 위쪽 구슬이 먼저 떠난다 (자석에서 떨어지듯)
      const order = F.amount - 1 - j;
      const start = order * F.STAGGER;
      const t = clamp01((el - start) / F.TRAVEL);
      const slotIndex = dstLen - F.amount + j;
      const p0 = this._heldPos(srcRect, F.returning + order);
      const p1 = this._slotPos(dstRect, slotIndex);
      const cp = { x: (p0.x + p1.x) / 2, y: Math.min(p0.y, p1.y) - 46 };

      if (t < 1) {
        allDone = false;
        const e = easeInOut(t);
        // 잔상 — 빠른 움직임이 눈에 남게. 입체 구슬을 반투명하게 겹치면 어두운 얼룩처럼
        // 보이므로, 밝은 단색 원으로 그려 색이 흐르는 궤적처럼 읽히게 한다.
        const ctx = this.ctx;
        for (const [back, alpha] of [[0.14, 0.16], [0.07, 0.3]]) {
          const g = qbez(p0, cp, p1, easeInOut(Math.max(0, t - back)));
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = shade(hex, 0.2);
          ctx.beginPath();
          ctx.arc(g.x, g.y, ballR * 0.88, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        const p = qbez(p0, cp, p1, e);
        this._drawBall(p.x, p.y, ballR, hex, {});
      } else {
        if (!F.landedAt.has(j)) {
          F.landedAt.set(j, now);
          this.addImpact(F.to, slotIndex);
          this.addRing(p1.x, p1.y, hex, { r0: ballR * 0.7, r1: ballR * 2.1, dur: 260 });
          F.onLand && F.onLand(slotIndex);
        }
        const { squash, dy } = this._impactAt(F.to, slotIndex, now);
        this._drawBall(p1.x, p1.y + dy, ballR, hex, { squash });
      }
    }

    // 공간이 없어 되돌아가는 구슬
    for (let j = 0; j < F.returning; j++) {
      const t = clamp01(el / (F.TRAVEL * 0.75));
      if (t < 1) allDone = false;
      const p0 = this._heldPos(srcRect, j);
      const slotIndex = srcLen - F.returning + j;
      const p1 = this._slotPos(srcRect, slotIndex);
      const e = easeOutCubic(t);
      const r = this._metrics(srcRect).ballR;
      if (t >= 1) {
        const { squash, dy } = this._impactAt(F.from, slotIndex, now);
        this._drawBall(p1.x, p1.y + dy, r, hex, { squash });
      } else {
        this._drawBall(p0.x, p0.y + (p1.y - p0.y) * e, r, hex, {});
      }
    }

    if (allDone) {
      this.flight = null;
      if (!F.doneFired) {
        F.doneFired = true;
        F.onDone && F.onDone();
      }
    }
  }

  _drawTube(rect, balls, tubeIndex, now, { selected, complete }) {
    const ctx = this.ctx;
    const { x, y, w, h } = rect;
    const r = w * 0.42;
    const { ballR } = this._metrics(rect);

    // 바닥 그림자
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath();
    ctx.ellipse(x + w / 2, y + h + 6, w * 0.4, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    if (selected || complete) {
      ctx.save();
      ctx.shadowColor = selected ? 'rgba(120,200,255,0.85)' : 'rgba(255,214,110,0.6)';
      ctx.shadowBlur = selected ? 20 : 15;
      rr(ctx, x, y, w, h, r);
      ctx.fillStyle = 'rgba(255,255,255,0.02)';
      ctx.fill();
      ctx.restore();
    }

    // 유리관
    rr(ctx, x, y, w, h, r);
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fill();

    // 구슬 — 충격을 받은 칸은 눌리고 밀린다.
    // 완성된 튜브의 구슬은 눈을 뜬다 (갇혀 있던 친구가 깨어난 것)
    const faceAt = complete ? (this.faces.get(tubeIndex) ?? -Infinity) : null;
    const faceIn = faceAt === null ? 0 : clamp01((now - faceAt) / 260);
    for (let k = 0; k < balls.length; k++) {
      const p = this._slotPos(rect, k);
      const { squash, dy } = this._impactAt(tubeIndex, k, now);
      this._drawBall(p.x, p.y + dy, ballR, COLOR_HEX[balls[k]], {
        squash,
        face: faceIn > 0 ? faceIn : 0,
        faceSeed: tubeIndex * 7 + k,
        now,
      });
    }

    // 유리 광택
    ctx.save();
    rr(ctx, x + 1, y + 1, w - 2, h - 2, r - 1);
    ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    rr(ctx, x + w * 0.14, y + 8, w * 0.15, h - 16, w * 0.075);
    ctx.fill();
    ctx.restore();

    rr(ctx, x, y, w, h, r);
    ctx.strokeStyle = selected ? 'rgba(160,215,255,0.8)' : 'rgba(255,255,255,0.26)';
    ctx.lineWidth = selected ? 2.2 : 1.5;
    ctx.stroke();

    // 입구
    ctx.beginPath();
    ctx.ellipse(x + w / 2, y + 1, w / 2 - 2, 3.2, 0, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.32)';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    if (complete) {
      const bx = x + w - 2;
      const by = y - 6;
      ctx.save();
      ctx.fillStyle = '#ffd166';
      ctx.beginPath();
      ctx.arc(bx, by, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.lineWidth = 2.2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(bx - 3.6, by + 0.2);
      ctx.lineTo(bx - 1, by + 3);
      ctx.lineTo(bx + 3.8, by - 2.8);
      ctx.stroke();
      ctx.restore();
    }
  }

  // 깨어난 구슬 친구의 얼굴. grow는 0~1 (뜨는 중), seed로 눈 깜빡임 타이밍을 흩는다.
  _drawFace(r, grow, seed, now) {
    const ctx = this.ctx;
    const s = easeOutBack(clamp01(grow));
    if (s <= 0) return;
    // 3초쯤마다 한 번씩, 구슬마다 다른 시점에 깜빡인다
    const cycle = (now / 1000 + seed * 0.83) % 3.2;
    const blink = cycle < 0.13 ? 1 - Math.abs(cycle - 0.065) / 0.065 : 0;
    const eyeR = r * 0.13 * s;
    const eyeY = -r * 0.16;
    const eyeX = r * 0.3;

    ctx.save();
    ctx.fillStyle = 'rgba(28,26,48,0.88)';
    for (const sx of [-eyeX, eyeX]) {
      ctx.beginPath();
      if (blink > 0.4) {
        // 감은 눈 — 짧은 선
        ctx.ellipse(sx, eyeY, eyeR * 1.15, eyeR * 0.22, 0, 0, Math.PI * 2);
      } else {
        ctx.ellipse(sx, eyeY, eyeR, eyeR * 1.2, 0, 0, Math.PI * 2);
      }
      ctx.fill();
    }
    // 웃는 입
    ctx.strokeStyle = 'rgba(28,26,48,0.8)';
    ctx.lineWidth = Math.max(1.1, r * 0.075) * s;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, r * 0.1, r * 0.32 * s, 0.28 * Math.PI, 0.72 * Math.PI);
    ctx.stroke();
    ctx.restore();
  }

  // 금속 느낌의 구슬. magnet=true면 자석에 붙은 듯 테두리가 빛난다.
  // squash < 1 이면 납작하게 눌리고, > 1 이면 위로 늘어난다.
  // face > 0 이면 깨어난 얼굴을 그린다.
  _drawBall(cx, cy, r, hex, { magnet = false, squash = 1, face = 0, faceSeed = 0, now = 0 }) {
    const ctx = this.ctx;
    ctx.save();
    ctx.translate(cx, cy);
    if (squash !== 1) ctx.scale(1 / squash, squash);

    if (magnet) {
      ctx.shadowColor = 'rgba(170,225,255,0.95)';
      ctx.shadowBlur = 11;
    }
    // 검정을 섞으면 색이 탁해져 구분이 어려워진다. 같은 색의 명암만 쓴다.
    const g = ctx.createRadialGradient(-r * 0.3, -r * 0.34, r * 0.08, 0, 0, r * 1.08);
    g.addColorStop(0, shade(hex, 0.62));
    g.addColorStop(0.34, hex);
    g.addColorStop(1, shade(hex, -0.3));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // 위쪽 하이라이트
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.ellipse(-r * 0.28, -r * 0.4, r * 0.28, r * 0.18, -0.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = magnet ? 'rgba(200,240,255,0.9)' : 'rgba(0,0,0,0.22)';
    ctx.lineWidth = magnet ? 1.6 : 1;
    ctx.beginPath();
    ctx.arc(0, 0, r - 0.5, 0, Math.PI * 2);
    ctx.stroke();

    if (face > 0) this._drawFace(r, face, faceSeed, now);
    ctx.restore();
  }

  // 튜토리얼: 눌러야 할 튜브 위 맥동 링 + 손가락
  _drawGuide(now) {
    if (this.guide === null) return;
    const r = this.rects[this.guide];
    if (!r) return;
    const ctx = this.ctx;
    const cx = r.x + r.w / 2;
    const cy = r.y + r.h * 0.5;
    const beat = (Math.sin(now / 330) + 1) / 2;

    ctx.save();
    ctx.strokeStyle = `rgba(255,255,255,${0.45 - 0.32 * beat})`;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.arc(cx, cy, 19 + beat * 15, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.translate(cx + 2, cy - 6 + beat * 9);
    ctx.rotate(0.28);
    ctx.scale(1.25, 1.25);
    ctx.lineJoin = 'round';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(20,24,48,0.92)';
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = 'rgba(0,0,0,0.45)';
    ctx.shadowBlur = 12;
    ctx.shadowOffsetY = 4;
    rr(ctx, -5.5, 0, 11, 33, 5.5); // 검지
    ctx.fill();
    ctx.stroke();
    rr(ctx, -23, 30, 15, 12, 6); // 엄지
    ctx.fill();
    ctx.stroke();
    rr(ctx, -16, 26, 33, 29, 12); // 주먹
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  _drawParticles(now) {
    if (!this.particles.length) return;
    const ctx = this.ctx;
    const dt = Math.min(0.033, (now - (this._lastP || now)) / 1000);
    this._lastP = now;
    const alive = [];
    for (const p of this.particles) {
      p.age += dt;
      if (p.age >= p.ttl) continue;
      p.vy += p.g * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.vr) p.rot += p.vr * dt;
      ctx.save();
      ctx.globalAlpha = clamp01((p.ttl - p.age) / (p.ttl * 0.3));
      ctx.fillStyle = p.color;
      if (p.shape === 'rect') {
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
      alive.push(p);
    }
    this.particles = alive;
  }
}

// ===== magnet-ball-sort/audio.js =====
// WebAudio 신시사이저 — 오디오 파일 없이 코드로만 효과음을 만든다.
// 모바일 정책상 첫 사용자 제스처에서 컨텍스트가 열린다.

const STORAGE_MUTED = 'mbs.muted';

class Sound {
  constructor() {
    this.muted = safeStorage.getItem(STORAGE_MUTED) === '1';
    this._ctx = null;
  }

  get ctx() {
    if (typeof AudioContext === 'undefined' && typeof webkitAudioContext === 'undefined') return null;
    if (!this._ctx) {
      try {
        this._ctx = new (window.AudioContext || window.webkitAudioContext)();
      } catch {
        return null;
      }
    }
    if (this._ctx.state === 'suspended') this._ctx.resume().catch(() => {});
    return this._ctx;
  }

  setMuted(m) {
    this.muted = m;
    safeStorage.setItem(STORAGE_MUTED, m ? '1' : '0');
  }

  _tone(freq, { type = 'sine', dur = 0.12, gain = 0.1, delay = 0, slide = 0 } = {}) {
    if (this.muted) return;
    const ctx = this.ctx;
    if (!ctx) return;
    try {
      const t0 = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t0 + dur);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(gain, t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
      osc.connect(g).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
    } catch {}
  }

  _click({ dur = 0.05, freq = 2200, gain = 0.13, delay = 0 } = {}) {
    if (this.muted) return;
    const ctx = this.ctx;
    if (!ctx) return;
    try {
      const t0 = ctx.currentTime + delay;
      const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = freq;
      filter.Q.value = 1.4;
      const g = ctx.createGain();
      g.gain.setValueAtTime(gain, t0);
      g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
      src.connect(filter).connect(g).connect(ctx.destination);
      src.start(t0);
    } catch {}
  }

  // 진동. 안드로이드 크롬은 지원하고 iOS 사파리는 무시한다 — 있으면 손맛이 확 올라간다.
  buzz(pattern) {
    if (this.muted) return;
    try {
      navigator.vibrate?.(pattern);
    } catch {}
  }

  // 자석에 붙는 소리: 짧은 저음 툭 + 금속성 딸깍
  pick(count) {
    this._tone(180, { type: 'sine', dur: 0.09, gain: 0.08, slide: 90 });
    for (let i = 0; i < Math.min(count, 4); i++) {
      this._click({ freq: 2600 + i * 220, gain: 0.06, delay: 0.02 * i });
    }
    this.buzz(9);
  }

  // 구슬 하나가 착지하는 소리. 튜브가 찰수록 음이 올라간다 — 쌓이는 쾌감의 핵심.
  land(slotIndex) {
    const scale = [523, 587, 659, 784, 880, 988];
    const pitch = scale[Math.min(slotIndex, scale.length - 1)];
    this._click({ freq: 1900 + slotIndex * 260, gain: 0.1, dur: 0.035 });
    this._tone(pitch, { type: 'triangle', dur: 0.08, gain: 0.07 });
    this._tone(pitch / 2, { type: 'sine', dur: 0.06, gain: 0.05 });
    this.buzz(12);
  }

  complete() {
    this._tone(880, { type: 'triangle', dur: 0.13, gain: 0.09 });
    this._tone(1320, { type: 'triangle', dur: 0.2, gain: 0.08, delay: 0.07 });
    this.buzz([0, 26, 40, 26]);
  }

  win() {
    [523, 659, 784, 1047].forEach((f, i) =>
      this._tone(f, { type: 'triangle', dur: 0.26, gain: 0.11, delay: i * 0.09 })
    );
    this.buzz([0, 40, 60, 40, 60, 70]);
  }

  error() {
    this._tone(140, { type: 'square', dur: 0.09, gain: 0.05 });
    this.buzz(24);
  }
}

// ===== magnet-ball-sort/ads.js =====
// 전면 광고(인터스티셜) 자리와 노출 빈도 관리.
//
// 광고 네트워크는 갈아끼울 수 있게 provider 로 분리했다. 기본값은 자리만 보여주는
// 플레이스홀더고, 실제 SDK를 붙일 때는 provider 하나만 바꾸면 된다 (README 참고).
//
// 빈도 규칙이 이 파일의 핵심이다. 광고는 수익보다 리텐션을 더 빨리 망가뜨릴 수 있어서
// "언제 안 띄울지"가 "언제 띄울지"보다 중요하다:
//   - 초반 몇 판은 무조건 안 띄운다 (재미를 느끼기 전에 끊으면 그대로 이탈한다)
//   - 퍼즐 도중에는 절대 안 띄운다. 레벨을 깬 뒤 "다음 레벨"을 누를 때만 띄운다
//   - 다시하기(재도전)에는 안 띄운다. 재도전에 벌을 주면 아무도 안 한다
//   - 레벨 수 조건과 시간 간격을 함께 본다 (빨리 깨는 사람에게 연속으로 뜨지 않게)

const STORAGE_AD = 'mbs.ads';

const AD_CONFIG = {
  // 이 판수를 깨기 전에는 광고를 띄우지 않는다
  freeLevels: 3,
  // 그 뒤로는 이 판수마다
  everyNLevels: 2,
  // 아무리 빨리 깨도 이 시간(초) 안에는 두 번 띄우지 않는다
  minSecondsBetween: 45,
  // 닫기 버튼이 열리기까지의 시간(초). 실제 전면 광고와 비슷한 호흡을 준다
  countdownSeconds: 5,
};

// 광고 자리만 보여주는 기본 제공자. 실제 광고를 넣지 않아도 흐름과 호흡을 확인할 수 있다.
// config 는 값이 아니라 객체째로 받는다 — 매니저와 같은 객체를 공유해야 설정이 엇갈리지 않는다.
function createPlaceholderProvider({ root, closeBtn, config = AD_CONFIG }) {
  return {
    name: 'placeholder',
    isReady: () => true,
    show() {
      return new Promise((resolve) => {
        let left = config.countdownSeconds;
        root.classList.remove('hidden');
        closeBtn.disabled = true;
        closeBtn.textContent = String(left);

        const tick = setInterval(() => {
          left -= 1;
          if (left > 0) {
            closeBtn.textContent = String(left);
            return;
          }
          clearInterval(tick);
          closeBtn.disabled = false;
          closeBtn.textContent = '✕';
          closeBtn.setAttribute('aria-label', '광고 닫기');
        }, 1000);

        const done = () => {
          clearInterval(tick);
          closeBtn.removeEventListener('click', done);
          root.classList.add('hidden');
          resolve();
        };
        closeBtn.addEventListener('click', done);
      });
    },
  };
}

class AdManager {
  constructor({ provider, config = AD_CONFIG, enabled = true }) {
    this.provider = provider;
    this.config = config;
    this.enabled = enabled;
    this.showing = false;

    let saved = {};
    try {
      saved = JSON.parse(safeStorage.getItem(STORAGE_AD) || '{}');
    } catch {
      saved = {};
    }
    this.clearedTotal = Number(saved.clearedTotal) || 0;
    this.clearedSinceAd = Number(saved.clearedSinceAd) || 0;
    // 마지막 광고 시각은 저장하지 않는다 — 앱을 다시 열었을 때
    // "너무 이르다"는 이유로 건너뛰는 게 더 이상하다.
    this.lastShownAt = 0;
  }

  _save() {
    try {
      safeStorage.setItem(
        STORAGE_AD,
        JSON.stringify({ clearedTotal: this.clearedTotal, clearedSinceAd: this.clearedSinceAd })
      );
    } catch {}
  }

  // 레벨을 하나 깼다. 광고를 띄울지는 여기서 세고, 실제 노출은 maybeShow에서 한다.
  noteLevelCleared() {
    this.clearedTotal += 1;
    this.clearedSinceAd += 1;
    this._save();
  }

  shouldShow(now = Date.now()) {
    if (!this.enabled || this.showing) return false;
    if (this.clearedTotal <= this.config.freeLevels) return false;
    if (this.clearedSinceAd < this.config.everyNLevels) return false;
    if (this.lastShownAt && now - this.lastShownAt < this.config.minSecondsBetween * 1000) {
      return false;
    }
    return this.provider.isReady();
  }

  // 조건이 맞으면 광고를 띄우고, 닫힐 때까지 기다린다. 조건이 안 맞으면 즉시 넘어간다.
  async maybeShow(now = Date.now()) {
    if (!this.shouldShow(now)) return false;
    this.showing = true;
    try {
      await this.provider.show();
    } catch {
      // 광고를 못 띄워도 게임 흐름은 멈추지 않는다
    }
    this.showing = false;
    this.clearedSinceAd = 0;
    this.lastShownAt = Date.now();
    this._save();
    return true;
  }
}

// ===== magnet-ball-sort/game.js =====
// 게임 컨트롤러 — 입력을 엔진 호출로 바꾸고, HUD/오버레이/목차를 관리한다.
//
// 규칙은 클래식 소트다: 같은 색 위 또는 빈 튜브에만 옮길 수 있다.
// 목표는 화면만 봐도 안다 — 튜브마다 한 색으로 모으기. 그래서 설명 문구가 없다.




// 압축 저장된 레벨 데이터를 푼다 (형식 설명은 levels-data.js 머리말 참고)
const decodeTubes = (tubes) => tubes.map((s) => s.split(''));
function decodeSolution(sol) {
  const moves = [];
  for (let i = 0; i + 1 < sol.length; i += 2) {
    moves.push({ from: Number(sol[i]), to: Number(sol[i + 1]) });
  }
  return moves;
}
const colorsOf = (tubes) => [...new Set(tubes.join(''))];

const STORAGE_LEVEL = 'mbs.level';
const STORAGE_CLEARED = 'mbs.cleared'; // 레벨당 '0'/'1' 한 글자
const STORAGE_STARS = 'mbs.stars'; // 레벨당 '0'~'3' 한 글자

// 첫 판만 손가락으로 짚어준다. 두 번 누르면 옮겨진다는 것만 알면 끝이다.
const GUIDED_LEVELS = new Set([0]);

// 여정: 5레벨마다 갇힌 친구 하나를 구한다. 마지막 친구는 왕관을 쓴다.
const CHAPTER = 5;
const FRIEND_COLORS = ['C', 'G', 'K', 'Y', 'B', 'P', 'O', 'R'];

// 별점 기준. 참고 답안(par) 안에 풀면 3개.
function starsFor(moves, par) {
  if (moves <= par) return 3;
  if (moves <= Math.round(par * 1.4)) return 2;
  return 1;
}

class Game {
  // onCleared: 레벨을 깰 때마다 불린다. 광고 빈도 계산 같은 게임 밖 관심사를 여기로 뺀다.
  constructor({ renderer, sound, dom, onCleared }) {
    this.renderer = renderer;
    this.sound = sound;
    this.dom = dom;
    this.onCleared = onCleared;
    const saved = parseInt(safeStorage.getItem(STORAGE_LEVEL) || '0', 10);
    this.levelIndex = Number.isFinite(saved) ? Math.min(Math.max(saved, 0), LEVEL_DATA.length - 1) : 0;
    const marks = safeStorage.getItem(STORAGE_CLEARED) || '';
    this.cleared = LEVEL_DATA.map((_, i) => marks[i] === '1');
    const starMarks = safeStorage.getItem(STORAGE_STARS) || '';
    this.stars = LEVEL_DATA.map((_, i) => {
      const n = parseInt(starMarks[i] || '0', 10);
      return Number.isFinite(n) ? Math.min(Math.max(n, 0), 3) : 0;
    });
    this.busy = false;
    this.won = false;
    this.selected = null;
  }

  get level() {
    return LEVEL_DATA[this.levelIndex];
  }

  saveProgress() {
    safeStorage.setItem(STORAGE_CLEARED, this.cleared.map((c) => (c ? '1' : '0')).join(''));
    safeStorage.setItem(STORAGE_STARS, this.stars.join(''));
  }

  get totalStars() {
    return this.stars.reduce((a, b) => a + b, 0);
  }

  // 몇 번째 친구까지 구했는지. 챕터(4레벨)를 다 깨면 그 친구가 풀려난다.
  friendFreed(chapterIndex) {
    const last = (chapterIndex + 1) * CHAPTER - 1;
    for (let i = chapterIndex * CHAPTER; i <= Math.min(last, LEVEL_DATA.length - 1); i++) {
      if (!this.cleared[i]) return false;
    }
    return true;
  }

  get chapterCount() {
    return Math.ceil(LEVEL_DATA.length / CHAPTER);
  }

  get rescuedCount() {
    let n = 0;
    for (let c = 0; c < this.chapterCount; c++) if (this.friendFreed(c)) n++;
    return n;
  }

  loadLevel(i) {
    this.levelIndex = Math.min(Math.max(i, 0), LEVEL_DATA.length - 1);
    safeStorage.setItem(STORAGE_LEVEL, String(this.levelIndex));
    const lv = this.level;
    this.state = { capacity: lv.cap, bottles: decodeTubes(lv.tubes) };
    this.targets = colorsOf(lv.tubes);
    this.solution = decodeSolution(lv.sol);
    this.history = [];
    this.selected = null;
    this.won = false;
    this.busy = false;
    this.guided = GUIDED_LEVELS.has(this.levelIndex);
    clearTimeout(this._deadT);
    clearTimeout(this._bannerT);
    clearTimeout(this._winT);

    this.renderer.clearEffects();
    this.renderer.setState(this.state);
    this.dom.overlay.classList.add('hidden');
    this.closeLevels();
    this.hideBanner();
    this.updateHud();
    this.updateGuide();
  }

  release() {
    this.selected = null;
    this.renderer.hold(null);
  }

  // --- 튜토리얼 ---
  nextGuideMove() {
    if (!this.guided || this.won || this.busy) return null;
    return this.solution[this.history.length] || null;
  }

  updateGuide() {
    const g = this.nextGuideMove();
    this.renderer.setGuide(g ? (this.selected === null ? g.from : g.to) : null);
  }

  tap(i) {
    if (this.busy || this.won) return;
    if (!this.state.bottles[i]) return;

    // 집은 걸 다시 놓는 건 안내 중에도 언제나 허용한다 (막으면 답답하다)
    if (i === this.selected) {
      this.release();
      this.updateGuide();
      return;
    }

    const g = this.nextGuideMove();
    if (g) {
      const want = this.selected === null ? g.from : g.to;
      if (i !== want) {
        this.renderer.nudgeTube(i);
        return;
      }
    }

    if (this.selected === null) {
      this.pickUp(i);
      return;
    }

    if (canPour(this.state, this.selected, i, CLASSIC_RULES)) {
      this.doMove(this.selected, i);
    } else {
      // 못 놓는 곳이면 그 튜브를 새로 집어본다. 그것도 안 되면 흔들어 알린다.
      const before = this.selected;
      if (!this.pickUp(i)) {
        this.selected = before;
        this.renderer.nudgeTube(i);
      }
    }
  }

  // 맨 위 같은 색 구슬 묶음을 자석으로 집는다.
  pickUp(i) {
    const balls = this.state.bottles[i];
    if (!balls.length || isLocked(this.state, i, CLASSIC_RULES)) {
      this.renderer.nudgeTube(i);
      this.sound.error();
      return false;
    }
    const run = topRun(balls);
    this.selected = i;
    this.renderer.hold(i, run.color, run.count);
    this.sound.pick(run.count);
    this.updateGuide();
    return true;
  }

  doMove(from, to) {
    const prev = this.state;
    const heldCount = topRun(prev.bottles[from]).count;
    const res = pour(prev, from, to, CLASSIC_RULES);
    if (!res) return;

    this.history.push(prev);
    this.state = res.state;
    // 렌더러도 곧바로 새 상태를 알아야 한다. 옛 상태로 그리면 날아가는 구슬의
    // 목적지 칸 번호가 어긋나 튜브 밖에 그려진다.
    this.renderer.setState(this.state);
    this.selected = null;
    this.busy = true;
    this.hideBanner();
    this.updateHud();
    this.renderer.setGuide(null);

    const completedNow = isComplete(this.state, to) && !isComplete(prev, to);

    this.renderer.animateMove({
      result: res,
      heldCount,
      // 구슬 하나하나가 실제로 닿는 순간에 소리를 낸다 (칸이 높을수록 음이 올라간다)
      onLand: (slotIndex) => this.sound.land(slotIndex),
      onDone: () => {
        this.busy = false;
        this.renderer.setState(this.state);
        this.updateHud();
        if (completedNow) {
          this.renderer.completeTube(to, COLOR_HEX[res.color]);
          this.sound.complete();
        }
        if (isWin(this.state, this.targets)) this.win();
        else {
          this.updateGuide();
          this.scheduleDeadCheck();
        }
      },
    });
  }

  undo() {
    if (this.busy || this.won || !this.history.length) return;
    this.state = this.history.pop();
    this.release();
    this.renderer.setState(this.state);
    this.hideBanner();
    this.updateHud();
    this.updateGuide();
    this.sound.pick(1);
  }

  restart() {
    if (this.busy) return;
    this.loadLevel(this.levelIndex);
  }

  next() {
    const last = this.levelIndex >= LEVEL_DATA.length - 1;
    this.loadLevel(last ? 0 : this.levelIndex + 1);
  }

  scheduleDeadCheck() {
    clearTimeout(this._deadT);
    this._deadT = setTimeout(() => {
      if (this.won || this.busy) return;
      const r = solve(this.state, this.targets, CLASSIC_RULES, { maxNodes: 25000 });
      if (!r.solved && r.exhausted) {
        this.showBanner('🚫 더 이상 풀 수 없어요 — 되돌리기(↩︎)를 눌러보세요', true);
      }
    }, 160);
  }

  win() {
    this.won = true;
    this.release();
    this.sound.win();
    this.renderer.setGuide(null);
    this.renderer.celebrate();

    const chapter = Math.floor(this.levelIndex / CHAPTER);
    const wasFreed = this.friendFreed(chapter);
    const earned = starsFor(this.history.length, this.level.par);
    this.cleared[this.levelIndex] = true;
    this.stars[this.levelIndex] = Math.max(this.stars[this.levelIndex], earned);
    this.saveProgress();
    const nowFreed = this.friendFreed(chapter);

    if (this.levelIndex + 1 < LEVEL_DATA.length) {
      safeStorage.setItem(STORAGE_LEVEL, String(this.levelIndex + 1));
    }

    const last = this.levelIndex >= LEVEL_DATA.length - 1;
    this.dom.overlayTitle.textContent = last ? '🎉 모두 구했어요!' : `레벨 ${this.levelIndex + 1} 클리어!`;
    this.dom.overlayInfo.textContent = `${this.history.length}수 · 참고 답안 ${this.level.par}수`;
    this.dom.btnNext.textContent = last ? '처음부터 다시 ↻' : '다음 레벨 ▶';

    // 별은 오버레이가 뜰 때 하나씩 튀어나오게 (클래스를 다시 붙여 애니메이션 재생)
    [...this.dom.starRow.children].forEach((el, i) => {
      el.classList.remove('on');
      if (i < earned) void el.offsetWidth, el.classList.add('on');
    });

    // 챕터를 막 끝냈다면 친구 한 명이 풀려난다 — 이게 이 여정의 보상이다
    if (nowFreed && !wasFreed) {
      this.dom.overlayRescue.textContent = `친구를 구했어요! (${this.rescuedCount}/${this.chapterCount})`;
      this.dom.overlayRescue.classList.remove('hidden');
    } else {
      this.dom.overlayRescue.classList.add('hidden');
    }

    this._winT = setTimeout(() => this.dom.overlay.classList.remove('hidden'), 800);
    this.onCleared?.(this.levelIndex);
  }

  updateHud() {
    const done = this.state.bottles.filter((_, i) => isComplete(this.state, i)).length;
    this.dom.levelLabel.textContent = `레벨 ${this.levelIndex + 1}`;
    this.dom.moveLabel.textContent = `완성 ${done}/${this.targets.length} · ${this.history.length}수`;
    this.dom.btnUndo.disabled = !this.history.length;
  }

  // --- 여정 지도 ---
  // 프로토타입이라 전부 열어둔다. 실제 출시 때는 클리어한 다음 레벨까지만 여는 게 맞다.
  openLevels() {
    this.buildJourney();
    this.dom.levelSelect.classList.remove('hidden');
    // 현재 레벨이 보이도록 스크롤
    const cur = this.dom.journey.querySelector('.jn.current');
    if (cur) cur.scrollIntoView({ block: 'center' });
  }

  closeLevels() {
    this.dom.levelSelect.classList.add('hidden');
  }

  toggleLevels() {
    if (this.dom.levelSelect.classList.contains('hidden')) this.openLevels();
    else this.closeLevels();
  }

  // 길을 따라 늘어선 레벨들과, 4레벨마다 놓인 갇힌 친구.
  // 목표가 지도에 그려져 있으니 "왜 하는지"를 글로 설명할 필요가 없다.
  buildJourney() {
    const road = this.dom.journey;
    road.innerHTML = '';

    this.dom.journeyTotal.innerHTML = `<span class="star on"></span>${this.totalStars} / ${
      LEVEL_DATA.length * 3
    }`;

    LEVEL_DATA.forEach((lv, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className =
        'jn' + (this.cleared[i] ? ' cleared' : '') + (i === this.levelIndex ? ' current' : '');
      btn.textContent = String(i + 1);
      btn.setAttribute(
        'aria-label',
        `레벨 ${i + 1} — 색 ${colorsOf(lv.tubes).length}가지, 별 ${this.stars[i]}개`
      );

      if (this.stars[i] > 0) {
        const row = document.createElement('span');
        row.className = 'jstars';
        for (let s = 0; s < 3; s++) {
          const st = document.createElement('span');
          st.className = 'star' + (s < this.stars[i] ? ' on' : '');
          row.appendChild(st);
        }
        btn.appendChild(row);
      }

      btn.addEventListener('click', () => this.loadLevel(i));
      road.appendChild(btn);

      // 챕터의 마지막 레벨 다음에 친구를 놓는다
      const chapter = Math.floor(i / CHAPTER);
      const isChapterEnd = (i + 1) % CHAPTER === 0 || i === LEVEL_DATA.length - 1;
      if (!isChapterEnd) return;

      const freed = this.friendFreed(chapter);
      const isLast = chapter === this.chapterCount - 1;
      const friend = document.createElement('div');
      friend.className = 'jf' + (freed ? ' freed' : '');
      friend.style.setProperty('--c', COLOR_HEX[FRIEND_COLORS[chapter % FRIEND_COLORS.length]]);
      friend.setAttribute(
        'aria-label',
        `${isLast ? '마지막 친구' : `${chapter + 1}번째 친구`} — ${freed ? '구출 완료' : '아직 갇혀 있음'}`
      );
      friend.innerHTML =
        (isLast ? '<span class="crown"></span>' : '') +
        '<span class="eye l"></span><span class="eye r"></span><span class="mouth"></span>';
      road.appendChild(friend);

      const label = document.createElement('div');
      label.className = 'jf-label';
      label.textContent = freed ? '구출 완료' : isLast ? '마지막 친구' : '갇혀 있음';
      road.appendChild(label);
    });
  }

  showBanner(text, sticky = false) {
    clearTimeout(this._bannerT);
    this.dom.banner.textContent = text;
    this.dom.banner.classList.remove('hidden');
    if (!sticky) this._bannerT = setTimeout(() => this.hideBanner(), 2300);
  }

  hideBanner() {
    this.dom.banner.classList.add('hidden');
  }

  // 디버그/검증용
  autoWin() {
    if (this.won) return true;
    let moves;
    if (this.history.length === 0) {
      moves = this.solution;
    } else {
      const r = solve(this.state, this.targets, CLASSIC_RULES, { maxNodes: 800000 });
      if (!r.solved) return false;
      moves = r.moves;
    }
    for (const mv of moves) {
      const res = pour(this.state, mv.from, mv.to, CLASSIC_RULES);
      if (!res) return false;
      this.history.push(this.state);
      this.state = res.state;
    }
    this.release();
    this.renderer.setState(this.state);
    this.renderer.setGuide(null);
    this.updateHud();
    if (isWin(this.state, this.targets)) {
      this.win();
      return true;
    }
    return false;
  }
}

// 부트스트랩 — DOM 연결, 입력, 리사이즈, 디버그 API.





const $ = (id) => document.getElementById(id);
const dom = {
  board: $('board'),
  levelLabel: $('levelLabel'),
  moveLabel: $('moveLabel'),
  btnUndo: $('btnUndo'),
  btnRestart: $('btnRestart'),
  btnMute: $('btnMute'),
  btnNext: $('btnNext'),
  levelSelect: $('levelSelect'),
  journey: $('journey'),
  journeyTotal: $('journeyTotal'),
  banner: $('banner'),
  overlay: $('overlay'),
  overlayTitle: $('overlayTitle'),
  overlayInfo: $('overlayInfo'),
  overlayRescue: $('overlayRescue'),
  starRow: $('starRow'),
};

const params = new URLSearchParams(location.search);

const renderer = new Renderer(dom.board);
const sound = new Sound();

// ?noads 로 광고를 끌 수 있다 (개발·자동화 테스트용)
const ads = new AdManager({
  enabled: !params.has('noads'),
  provider: createPlaceholderProvider({
    root: $('adSlot'),
    closeBtn: $('adClose'),
    config: AD_CONFIG,
  }),
});

const game = new Game({
  renderer,
  sound,
  dom,
  onCleared: () => ads.noteLevelCleared(),
});

function updateMuteIcon() {
  dom.btnMute.textContent = sound.muted ? '🔇' : '🔊';
}

dom.board.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const r = dom.board.getBoundingClientRect();
  const i = renderer.hitTest(e.clientX - r.left, e.clientY - r.top);
  if (i !== null) game.tap(i);
  else game.release();
});
dom.board.addEventListener('contextmenu', (e) => e.preventDefault());

dom.btnUndo.addEventListener('click', () => game.undo());
dom.btnRestart.addEventListener('click', () => game.restart());
// 광고는 레벨을 깬 뒤 "다음 레벨"을 누를 때만 띄운다.
// 퍼즐 도중이나 다시하기에는 절대 띄우지 않는다.
dom.btnNext.addEventListener('click', async () => {
  dom.btnNext.disabled = true;
  try {
    await ads.maybeShow();
  } finally {
    dom.btnNext.disabled = false;
  }
  game.next();
});
dom.btnMute.addEventListener('click', () => {
  sound.setMuted(!sound.muted);
  updateMuteIcon();
});

$('btnLevels').addEventListener('click', () => game.toggleLevels());
$('btnCloseLevels').addEventListener('click', () => game.closeLevels());
$('btnLevelsFromWin').addEventListener('click', () => game.openLevels());
dom.levelSelect.addEventListener('click', (e) => {
  if (e.target === dom.levelSelect) game.closeLevels();
});
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') game.closeLevels();
});

new ResizeObserver(() => renderer.resize()).observe(dom.board);
window.addEventListener('resize', () => renderer.resize());

updateMuteIcon();
renderer.resize();
game.loadLevel(game.levelIndex);

// ?debug — 자동화 테스트/개발용 훅
if (params.has('debug')) {
  window.__mbs = {
    game,
    renderer,
    sound,
    ads,
    adsModule: { AdManager, AD_CONFIG },
    levelCount: LEVEL_DATA.length,
    tap: (i) => game.tap(i),
    state: () => game.state,
    loadLevel: (i) => game.loadLevel(i),
    autoWin: () => game.autoWin(),
    center: (i) => {
      const r = dom.board.getBoundingClientRect();
      const c = renderer.tubeCenter(i);
      return c ? { x: r.left + c.x, y: r.top + c.y } : null;
    },
  };
}

</script>
