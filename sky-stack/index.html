<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#aee1f7">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧱</text></svg>">
<title>Sky Stack — Tap to Stack</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <canvas id="board"></canvas>

    <header id="hud">
      <div class="hud-score">
        <div id="scoreLabel">0</div>
        <div id="bestLabel">BEST 0</div>
      </div>
      <div class="hud-right">
        <button id="btnSignup" class="hud-btn hidden" title="Join with email" aria-label="Join with email">✉️</button>
        <button id="btnMute" class="hud-btn" title="Sound on/off" aria-label="Sound">🔊</button>
      </div>
    </header>

    <div id="comboPop"></div>

    <div id="overlay" class="hidden">
      <div class="overlay-card">
        <div id="overlayScore">0</div>
        <div id="overlayBest">BEST 0</div>
        <p class="retry-note">tap to stack again</p>
      </div>
    </div>

    <div id="gate" class="hidden">
      <div class="gate-card">
        <div class="gate-flame">🧱</div>
        <div class="gate-title">SKY STACK</div>
        <p class="gate-sub">tap to stack · how high can you go?</p>
        <div id="googleBtn" class="hidden"></div>
        <div id="gateOr" class="gate-or hidden">or</div>
        <form id="emailForm" novalidate>
          <input id="emailInput" type="email" autocomplete="email" inputmode="email"
                 placeholder="you@email.com" aria-label="Email">
          <button id="btnJoin" type="submit">JOIN</button>
        </form>
        <p class="gate-note">Launch news only. No spam, ever.</p>
        <button id="btnSkip" type="button" class="gate-skip">play as guest →</button>
      </div>
    </div>

    <div id="adSlot" class="hidden">
      <div class="ad-frame">
        <div class="ad-head">
          <span class="ad-tag">AD</span>
          <button id="adClose" class="ad-close" disabled>5</button>
        </div>
        <div class="ad-body">
          <p class="ad-title">Ad placeholder</p>
          <p class="ad-sub">An interstitial ad will appear here once an ad network is connected.</p>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
