<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧱</text></svg>">
<title>Sky Stack — Tap to Stack</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#aee1f7">
<style>
/* 스카이 스택 — 한낮의 하늘. 캔버스가 배경을 다 그리므로 UI는 유리처럼 얇게 얹는다. */

:root {
  --ink: #1b3a52;
  --ink-soft: rgba(27, 58, 82, 0.55);
  --card: rgba(255, 255, 255, 0.88);
  --accent: #ff8a3d;
  --good: #21b573;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

html,
body {
  height: 100%;
  overscroll-behavior: none;
}

body {
  background: #aee1f7;
  color: var(--ink);
  font-family: 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  display: flex;
  justify-content: center;
  touch-action: manipulation;
}

#app {
  position: relative;
  width: 100%;
  max-width: 430px;
  height: 100dvh;
  overflow: hidden;
}

#board {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* ----- HUD ----- */

#hud {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: max(12px, env(safe-area-inset-top)) 16px 0;
  pointer-events: none;
}

.hud-score {
  text-align: left;
}

#scoreLabel {
  font-size: 56px;
  font-weight: 800;
  line-height: 1;
  color: #fff;
  text-shadow: 0 2px 14px rgba(27, 58, 82, 0.35);
  font-variant-numeric: tabular-nums;
}

#bestLabel {
  margin-top: 2px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: rgba(255, 255, 255, 0.85);
  text-shadow: 0 1px 8px rgba(27, 58, 82, 0.3);
}

.hud-right {
  display: flex;
  gap: 6px;
  pointer-events: auto;
}

.hud-btn {
  background: rgba(255, 255, 255, 0.35);
  border: none;
  border-radius: 12px;
  width: 40px;
  height: 40px;
  font-size: 18px;
  cursor: pointer;
  backdrop-filter: blur(4px);
}

/* ----- 퍼펙트 콤보 팝 ----- */

#comboPop {
  position: absolute;
  top: 24%;
  width: 100%;
  text-align: center;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 0.18em;
  color: #fff;
  text-shadow: 0 2px 14px rgba(255, 138, 61, 0.8);
  opacity: 0;
  pointer-events: none;
}

#comboPop.show {
  animation: combo-pop 0.9s;
}

@keyframes combo-pop {
  0% {
    opacity: 0;
    transform: scale(0.6);
  }
  18% {
    opacity: 1;
    transform: scale(1.12);
  }
  30% {
    transform: scale(1);
  }
  75% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    transform: translateY(-14px);
  }
}

.hidden {
  display: none !important;
}

/* ----- 런 종료 오버레이 ----- */

#overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(20, 46, 66, 0.35);
  backdrop-filter: blur(3px);
  z-index: 10;
  cursor: pointer;
}

.overlay-card {
  text-align: center;
  padding: 34px 52px;
  border-radius: 22px;
  background: var(--card);
  box-shadow: 0 20px 60px rgba(20, 46, 66, 0.35);
  animation: card-in 0.35s backwards cubic-bezier(0.2, 0.9, 0.3, 1.15);
}

@keyframes card-in {
  from {
    opacity: 0;
    transform: translateY(18px) scale(0.95);
  }
}

#overlayScore {
  font-size: 64px;
  font-weight: 800;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

#overlayBest {
  margin-top: 6px;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--ink-soft);
}

#overlayBest.new-best {
  color: var(--accent);
}

.retry-note {
  margin-top: 18px;
  font-size: 13px;
  color: var(--ink-soft);
  animation: breathe 1.8s infinite;
}

@keyframes breathe {
  0%, 100% { opacity: 0.55; }
  50% { opacity: 1; }
}

/* ----- 가입 게이트 ----- */

#gate {
  position: absolute;
  inset: 0;
  z-index: 15;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(20, 46, 66, 0.4);
  backdrop-filter: blur(4px);
}

.gate-card {
  width: min(86vw, 330px);
  text-align: center;
  padding: 30px 26px 22px;
  border-radius: 22px;
  background: var(--card);
  box-shadow: 0 20px 60px rgba(20, 46, 66, 0.4);
  animation: card-in 0.35s backwards cubic-bezier(0.2, 0.9, 0.3, 1.15);
}

.gate-flame {
  font-size: 40px;
}

.gate-title {
  margin-top: 6px;
  font-size: 24px;
  font-weight: 800;
  letter-spacing: 0.16em;
}

.gate-sub {
  margin-top: 4px;
  font-size: 13px;
  color: var(--ink-soft);
}

#googleBtn {
  margin-top: 18px;
  display: flex;
  justify-content: center;
  min-height: 44px;
}

.gate-or {
  margin: 10px 0 2px;
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--ink-soft);
}

#emailForm {
  margin-top: 14px;
  display: flex;
  gap: 8px;
}

#emailInput {
  flex: 1;
  min-width: 0;
  user-select: text;
  -webkit-user-select: text;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid rgba(27, 58, 82, 0.25);
  background: #fff;
  color: var(--ink);
  font-size: 15px;
  outline: none;
}

#emailInput:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(255, 138, 61, 0.2);
}

#emailInput::placeholder {
  color: var(--ink-soft);
}

#btnJoin {
  flex: 0 0 auto;
  padding: 12px 18px;
  border-radius: 12px;
  border: none;
  background: var(--accent);
  color: #fff;
  font-weight: 800;
  letter-spacing: 0.08em;
  cursor: pointer;
}

#btnJoin:active {
  transform: scale(0.96);
}

.gate-note {
  margin-top: 12px;
  font-size: 11px;
  color: var(--ink-soft);
}

.gate-skip {
  margin-top: 14px;
  background: none;
  border: none;
  color: var(--ink-soft);
  font-size: 13px;
  cursor: pointer;
}

/* ----- 광고 자리 ----- */

#adSlot {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(10, 25, 36, 0.75);
}

.ad-frame {
  width: min(86vw, 340px);
  border-radius: 16px;
  overflow: hidden;
  background: #fff;
  color: var(--ink);
}

.ad-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 12px;
  background: rgba(27, 58, 82, 0.06);
}

.ad-tag {
  font-size: 11px;
  letter-spacing: 0.15em;
  color: var(--ink-soft);
  border: 1px solid var(--ink-soft);
  border-radius: 4px;
  padding: 1px 6px;
}

.ad-close {
  background: none;
  border: none;
  color: var(--ink);
  font-size: 15px;
  min-width: 28px;
  cursor: pointer;
}

.ad-close:disabled {
  opacity: 0.5;
  cursor: default;
}

.ad-body {
  padding: 38px 20px 44px;
  text-align: center;
}

.ad-title {
  font-weight: 700;
}

.ad-sub {
  margin-top: 8px;
  font-size: 13px;
  color: var(--ink-soft);
}

</style>
</head>
<body>
<div id="app">
    <canvas id="board"></canvas>

    <header id="hud">
      <div class="hud-score">
        <div id="scoreLabel">0</div>
        <div id="bestLabel">BEST 0</div>
      </div>
      <div class="hud-right">
        <button id="btnSignup" class="hud-btn hidden" title="Join with email" aria-label="Join with email">✉️</button>
        <button id="btnMute" class="hud-btn" title="Sound on/off" aria-label="Sound">🔊</button>
      </div>
    </header>

    <div id="comboPop"></div>

    <div id="overlay" class="hidden">
      <div class="overlay-card">
        <div id="overlayScore">0</div>
        <div id="overlayBest">BEST 0</div>
        <p class="retry-note">tap to stack again</p>
      </div>
    </div>

    <div id="gate" class="hidden">
      <div class="gate-card">
        <div class="gate-flame">🧱</div>
        <div class="gate-title">SKY STACK</div>
        <p class="gate-sub">tap to stack · how high can you go?</p>
        <div id="googleBtn" class="hidden"></div>
        <div id="gateOr" class="gate-or hidden">or</div>
        <form id="emailForm" novalidate>
          <input id="emailInput" type="email" autocomplete="email" inputmode="email"
                 placeholder="you@email.com" aria-label="Email">
          <button id="btnJoin" type="submit">JOIN</button>
        </form>
        <p class="gate-note">Launch news only. No spam, ever.</p>
        <button id="btnSkip" type="button" class="gate-skip">play as guest →</button>
      </div>
    </div>

    <div id="adSlot" class="hidden">
      <div class="ad-frame">
        <div class="ad-head">
          <span class="ad-tag">AD</span>
          <button id="adClose" class="ad-close" disabled>5</button>
        </div>
        <div class="ad-body">
          <p class="ad-title">Ad placeholder</p>
          <p class="ad-sub">An interstitial ad will appear here once an ad network is connected.</p>
        </div>
      </div>
    </div>
  </div>
<script type="module">

const safeStorage = (() => {
  try {
    localStorage.setItem('__probe', '1');
    localStorage.removeItem('__probe');
    return localStorage;
  } catch {
    const mem = new Map();
    return {
      getItem: (k) => (mem.has(k) ? mem.get(k) : null),
      setItem: (k, v) => mem.set(k, String(v)),
      removeItem: (k) => mem.delete(k),
    };
  }
})();

// ===== sky-stack/engine.js =====
// 순수 게임 로직 — DOM/캔버스 없음. 고정 스텝 이동, 드롭 판정(자르기/퍼펙트), 속도 곡선.
//
// 결정론이 계약이다: 같은 시드 + 같은 스텝에서의 드롭 = 같은 탑.
// 물리는 고정 dt(1/120초)로만 전진하고, 판정은 전부 이 파일의 순수 함수다.
// 테스트가 이 계약과 자르기 수학을 검증한다.

const DT = 1 / 120; // 고정 물리 스텝(초)

const CONFIG = {
  baseW: 100, // 첫 블록 폭 (월드 단위)
  blockH: 14, // 블록 높이
  travel: 120, // 움직이는 블록 중심의 왕복 범위 (±)
  perfectEps: 3.5, // 이 오차 안이면 퍼펙트 — 폭이 깎이지 않는다
  regrowEvery: 5, // 연속 퍼펙트 n번마다
  regrowAmount: 10, // 폭이 이만큼 회복된다 (baseW 상한)
  speedBase: 85, // 유닛/초
  speedGain: 2.4, // 층당 증가
  speedMax: 275,
};

// mulberry32 — 작고 결정적인 시드 RNG (형제 게임들과 동일. 여기서는 색상 시작점에만 쓴다)
function makeRng(seed) {
  let s = seed >>> 0;
  return function rng() {
    s = (s + 0x6d2b79f5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// 속도 곡선 — 층수에 대해 단조 증가, 상한 있음. 테스트가 검증한다.
function speedAt(floor) {
  return Math.min(CONFIG.speedMax, CONFIG.speedBase + CONFIG.speedGain * floor);
}

function newRun(seed = 0) {
  const rng = makeRng(seed);
  return {
    seed,
    hue0: Math.floor(rng() * 360), // 탑 색의 시작점 — 시드가 하는 일의 전부
    floors: [{ x: 0, w: CONFIG.baseW }], // 바닥 블록
    moving: { x: -CONFIG.travel, dir: 1, w: CONFIG.baseW },
    combo: 0, // 연속 퍼펙트
    over: false,
  };
}

// 층수 = 쌓아 올린 블록 수 (바닥 제외) — 점수 그 자체
function score(s) {
  return s.floors.length - 1;
}

// 고정 스텝 하나만큼 움직이는 블록을 전진시킨다. 가장자리에서 방향을 튕긴다.
function step(s) {
  if (s.over) return;
  const m = s.moving;
  m.x += m.dir * speedAt(score(s)) * DT;
  if (m.x > CONFIG.travel) {
    m.x = CONFIG.travel - (m.x - CONFIG.travel);
    m.dir = -1;
  } else if (m.x < -CONFIG.travel) {
    m.x = -CONFIG.travel + (-CONFIG.travel - m.x);
    m.dir = 1;
  }
}

// 드롭 — 이 게임의 유일한 입력. 결과는 셋 중 하나:
//   perfect: 오차가 perfectEps 안 — 폭 유지, 콤보 증가, regrowEvery마다 폭 회복
//   cut:     겹친 만큼만 남고, 삐져나온 조각은 잘려 떨어진다
//   miss:    겹침이 없다 — 게임 오버
function drop(s) {
  if (s.over) return null;
  const top = s.floors[s.floors.length - 1];
  const m = s.moving;
  const dx = m.x - top.x;

  if (Math.abs(dx) <= CONFIG.perfectEps) {
    s.combo += 1;
    let w = m.w;
    if (s.combo % CONFIG.regrowEvery === 0) {
      w = Math.min(CONFIG.baseW, w + CONFIG.regrowAmount); // 보상: 좁아진 탑이 숨을 돌린다
    }
    s.floors.push({ x: top.x, w });
    spawnNext(s, w);
    return { type: 'perfect', combo: s.combo, floor: score(s) };
  }

  const left = Math.max(top.x - top.w / 2, m.x - m.w / 2);
  const right = Math.min(top.x + top.w / 2, m.x + m.w / 2);
  const overlap = right - left;

  if (overlap <= 0) {
    s.over = true;
    return { type: 'miss', floor: score(s) };
  }

  s.combo = 0;
  const newX = (left + right) / 2;
  // 잘려 나가는 조각 — 렌더러가 떨어뜨리는 연출에 쓴다
  const cutW = m.w - overlap;
  const cutX = dx > 0 ? right + cutW / 2 : left - cutW / 2;
  s.floors.push({ x: newX, w: overlap });
  spawnNext(s, overlap);
  return { type: 'cut', floor: score(s), cut: { x: cutX, w: cutW, side: dx > 0 ? 1 : -1 } };
}

// 다음 블록은 반대편에서 나온다 — 리듬이 좌우로 흔들린다
function spawnNext(s, w) {
  const fromLeft = score(s) % 2 === 1;
  s.moving = {
    x: fromLeft ? -CONFIG.travel : CONFIG.travel,
    dir: fromLeft ? 1 : -1,
    w,
  };
}

// ===== sky-stack/render.js =====
// 캔버스 렌더러 — 탑, 움직이는 블록, 잘려 떨어지는 조각, 하늘 그라데이션.
// 엔진 상태를 읽기만 하고, 게임 규칙은 전혀 모른다.


class Renderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.dpr = Math.min(2, window.devicePixelRatio || 1);
    this.camY = 0; // 카메라가 보는 탑 높이 (블록 단위, 부드럽게 따라간다)
    this.debris = []; // 잘려 떨어지는 조각들 (연출 전용)
    this.flash = 0; // 퍼펙트 잔광
    this.resize();
  }

  resize() {
    const { canvas, dpr } = this;
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    if (!w || !h) return;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }

  reset(state) {
    this.camY = 0;
    this.debris = [];
    this.flash = 0;
    this.state = state;
  }

  // 층 → 블록 색. 시드의 hue0에서 시작해 층마다 색상환을 조금씩 돈다.
  colorAt(state, floor, light = 0) {
    const hue = (state.hue0 + floor * 7) % 360;
    return `hsl(${hue} 62% ${Math.min(88, 58 + light)}%)`;
  }

  addDebris(state, cut, floor) {
    this.debris.push({
      x: cut.x,
      y: floor,
      w: cut.w,
      vy: 0,
      vx: cut.side * 26,
      rot: 0,
      vr: cut.side * (1.4 + Math.min(2, cut.w / 30)),
      color: this.colorAt(state, floor),
    });
  }

  notePerfect() {
    this.flash = 1;
  }

  // dt초만큼 연출(카메라·조각·잔광)을 전진시킨다
  tick(state, dt) {
    const target = Math.max(0, score(state) - 1);
    this.camY += (target - this.camY) * Math.min(1, dt * 7);
    this.flash = Math.max(0, this.flash - dt * 2.4);
    for (const d of this.debris) {
      d.vy -= dt * 340; // 아래로 (월드 y는 위가 +)
      d.y += (d.vy * dt) / CONFIG.blockH;
      d.x += d.vx * dt;
      d.rot += d.vr * dt;
    }
    this.debris = this.debris.filter((d) => d.y > this.camY - 30);
  }

  draw(state) {
    const { ctx, canvas, dpr } = this;
    const W = canvas.width;
    const H = canvas.height;
    if (!W || !H) return;

    // 하늘 — 탑이 높아질수록 새벽 → 한낮 → 성층권으로 미묘하게 어두워진다
    const alt = Math.min(1, this.camY / 120);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, `hsl(${215 + alt * 15} ${70 - alt * 30}% ${74 - alt * 52}%)`);
    g.addColorStop(1, `hsl(${205 + alt * 10} ${62 - alt * 25}% ${86 - alt * 44}%)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 월드 → 화면 변환 (W는 이미 물리 픽셀 — dpr을 다시 곱하지 않는다)
    const unit = W / 300; // 월드 300유닛이 화면 폭
    const cx = W / 2;
    const baseY = H * 0.72; // 탑 기준선
    const yOf = (floorIdx) => baseY - (floorIdx - this.camY) * CONFIG.blockH * unit;
    const bh = CONFIG.blockH * unit;

    const drawBlock = (x, w, y, color, glow = 0) => {
      const px = cx + x * unit - (w * unit) / 2;
      ctx.fillStyle = color;
      if (glow > 0) {
        ctx.save();
        ctx.shadowColor = 'rgba(255,255,255,0.9)';
        ctx.shadowBlur = 26 * glow * dpr;
      }
      ctx.fillRect(px, y - bh, w * unit, bh);
      if (glow > 0) ctx.restore();
      // 윗면 하이라이트·옆면 음영 한 줄씩 — 납작한 그림에 부피감을 준다
      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.fillRect(px, y - bh, w * unit, Math.max(1.5 * dpr, bh * 0.12));
      ctx.fillStyle = 'rgba(0,0,0,0.10)';
      ctx.fillRect(px, y - Math.max(1.5 * dpr, bh * 0.14), w * unit, Math.max(1.5 * dpr, bh * 0.14));
    };

    // 탑 — 화면에 걸리는 층만
    const floors = state.floors;
    const first = Math.max(0, Math.floor(this.camY - baseY / bh));
    for (let i = first; i < floors.length; i++) {
      const y = yOf(i);
      if (y < -bh) break;
      drawBlock(floors[i].x, floors[i].w, y, this.colorAt(state, i));
    }

    // 잘려 떨어지는 조각
    for (const d of this.debris) {
      ctx.save();
      ctx.translate(cx + d.x * unit, yOf(d.y) - bh / 2);
      ctx.rotate(d.rot * 0.35);
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = d.color;
      ctx.fillRect((-d.w * unit) / 2, -bh / 2, d.w * unit, bh);
      ctx.restore();
    }

    // 움직이는 블록 — 다음에 얹힐 자리 위에서 왕복
    if (!state.over) {
      const m = state.moving;
      drawBlock(m.x, m.w, yOf(floors.length), this.colorAt(state, floors.length, 6), this.flash);
    }
  }
}

// ===== sky-stack/audio.js =====
// WebAudio 신시사이저 — 오디오 파일 없이 코드로만 효과음을 만든다.
// 이 게임의 소리는 '음악'에 가깝다: 쌓을 때마다 펜타토닉 음계를 한 계단씩 올라간다.
// 잘 쌓을수록 멜로디가 높아지고, 퍼펙트는 화음으로 보상한다.

const STORAGE_MUTED = 'sky.muted';

// C 메이저 펜타토닉 — 어떤 순서로 울려도 듣기 좋다
const SCALE = [261.63, 293.66, 329.63, 392.0, 440.0];

class Sound {
  constructor() {
    this.muted = safeStorage.getItem(STORAGE_MUTED) === '1';
    this._ctx = null;
  }

  get ctx() {
    if (typeof AudioContext === 'undefined' && typeof webkitAudioContext === 'undefined') return null;
    if (!this._ctx) {
      try {
        this._ctx = new (window.AudioContext || window.webkitAudioContext)();
      } catch {
        return null;
      }
    }
    if (this._ctx.state === 'suspended') this._ctx.resume().catch(() => {});
    return this._ctx;
  }

  setMuted(m) {
    this.muted = m;
    safeStorage.setItem(STORAGE_MUTED, m ? '1' : '0');
  }

  _tone(freq, { type = 'sine', dur = 0.12, gain = 0.1, delay = 0, slide = 0 } = {}) {
    if (this.muted) return;
    const ctx = this.ctx;
    if (!ctx) return;
    try {
      const t0 = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t0 + dur);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(gain, t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
      osc.connect(g).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
    } catch {}
  }

  _note(floor) {
    const idx = floor % SCALE.length;
    const octave = 1 + Math.floor((floor % (SCALE.length * 3)) / SCALE.length); // 3옥타브 순환
    return SCALE[idx] * octave;
  }

  // 탁 — 블록이 얹힌다. 층수가 올라갈수록 음도 올라간다
  place(floor) {
    this._tone(this._note(floor), { type: 'triangle', dur: 0.14, gain: 0.11 });
  }

  // 반짝 — 퍼펙트. 그 층의 음 위로 장3도·5도 화음
  perfect(floor, combo) {
    const f = this._note(floor);
    this._tone(f, { type: 'triangle', dur: 0.2, gain: 0.12 });
    this._tone(f * 1.26, { type: 'sine', dur: 0.22, gain: 0.09, delay: 0.03 });
    this._tone(f * 1.5, { type: 'sine', dur: 0.26, gain: 0.08, delay: 0.06 });
    if (combo >= 3) this._tone(f * 2, { type: 'sine', dur: 0.3, gain: 0.06, delay: 0.09 });
  }

  // 슥 — 조각이 잘려 떨어진다
  cut() {
    this._tone(520, { type: 'sawtooth', dur: 0.08, gain: 0.04, slide: -220 });
  }

  // 우르르 — 빗나갔다. 내려가는 세 음
  over() {
    this._tone(330, { type: 'triangle', dur: 0.18, gain: 0.11 });
    this._tone(262, { type: 'triangle', dur: 0.2, gain: 0.1, delay: 0.12 });
    this._tone(196, { type: 'triangle', dur: 0.34, gain: 0.1, delay: 0.24 });
  }

  // 좌르륵 — 신기록
  best() {
    [523, 659, 784, 1047].forEach((f, i) =>
      this._tone(f, { type: 'triangle', dur: 0.14, gain: 0.1, delay: i * 0.08 })
    );
  }

  // 틱 — 소소한 UI
  ui() {
    this._tone(440, { type: 'sine', dur: 0.05, gain: 0.05 });
  }

  // 가입 완료 팡파레 (게이트에서 쓴다)
  bank() {
    this.best();
  }
}

// ===== sky-stack/ads.js =====
// 전면 광고 자리와 노출 빈도 관리 — 형제 게임들과 같은 뼈대, 다른 단위.
//
// 이 게임의 단위는 '런'다. 규칙:
//   - 처음 몇 런는 무조건 무광고 (긴장의 맛을 느끼기 전에 끊으면 그대로 이탈한다)
//   - 런 도중에는 절대 안 뜬다. 죽거나 챙겨 나온 뒤의 전환 순간에만 뜬다
//   - 몇 초 만에 끝난 런 뒤에는 안 뜬다 (2층 즉사에 광고까지 겹치면 최악이다)
//   - 하루 3런 구조라 실전 런 사이에는 거의 안 뜨고, 자연히 무료 런 구간에 몰린다

const STORAGE_AD = 'sky.ads';

const AD_CONFIG = {
  // 이 횟수만큼 런를 마치기 전에는 광고를 띄우지 않는다
  freeRuns: 5,
  // 그 뒤로는 이 런 수마다
  everyNRuns: 3,
  // 아무리 자주 끝나도 이 시간(초) 안에는 두 번 띄우지 않는다
  minSecondsBetween: 90,
  // 이 시간(초)보다 짧았던 런 뒤에는 띄우지 않는다
  minRunSeconds: 12,
  // 닫기 버튼이 열리기까지의 시간(초)
  countdownSeconds: 5,
};

// 광고 자리만 보여주는 기본 제공자 — 실제 SDK를 붙일 때 이 객체만 갈아끼운다.
function createPlaceholderProvider({ root, closeBtn, config = AD_CONFIG }) {
  return {
    name: 'placeholder',
    isReady: () => true,
    show() {
      return new Promise((resolve) => {
        let left = config.countdownSeconds;
        root.classList.remove('hidden');
        closeBtn.disabled = true;
        closeBtn.textContent = String(left);

        const tick = setInterval(() => {
          left -= 1;
          if (left > 0) {
            closeBtn.textContent = String(left);
            return;
          }
          clearInterval(tick);
          closeBtn.disabled = false;
          closeBtn.textContent = '✕';
          closeBtn.setAttribute('aria-label', 'Close ad');
        }, 1000);

        const done = () => {
          clearInterval(tick);
          closeBtn.removeEventListener('click', done);
          root.classList.add('hidden');
          resolve();
        };
        closeBtn.addEventListener('click', done);
      });
    },
  };
}

class AdManager {
  constructor({ provider, config = AD_CONFIG, enabled = true }) {
    this.provider = provider;
    this.config = config;
    this.enabled = enabled;
    this.showing = false;

    let saved = {};
    try {
      saved = JSON.parse(safeStorage.getItem(STORAGE_AD) || '{}');
    } catch {
      saved = {};
    }
    this.runsTotal = Number(saved.runsTotal) || 0;
    this.runsSinceAd = Number(saved.runsSinceAd) || 0;
    // 마지막 광고 시각은 저장하지 않는다 — 앱을 다시 열었을 때
    // "너무 이르다"는 이유로 건너뛰는 게 더 이상하다.
    this.lastShownAt = 0;
  }

  _save() {
    try {
      safeStorage.setItem(
        STORAGE_AD,
        JSON.stringify({ runsTotal: this.runsTotal, runsSinceAd: this.runsSinceAd })
      );
    } catch {}
  }

  // 런가 하나 끝났다. 노출 여부 판단은 maybeShow에서.
  noteRunEnded() {
    this.runsTotal += 1;
    this.runsSinceAd += 1;
    this._save();
  }

  shouldShow(runSeconds, now = Date.now()) {
    if (!this.enabled || this.showing) return false;
    if (this.runsTotal <= this.config.freeRuns) return false;
    if (this.runsSinceAd < this.config.everyNRuns) return false;
    if (runSeconds < this.config.minRunSeconds) return false;
    if (this.lastShownAt && now - this.lastShownAt < this.config.minSecondsBetween * 1000) {
      return false;
    }
    return this.provider.isReady();
  }

  // 조건이 맞으면 광고를 띄우고 닫힐 때까지 기다린다. 아니면 즉시 넘어간다.
  async maybeShow(runSeconds, now = Date.now()) {
    if (!this.shouldShow(runSeconds, now)) return false;
    this.showing = true;
    try {
      await this.provider.show();
    } catch {
      // 광고를 못 띄워도 게임 흐름은 멈추지 않는다
    }
    this.showing = false;
    this.runsSinceAd = 0;
    this.lastShownAt = Date.now();
    this._save();
    return true;
  }
}

// ===== sky-stack/signup.js =====
// 가입 게이트 — 게임 시작 전에 이메일을 모은다. 서버 없이도 굴러가는 3단 구조:
//
//   1) 이메일 직접 입력 — 항상 켜져 있다. 어디서든(file:// 포함) 동작한다
//   2) Google 원탭 버튼 — SIGNUP_CONFIG.googleClientId를 넣으면 켜진다.
//      구글이 검증한 이메일이 토큰으로 오므로 오타·가짜 메일이 없다
//   3) 수집 — SIGNUP_CONFIG.collectUrl(Apps Script → 구글 시트)로 보낸다.
//      아직 URL이 없거나 오프라인이면 로컬 큐에 쌓아 두고 다음 실행 때 재시도한다
//
// 게이트는 건너뛸 수 있다(play as guest) — 가입 벽에 첫 손맛을 막히게 하지 않는다.
// 건너뛴 사람에게는 HUD에 ✉️ 버튼이 남아 언제든 다시 가입할 수 있다.

const SIGNUP_CONFIG = {
  // Google Cloud Console → APIs & Services → Credentials → OAuth client ID (Web)
  // 예: '1234567890-abc.apps.googleusercontent.com'  (비우면 Google 버튼이 숨는다)
  googleClientId: '',
  // 이메일을 받을 곳. 두 가지 중 하나 (비우면 로컬 큐에만 쌓인다):
  //  A) 구글 폼 (가장 쉬움, 스크립트·배포 불필요): 폼의 …/formResponse URL을 넣고
  //     아래 formEntry에 이메일 질문의 필드 이름(entry.123456789)을 넣는다
  //  B) Apps Script 웹앱 URL (README의 스니펫 참고): formEntry는 비워 둔다
  collectUrl: '',
  formEntry: '',
};

const STORAGE_USER = 'sky.user';
const STORAGE_QUEUE = 'sky.signupQueue';
const GIS_SRC = 'https://accounts.google.com/gsi/client';

// ----- 순수 헬퍼 (테스트 대상) -----

function validateEmail(s) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(s || '').trim());
}

// Google ID 토큰(JWT)의 payload를 읽는다 — 서명 검증은 하지 않는다.
// 여기서는 인증이 아니라 이메일 수집이 목적이라 payload의 email만 쓰면 충분하다.
function decodeJwtPayload(jwt) {
  try {
    const part = String(jwt).split('.')[1];
    if (!part) return null;
    const b64 = part.replace(/-/g, '+').replace(/_/g, '/');
    const pad = b64 + '='.repeat((4 - (b64.length % 4)) % 4);
    const bin = atob(pad);
    const json = decodeURIComponent(
      Array.from(bin, (c) => '%' + c.charCodeAt(0).toString(16).padStart(2, '0')).join('')
    );
    return JSON.parse(json);
  } catch {
    return null;
  }
}

function makeRecord(email, via, dayKey) {
  return { game: 'sky-stack', email: String(email).trim().toLowerCase(), via, day: dayKey, at: new Date().toISOString() };
}

// 수집 요청의 본문을 만든다 — 구글 폼이면 urlencoded, Apps Script면 JSON.
// 둘 다 CORS preflight가 없는 '단순 요청'이라 no-cors로 어디서든 보내진다.
function buildCollectRequest(record, config) {
  if (config.formEntry) {
    return {
      contentType: 'application/x-www-form-urlencoded',
      body: new URLSearchParams({ [config.formEntry]: record.email }).toString(),
    };
  }
  return { contentType: 'text/plain', body: JSON.stringify(record) };
}

// ----- 게이트 -----

class Signup {
  constructor({ dom, sound, dayKey, config = SIGNUP_CONFIG, onDone }) {
    this.dom = dom;
    this.sound = sound;
    this.dayKey = dayKey;
    this.config = config;
    this.onDone = onDone;
    this._gisLoaded = false;

    dom.emailForm.addEventListener('submit', (e) => {
      e.preventDefault();
      this._joinWithEmail();
    });
    dom.btnSkip.addEventListener('click', () => this.skip());
    dom.btnSignup.addEventListener('click', (e) => {
      e.stopPropagation();
      this.show();
    });
  }

  get user() {
    try {
      return JSON.parse(safeStorage.getItem(STORAGE_USER) || 'null');
    } catch {
      return null;
    }
  }

  _saveUser(u) {
    try {
      safeStorage.setItem(STORAGE_USER, JSON.stringify(u));
    } catch {}
  }

  // 아직 가입도 거절도 안 했으면 게이트를 보여준다
  needsGate() {
    return !this.user;
  }

  show() {
    this.dom.gate.classList.remove('hidden');
    this.dom.emailInput.setCustomValidity('');
    this._mountGoogleButton();
    this._updateBadge();
  }

  hide() {
    this.dom.gate.classList.add('hidden');
    this._updateBadge();
    this.onDone?.(this.user);
  }

  // 게스트로 계속 — 강요하지 않는다. HUD의 ✉️로 언제든 돌아올 수 있다
  skip() {
    if (!this.user) this._saveUser({ guest: true });
    this.sound?.ui();
    this.hide();
  }

  _updateBadge() {
    const u = this.user;
    this.dom.btnSignup.classList.toggle('hidden', !!(u && u.email));
  }

  _joinWithEmail() {
    const email = this.dom.emailInput.value;
    if (!validateEmail(email)) {
      this.dom.emailInput.setCustomValidity('Please enter a valid email');
      this.dom.emailInput.reportValidity();
      return;
    }
    this._finish(email, 'email');
  }

  _finish(email, via) {
    this._saveUser({ email: String(email).trim().toLowerCase(), via });
    this._enqueue(makeRecord(email, via, this.dayKey));
    this.flushQueue();
    this.sound?.bank();
    this.hide();
  }

  // ----- Google Identity Services (설정했을 때만) -----

  async _mountGoogleButton() {
    const { googleClientId } = this.config;
    const slot = this.dom.googleBtn;
    const or = this.dom.gateOr;
    if (!googleClientId) {
      slot.classList.add('hidden');
      or.classList.add('hidden');
      return;
    }
    slot.classList.remove('hidden');
    or.classList.remove('hidden');
    try {
      await this._loadGis();
      window.google.accounts.id.initialize({
        client_id: googleClientId,
        callback: (resp) => {
          const payload = decodeJwtPayload(resp && resp.credential);
          if (payload && payload.email) this._finish(payload.email, 'google');
        },
      });
      slot.replaceChildren();
      window.google.accounts.id.renderButton(slot, {
        theme: 'filled_black',
        size: 'large',
        shape: 'pill',
        text: 'continue_with',
        width: 260,
      });
    } catch {
      // GIS를 못 불러오는 환경(오프라인, file://, 웹뷰) — 이메일 폼만으로 계속
      slot.classList.add('hidden');
      or.classList.add('hidden');
    }
  }

  _loadGis() {
    if (this._gisLoaded && window.google?.accounts?.id) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = GIS_SRC;
      s.async = true;
      s.onload = () => {
        this._gisLoaded = true;
        resolve();
      };
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  // ----- 수집 큐 -----

  _queue() {
    try {
      const q = JSON.parse(safeStorage.getItem(STORAGE_QUEUE) || '[]');
      return Array.isArray(q) ? q : [];
    } catch {
      return [];
    }
  }

  _setQueue(q) {
    try {
      safeStorage.setItem(STORAGE_QUEUE, JSON.stringify(q));
    } catch {}
  }

  _enqueue(record) {
    const q = this._queue();
    q.push(record);
    this._setQueue(q);
  }

  // 쌓인 기록을 시트로 보낸다. 성공한 것만 큐에서 뺀다 (앱을 켤 때마다 재시도)
  async flushQueue() {
    const { collectUrl } = this.config;
    if (!collectUrl) return;
    const q = this._queue();
    if (!q.length) return;
    const remaining = [];
    for (const record of q) {
      try {
        const { contentType, body } = buildCollectRequest(record, this.config);
        await fetch(collectUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': contentType },
          body,
        });
      } catch {
        remaining.push(record);
      }
    }
    this._setQueue(remaining);
  }
}

// ===== sky-stack/game.js =====
// 게임 흐름 — 고정 스텝 루프, 입력, 점수/최고 기록, 런 종료 오버레이.
// 규칙 판정은 전부 engine.js에 있고, 여기는 루프·연출·저장만 오케스트레이션한다.


const STORAGE_BEST = 'sky.best';
const STORAGE_RUNS = 'sky.runs';

class Game {
  constructor({ renderer, sound, dom, onRunEnded }) {
    this.r = renderer;
    this.sound = sound;
    this.dom = dom;
    this.onRunEnded = onRunEnded;

    this.best = Number(safeStorage.getItem(STORAGE_BEST)) || 0;
    this.runs = Number(safeStorage.getItem(STORAGE_RUNS)) || 0;
    this.state = null;
    this.acc = 0;
    this.last = 0;
    this.runStartedAt = 0;
    this._ending = false;
    this._forcedSeed = null; // ?seed= 테스트용

    requestAnimationFrame((t) => this._loop(t));
  }

  startRun() {
    const seed = this._forcedSeed != null ? this._forcedSeed : (Math.random() * 0xffffffff) >>> 0;
    this.state = newRun(seed);
    this.r.reset(this.state);
    this._ending = false;
    this.runStartedAt = performance.now();
    this.dom.overlay.classList.add('hidden');
    this._updateHud();
  }

  _updateHud() {
    this.dom.scoreLabel.textContent = String(score(this.state));
    this.dom.bestLabel.textContent = `BEST ${this.best}`;
  }

  // 탭 — 이 게임의 유일한 입력
  tap() {
    const s = this.state;
    if (!s || s.over || this._ending) return;
    const res = drop(s);
    if (!res) return;

    if (res.type === 'perfect') {
      this.sound.perfect(res.floor, res.combo);
      this.r.notePerfect();
      this._popCombo(res.combo);
    } else if (res.type === 'cut') {
      this.sound.place(res.floor);
      this.sound.cut();
      this.r.addDebris(s, res.cut, res.floor);
    } else {
      this._endRun();
      return;
    }
    this._updateHud();
  }

  _popCombo(combo) {
    if (combo < 2) return;
    const el = this.dom.comboPop;
    el.textContent = `PERFECT ×${combo}`;
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');
  }

  async _endRun() {
    const s = this.state;
    this._ending = true;
    this.sound.over();
    const sc = score(s);
    const isBest = sc > this.best;
    if (isBest) {
      this.best = sc;
      try {
        safeStorage.setItem(STORAGE_BEST, String(this.best));
      } catch {}
      setTimeout(() => this.sound.best(), 500);
    }
    this.runs += 1;
    try {
      safeStorage.setItem(STORAGE_RUNS, String(this.runs));
    } catch {}

    // 광고는 런이 끝난 이 전환 순간에만 — 플레이 도중에는 절대 안 뜬다
    const runSeconds = (performance.now() - this.runStartedAt) / 1000;
    await this.onRunEnded?.(runSeconds);

    this.dom.overlayScore.textContent = String(sc);
    this.dom.overlayBest.textContent = isBest ? 'NEW BEST!' : `BEST ${this.best}`;
    this.dom.overlayBest.classList.toggle('new-best', isBest);
    this.dom.overlay.classList.remove('hidden');
  }

  continueFromOverlay() {
    if (this.dom.overlay.classList.contains('hidden')) return;
    this.startRun();
  }

  _loop(t) {
    requestAnimationFrame((t2) => this._loop(t2));
    if (!this.state) return;
    const dtMs = Math.min(100, t - (this.last || t));
    this.last = t;
    this.acc += dtMs / 1000;
    while (this.acc >= DT) {
      step(this.state);
      this.acc -= DT;
    }
    this.r.tick(this.state, dtMs / 1000);
    this.r.draw(this.state);
  }
}

// ===== sky-stack/main.js =====
// 부트스트랩 — DOM 연결, 입력(탭 하나), 리사이즈, 가입 게이트, 디버그 API.







const $ = (id) => document.getElementById(id);
const dom = {
  app: $('app'),
  board: $('board'),
  scoreLabel: $('scoreLabel'),
  bestLabel: $('bestLabel'),
  btnMute: $('btnMute'),
  comboPop: $('comboPop'),
  overlay: $('overlay'),
  overlayScore: $('overlayScore'),
  overlayBest: $('overlayBest'),
  gate: $('gate'),
  googleBtn: $('googleBtn'),
  gateOr: $('gateOr'),
  emailForm: $('emailForm'),
  emailInput: $('emailInput'),
  btnSkip: $('btnSkip'),
  btnSignup: $('btnSignup'),
};

const params = new URLSearchParams(location.search);

function localDayKey() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

const renderer = new Renderer(dom.board);
const sound = new Sound();

// ?noads 로 광고를 끌 수 있다 (개발·자동화 테스트용)
const ads = new AdManager({
  enabled: !params.has('noads'),
  provider: createPlaceholderProvider({
    root: $('adSlot'),
    closeBtn: $('adClose'),
    config: AD_CONFIG,
  }),
});

const game = new Game({
  renderer,
  sound,
  dom,
  // 광고는 런이 끝난 전환 순간에만
  onRunEnded: async (runSeconds) => {
    ads.noteRunEnded();
    await ads.maybeShow(runSeconds);
  },
});

// ?seed=123 으로 색상 시작점을 고정할 수 있다 (스크린샷/테스트용)
if (params.has('seed')) game._forcedSeed = Number(params.get('seed')) >>> 0;

// 가입 게이트 — 게임 위에 얹히는 막. ?gclient= / ?collect= / ?entry= 로 설정 임시 주입
const signupConfig = {
  ...SIGNUP_CONFIG,
  googleClientId: params.get('gclient') || SIGNUP_CONFIG.googleClientId,
  collectUrl: params.get('collect') || SIGNUP_CONFIG.collectUrl,
  formEntry: params.get('entry') || SIGNUP_CONFIG.formEntry,
};
const signup = new Signup({ dom, sound, dayKey: localDayKey(), config: signupConfig });

// ----- 입력 — 탭 하나가 전부 -----

dom.board.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  game.tap();
});

dom.overlay.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  game.continueFromOverlay();
});

function updateMuteIcon() {
  dom.btnMute.textContent = sound.muted ? '🔇' : '🔊';
}
dom.btnMute.addEventListener('click', (e) => {
  e.stopPropagation();
  sound.setMuted(!sound.muted);
  updateMuteIcon();
});
updateMuteIcon();

window.addEventListener('resize', () => renderer.resize());
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault());

game.startRun();

// 게임이 먼저 그려지고, 그 위에 게이트가 얹힌다.
// 이미 가입했거나 게스트를 택한 사람에게는 다시 묻지 않는다 (?signup 으로 강제 표시)
if (params.has('signup') || signup.needsGate()) signup.show();
else signup._updateBadge();
signup.flushQueue(); // 지난번에 못 보낸 이메일이 있으면 재시도

// 디버그/자동화용
window.__sky = { game, ads, signup, engine: { CONFIG, newRun } };

</script>
