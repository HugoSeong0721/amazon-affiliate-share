<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amazon Link Maker</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="friend-shell">
    <section class="friend-card">
      <p class="eyebrow">Amazon link maker</p>
      <h1>Amazon 상품 링크를 넣어주세요.</h1>
      <p class="hero-copy">
        아래에 사고 싶은 Amazon 상품 링크를 붙여넣고 버튼을 누르면, 구매하러 갈 수 있는 새 링크가 만들어집니다.
      </p>

      <form id="linkForm" class="friend-form">
        <label>
          Amazon 상품 링크
          <input id="amazonUrl" type="url" placeholder="https://www.amazon.com/dp/B0..." required>
        </label>

        <button type="submit">링크 만들기</button>
      </form>

      <section class="friend-result" id="result" hidden aria-live="polite">
        <label>
          생성된 링크
          <textarea id="affiliateLink" readonly rows="3"></textarea>
        </label>

        <div class="actions">
          <a id="openAmazon" href="#" target="_blank" rel="noopener">이 링크로 Amazon 열기</a>
          <button type="button" class="secondary" id="copyLink">링크 복사</button>
        </div>
      </section>

      <p class="fine-print">
        링크가 제대로 만들어지면 Amazon 상품 페이지로 이동합니다. 가격과 재고는 Amazon에서 확인해주세요.
      </p>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
