# 게임들을 GitHub Pages로 배포한다.
#
# 공식 Pages 액션(deploy-pages) 대신 gh-pages 브랜치 방식을 쓴다:
# github-pages 환경의 기본 보호 규칙이 main 이외 브랜치의 배포를 막는 반면,
# gh-pages 브랜치는 밀어넣는 것만으로 사이트가 서비스되기 때문이다.
# gh-pages에는 이 워크플로의 빌드 산출물만 들어간다 — 소스 브랜치가 아니다.
#
# 배포 주소:
#   https://hugoseong0721.github.io/amazon-affiliate-share/                    (어필리에이트 도구)
#   https://hugoseong0721.github.io/amazon-affiliate-share/crossword/          (크로스워드)
#   https://hugoseong0721.github.io/amazon-affiliate-share/sky-stack/          (스카이 스택)

name: Deploy games to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/game-idea-differentiation-ij0g9r
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site (웹에 필요한 것만 — 앱 셸·대용량 자산 제외)
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'magnet-balls-app' \
            --exclude 'store-assets' \
            --exclude 'node_modules'

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
