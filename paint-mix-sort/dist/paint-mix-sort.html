<title>페인트 믹스 — 색을 섞는 소트 퍼즐</title>
<style>
:root {
  --bg: #14152b;
  --board-bg: radial-gradient(130% 100% at 50% 0%, #222350 0%, #14152b 52%, #0d0e1f 100%);
  --panel: #222448;
  --panel-line: rgba(255, 255, 255, 0.09);
  --text: #eef0ff;
  --muted: #8b8fb5;
  --accent: #8b6bff;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}

html, body { height: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  background: var(--board-bg);
  color: var(--text);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

#app {
  position: relative;
  height: 100dvh;
  width: 100%;
  max-width: 520px;
  display: flex;
  flex-direction: column;
  padding: calc(6px + env(safe-area-inset-top)) 12px calc(8px + env(safe-area-inset-bottom));
  background: var(--board-bg);
}

/* 넓은 화면에서는 여백에 흩어지지 않도록 기기 형태의 프레임 안에 담는다 */
@media (min-width: 600px) and (min-height: 700px) {
  body {
    background: radial-gradient(120% 85% at 50% -10%, #1b1c3a 0%, #0b0c19 62%, #07080f 100%);
    padding: 24px;
  }
  #app {
    height: min(calc(100dvh - 48px), 880px);
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, 0.09);
    box-shadow: 0 34px 90px rgba(0, 0, 0, 0.62);
    overflow: hidden;
    padding-top: 16px;
    padding-bottom: 16px;
  }
}

#topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 2px;
}

#levelLabel { font-weight: 800; font-size: 19px; letter-spacing: -0.2px; }
#moveLabel { color: var(--muted); font-size: 13px; margin-top: 1px; }

.hud-right { display: flex; gap: 8px; }

.hud-btn {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  border: 1px solid var(--panel-line);
  background: var(--panel);
  color: var(--text);
  font-size: 19px;
  line-height: 1;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: transform 0.08s, opacity 0.15s;
}
.hud-btn:active { transform: scale(0.92); }
.hud-btn:disabled { opacity: 0.35; }

#targetsRow {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 4px 0 2px;
  min-height: 44px;
}
#targetsCaption { color: var(--muted); font-size: 12px; font-weight: 700; }

#targetsBar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

.chip {
  width: 34px;
  height: 34px;
  border-radius: 11px;
  background: var(--c);
  position: relative;
  box-shadow: inset 0 -7px rgba(0, 0, 0, 0.18), inset 0 2px rgba(255, 255, 255, 0.22), 0 2px 8px rgba(0, 0, 0, 0.35);
  transition: opacity 0.25s, transform 0.25s;
}
.chip.done { opacity: 0.35; transform: scale(0.92); }
.chip.done::after {
  content: "✓";
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: #fff;
  font-weight: 900;
  font-size: 19px;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
}

#legend {
  display: flex;
  gap: 16px;
  justify-content: center;
  align-items: center;
  padding: 5px 0 2px;
  color: var(--muted);
  font-size: 12px;
}
.formula { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; }
.dot {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  display: inline-block;
  background: var(--c);
  box-shadow: inset 0 -3px rgba(0, 0, 0, 0.25), inset 0 1px rgba(255, 255, 255, 0.3);
}

#hint {
  text-align: center;
  color: #cfc7ff;
  font-size: 13px;
  padding: 6px 14px 2px;
  line-height: 1.45;
}

#board { flex: 1; width: 100%; display: block; min-height: 0; }

#banner {
  position: absolute;
  left: 50%;
  bottom: calc(26px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  max-width: min(92vw, 480px);
  background: #2c2347;
  border: 1px solid #514179;
  padding: 11px 18px;
  border-radius: 15px;
  font-size: 14px;
  font-weight: 600;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  z-index: 20;
}

#overlay {
  position: absolute;
  inset: 0;
  background: rgba(9, 9, 24, 0.66);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  display: grid;
  place-items: center;
  z-index: 30;
}

.overlay-card {
  background: var(--panel);
  padding: 30px 36px;
  border-radius: 22px;
  text-align: center;
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
  animation: pop 0.35s cubic-bezier(0.2, 1.4, 0.4, 1);
}
@keyframes pop {
  from { transform: scale(0.7); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.overlay-card h2 { font-size: 25px; margin-bottom: 8px; letter-spacing: -0.3px; }
#overlayInfo { color: var(--muted); font-size: 14px; margin-bottom: 20px; }

#btnNext {
  background: linear-gradient(180deg, #9c7dff, #6a48f0);
  color: #fff;
  border: 0;
  font-size: 16px;
  font-weight: 800;
  font-family: inherit;
  padding: 13px 30px;
  border-radius: 15px;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(106, 72, 240, 0.45);
  transition: transform 0.08s;
}
#btnNext:active { transform: scale(0.95); }

.hidden { display: none !important; }

<script type="module">

const safeStorage = (() => {
  try {
    localStorage.setItem('__pms_probe', '1');
    localStorage.removeItem('__pms_probe');
    return localStorage;
  } catch {
    const mem = new Map();
    return {
      getItem: (k) => (mem.has(k) ? mem.get(k) : null),
      setItem: (k, v) => mem.set(k, String(v)),
      removeItem: (k) => mem.delete(k),
    };
  }
})();

// ===== sort-engine/colors.js =====
// 색 정의와 혼합 규칙 (RYB 물감 모델)
// 1차색 둘을 섞으면 2차색이 된다. 2차색은 더 이상 섞이지 않는다.

const PRIMARIES = ['R', 'Y', 'B'];
const SECONDARIES = ['O', 'G', 'P'];

const MIX_TABLE = {
  'R|Y': 'O', // 빨강 + 노랑 = 주황
  'B|Y': 'G', // 노랑 + 파랑 = 초록
  'B|R': 'P', // 빨강 + 파랑 = 보라
};

function isPrimary(color) {
  return PRIMARIES.includes(color);
}

// 두 색이 만났을 때의 결과 색. 같은 색이면 그대로, 섞을 수 없는 조합이면 null.
function mixOf(a, b) {
  if (a === b) return a;
  return MIX_TABLE[[a, b].sort().join('|')] ?? null;
}

// 2차색을 구성하는 1차색 쌍. 1차색이 들어오면 null.
function componentsOf(color) {
  for (const [pair, result] of Object.entries(MIX_TABLE)) {
    if (result === color) return pair.split('|');
  }
  return null;
}

// ===== sort-engine/state.js =====
// 게임 상태: { capacity, bottles }
// bottles[i]는 색 문자열 배열, 인덱스 0이 병 바닥이고 마지막이 맨 위.

function createState(capacity, bottles) {
  return { capacity, bottles: bottles.map((b) => b.slice()) };
}

function cloneState(state) {
  return { capacity: state.capacity, bottles: state.bottles.map((b) => b.slice()) };
}

// 병 맨 위에서 이어지는 같은 색 구간
function topRun(bottle) {
  const n = bottle.length;
  if (!n) return null;
  const color = bottle[n - 1];
  let count = 1;
  while (count < n && bottle[n - 1 - count] === color) count++;
  return { color, count };
}

function isUniform(bottle) {
  if (!bottle.length) return false;
  for (let i = 1; i < bottle.length; i++) if (bottle[i] !== bottle[0]) return false;
  return true;
}

function isComplete(state, i) {
  const b = state.bottles[i];
  return b.length === state.capacity && isUniform(b);
}

// 병 순서를 무시한 정규화 키 (탐색 중복 제거용)
function stateKey(state) {
  return state.bottles.map((b) => b.join('')).sort().join(',');
}

// 승리: 모든 병이 (빈 병) 또는 (가득 찬 단색 병)이고,
// 완성된 색 목록이 목표 색 목록과 정확히 일치한다.
function isWin(state, targets) {
  const done = [];
  for (let i = 0; i < state.bottles.length; i++) {
    const b = state.bottles[i];
    if (b.length === 0) continue;
    if (!isComplete(state, i)) return false;
    done.push(b[0]);
  }
  if (done.length !== targets.length) return false;
  return done.slice().sort().join('') === targets.slice().sort().join('');
}

// ===== sort-engine/moves.js =====
// 붓기 규칙.
// rules.allowMix = false → 클래식 워터소트 (같은 색 위에만 부을 수 있음)
// rules.allowMix = true  → 1차색끼리는 서로 부을 수 있고, 닿은 구간이 2차색으로 섞인다.



const CLASSIC_RULES = { allowMix: false };
const MIX_RULES = { allowMix: true };

function canPour(state, from, to, rules = CLASSIC_RULES) {
  if (from === to) return false;
  const src = state.bottles[from];
  const dst = state.bottles[to];
  if (!src || !dst) return false;
  if (src.length === 0) return false;
  if (dst.length >= state.capacity) return false;
  if (dst.length === 0) return true;
  const a = src[src.length - 1];
  const b = dst[dst.length - 1];
  if (a === b) return true;
  return rules.allowMix ? mixOf(a, b) !== null : false;
}

// 붓기 실행. 맨 위 같은 색 구간 전체가 (공간이 허락하는 만큼) 이동한다.
// 다른 색 위에 부으면(혼합) 부은 양 + 닿은 구간 전체가 혼합색으로 변한다.
// 반환: { state, from, to, amount, color, mixed, mixedRunBefore } 또는 불가 시 null
function pour(state, from, to, rules = CLASSIC_RULES) {
  if (!canPour(state, from, to, rules)) return null;
  const next = cloneState(state);
  const src = next.bottles[from];
  const dst = next.bottles[to];
  const run = topRun(src);
  const space = next.capacity - dst.length;
  const amount = Math.min(run.count, space);

  const before = dst.length ? dst[dst.length - 1] : null;
  let color = run.color;
  let mixed = false;
  let mixedRunBefore = 0;

  if (before !== null && before !== run.color) {
    color = mixOf(run.color, before);
    mixed = true;
    mixedRunBefore = topRun(dst).count;
    for (let i = dst.length - mixedRunBefore; i < dst.length; i++) dst[i] = color;
  }
  src.length -= amount;
  for (let i = 0; i < amount; i++) dst.push(color);

  return { state: next, from, to, amount, color, mixed, mixedRunBefore };
}

// 탐색용 합법 수 나열. 무의미한 수는 가지치기한다:
// - 완성된 병(가득 + 단색)은 원칙적으로 잠금.
//   단, 혼합 모드의 1차색 완성병은 깨서 섞어야 풀리는 경우가 있어 허용한다.
// - 단색 병 → 빈 병 이동은 상태가 그대로라 제외.
function legalMoves(state, rules = CLASSIC_RULES) {
  const moves = [];
  const n = state.bottles.length;
  for (let from = 0; from < n; from++) {
    const src = state.bottles[from];
    if (!src.length) continue;
    let uniform = true;
    for (let i = 1; i < src.length; i++) if (src[i] !== src[0]) { uniform = false; break; }
    if (uniform && src.length === state.capacity) {
      if (!rules.allowMix || !isPrimary(src[0])) continue;
    }
    for (let to = 0; to < n; to++) {
      if (to === from) continue;
      if (uniform && state.bottles[to].length === 0) continue;
      if (canPour(state, from, to, rules)) moves.push({ from, to });
    }
  }
  return moves;
}

// ===== sort-engine/solver.js =====
// 가중 A* (greedy 성향) 솔버.
// solved=false && exhausted=true 이면 탐색 공간을 전부 확인한 것 → 확실히 풀 수 없는 상태.
// solved=false && exhausted=false 는 노드 예산 초과 → 판단 불가.



class MinHeap {
  constructor() { this.a = []; }
  get size() { return this.a.length; }
  push(item) {
    const a = this.a;
    a.push(item);
    let i = a.length - 1;
    while (i > 0) {
      const p = (i - 1) >> 1;
      if (a[p].f <= a[i].f) break;
      [a[p], a[i]] = [a[i], a[p]];
      i = p;
    }
  }
  pop() {
    const a = this.a;
    if (!a.length) return null;
    const top = a[0];
    const last = a.pop();
    if (a.length) {
      a[0] = last;
      let i = 0;
      for (;;) {
        const l = 2 * i + 1;
        const r = l + 1;
        let m = i;
        if (l < a.length && a[l].f < a[m].f) m = l;
        if (r < a.length && a[r].f < a[m].f) m = r;
        if (m === i) break;
        [a[m], a[i]] = [a[i], a[m]];
        i = m;
      }
    }
    return top;
  }
}

// 휴리스틱: 병 안의 색 경계(조각) 수 + 아직 완성되지 않은 목표 수
function heuristic(state, targets) {
  let runs = 0;
  const doneColors = [];
  for (const b of state.bottles) {
    if (!b.length) continue;
    let r = 1;
    for (let i = 1; i < b.length; i++) if (b[i] !== b[i - 1]) r++;
    runs += r - 1;
    if (b.length === state.capacity && r === 1) doneColors.push(b[0]);
  }
  const remaining = targets.slice();
  for (const c of doneColors) {
    const idx = remaining.indexOf(c);
    if (idx >= 0) remaining.splice(idx, 1);
  }
  return runs + remaining.length * 2;
}

function solve(state, targets, rules = CLASSIC_RULES, opts = {}) {
  const maxNodes = opts.maxNodes ?? 200000;
  const maxDepth = opts.maxDepth ?? 120;
  const weight = opts.weight ?? 3;

  if (isWin(state, targets)) return { solved: true, moves: [], nodes: 0, exhausted: false };

  const heap = new MinHeap();
  const visited = new Set([stateKey(state)]);
  heap.push({ state, moves: [], f: heuristic(state, targets) * weight });
  let nodes = 0;

  while (heap.size > 0) {
    if (nodes >= maxNodes) return { solved: false, nodes, exhausted: false };
    const cur = heap.pop();
    nodes++;
    if (cur.moves.length >= maxDepth) continue;
    for (const mv of legalMoves(cur.state, rules)) {
      const res = pour(cur.state, mv.from, mv.to, rules);
      if (!res) continue;
      const key = stateKey(res.state);
      if (visited.has(key)) continue;
      visited.add(key);
      const moves = cur.moves.concat([mv]);
      if (isWin(res.state, targets)) return { solved: true, moves, nodes, exhausted: false };
      heap.push({ state: res.state, moves, f: moves.length + heuristic(res.state, targets) * weight });
    }
  }
  return { solved: false, nodes, exhausted: true };
}

// ===== paint-mix-sort/render.js =====
// 캔버스 렌더러 — 병, 물감, 붓기/혼합 애니메이션, 파티클.
// 게임 로직은 전혀 모르고, 상태와 PourResult만 받아 그린다.


const COLOR_HEX = {
  R: '#ff5252',
  Y: '#ffd93d',
  B: '#4d9fff',
  O: '#ff9f2e',
  G: '#3ddc84',
  P: '#b45cff',
};

const COLOR_NAME = { R: '빨강', Y: '노랑', B: '파랑', O: '주황', G: '초록', P: '보라' };

// ---------- 색/이징 유틸 ----------

const rgbCache = new Map();
function hexToRgb(hex) {
  let c = rgbCache.get(hex);
  if (!c) {
    c = [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
    rgbCache.set(hex, c);
  }
  return c;
}
function lerpColor(hexA, hexB, t) {
  const a = hexToRgb(hexA);
  const b = hexToRgb(hexB);
  const r = Math.round(a[0] + (b[0] - a[0]) * t);
  const g = Math.round(a[1] + (b[1] - a[1]) * t);
  const bl = Math.round(a[2] + (b[2] - a[2]) * t);
  return `rgb(${r},${g},${bl})`;
}
function lighten(hex, t) {
  return lerpColor(hex, '#ffffff', t);
}
const clamp01 = (t) => Math.max(0, Math.min(1, t));
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) {
    ctx.roundRect(x, y, w, h, r);
    return;
  }
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---------- 렌더러 ----------

const TILT = 1.08; // 붓는 각도(라디안, 약 62도)
const LIFT = 13; // 선택 시 떠오르는 높이

class Renderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.dpr = Math.min(window.devicePixelRatio || 1, 3);
    this.cssW = 0;
    this.cssH = 0;
    this.state = null;
    this.capacity = 4;
    this.selected = null;
    this.anim = null;
    this.shake = null;
    this.particles = [];
    this.rects = [];
    this._loop = this._loop.bind(this);
    requestAnimationFrame(this._loop);
  }

  resize() {
    const w = this.canvas.clientWidth;
    const h = this.canvas.clientHeight;
    if (w < 10 || h < 10) return;
    this.cssW = w;
    this.cssH = h;
    this.canvas.width = Math.round(w * this.dpr);
    this.canvas.height = Math.round(h * this.dpr);
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this._layout();
  }

  setState(state) {
    this.state = state;
    this.capacity = state.capacity;
    this._layout();
  }

  setSelected(i) {
    this.selected = i;
  }

  // 레벨 전환 시 진행 중인 연출을 모두 정리 (onDone은 호출하지 않는다 —
  // 호출부가 상태를 새로 세팅하는 중이므로)
  clearEffects() {
    this.anim = null;
    this.particles = [];
    this.shake = null;
  }

  shakeBottle(i) {
    this.shake = { i, t0: performance.now() };
  }

  _layout() {
    if (!this.state || this.cssW < 10) {
      this.rects = [];
      return;
    }
    const n = this.state.bottles.length;
    const rows = Math.ceil(n / 4);
    const perRow = Math.ceil(n / rows);
    const padX = 16;
    const gap = Math.max(12, Math.min(18, (this.cssW - padX * 2) * 0.045));
    const RATIO = 2.5; // 병 높이/너비
    let bw = Math.min(74, (this.cssW - padX * 2 - gap * (perRow - 1)) / perRow);
    const topPad = 30; // 배지/들어올림 여유
    const bottomPad = 18;
    const rowGap = 46;
    const availH = this.cssH - topPad - bottomPad;
    const bhMax = (availH - (rows - 1) * rowGap) / rows;
    const bh = Math.min(bw * RATIO, bhMax);
    bw = bh / RATIO;
    // 병 무리를 캔버스 세로 중앙에 모아 배치
    const contentH = rows * bh + (rows - 1) * rowGap;
    const startY = topPad + Math.max(0, (availH - contentH) / 2);
    this.rects = [];
    for (let r = 0; r < rows; r++) {
      const start = r * perRow;
      const count = Math.min(perRow, n - start);
      const totalW = count * bw + (count - 1) * gap;
      const x0 = (this.cssW - totalW) / 2;
      const y = startY + r * (bh + rowGap);
      for (let k = 0; k < count; k++) {
        this.rects.push({ x: x0 + k * (bw + gap), y, w: bw, h: bh });
      }
    }
  }

  bottleRect(i) {
    return this.rects[i] || null;
  }

  bottleCenter(i) {
    const r = this.rects[i];
    return r ? { x: r.x + r.w / 2, y: r.y + r.h / 2 } : null;
  }

  hitTest(x, y) {
    for (let i = 0; i < this.rects.length; i++) {
      const r = this.rects[i];
      if (x >= r.x - 8 && x <= r.x + r.w + 8 && y >= r.y - LIFT - 12 && y <= r.y + r.h + 10) return i;
    }
    return null;
  }

  // 붓기 애니메이션 시작. onMix는 혼합 플래시 시작 시, onDone은 완전히 끝난 뒤 호출.
  animatePour({ prevState, result, onMix, onDone }) {
    const srcRect = this.rects[result.from];
    const dstRect = this.rects[result.to];
    if (!srcRect || !dstRect) {
      onDone && onDone();
      return;
    }
    const dir = srcRect.x <= dstRect.x ? 1 : -1;
    this.anim = {
      prev: prevState,
      res: result,
      t0: performance.now(),
      MOVE: 230,
      POUR: 240 + 100 * result.amount,
      FLASH: result.mixed ? 300 : 0,
      RETURN: 210,
      dir,
      mixFired: false,
      doneFired: false,
      onMix,
      onDone,
    };
  }

  burstAtBottle(i, hex, n = 16) {
    const r = this.rects[i];
    if (!r) return;
    this._burst(r.x + r.w / 2, r.y + 10, hex, n);
  }

  _burst(x, y, hex, n = 14) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 60 + Math.random() * 170;
      this.particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 90,
        g: 420,
        ttl: 0.45 + Math.random() * 0.5,
        age: 0,
        size: 2 + Math.random() * 3,
        color: hex,
        shape: 'circle',
      });
    }
  }

  celebrate() {
    const colors = Object.values(COLOR_HEX);
    for (let i = 0; i < 110; i++) {
      this.particles.push({
        x: Math.random() * this.cssW,
        y: -20 - Math.random() * 60,
        vx: (Math.random() - 0.5) * 90,
        vy: 70 + Math.random() * 160,
        g: 230,
        ttl: 1.4 + Math.random() * 0.9,
        age: 0,
        w: 5 + Math.random() * 4,
        h: 8 + Math.random() * 5,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 9,
        color: colors[(Math.random() * colors.length) | 0],
        shape: 'rect',
      });
    }
  }

  // ---------- 매 프레임 ----------

  _loop(now) {
    requestAnimationFrame(this._loop);
    const ctx = this.ctx;
    if (!this.state || !this.rects.length) {
      ctx && ctx.clearRect(0, 0, this.cssW, this.cssH);
      return;
    }
    ctx.clearRect(0, 0, this.cssW, this.cssH);

    const A = this.anim;
    let animData = null;
    if (A) animData = this._computeAnim(now, A);

    // 일반 병 (애니메이션 중인 원본 병은 건너뛰고 나중에 위에 그림)
    for (let i = 0; i < this.state.bottles.length; i++) {
      if (animData && i === A.res.from) continue;
      let rect = { ...this.rects[i] };
      if (this.shake && this.shake.i === i) {
        const el = now - this.shake.t0;
        if (el < 300) rect.x += Math.sin(el / 16) * 5 * (1 - el / 300);
        else this.shake = null;
      }
      let model;
      if (animData && i === A.res.to) {
        model = animData.dstModel;
      } else {
        const b = this.state.bottles[i];
        model = { colors: b.map((c) => COLOR_HEX[c]), fraction: 1, flash: 0 };
      }
      const selected = this.selected === i && !animData;
      if (selected) rect.y -= LIFT;
      const complete =
        this.state.bottles[i].length === this.capacity && isUniform(this.state.bottles[i]);
      this._drawBottle(rect, model, { selected, complete, shadow: true });
    }

    // 애니메이션 중인 원본 병 + 물줄기
    if (animData) {
      if (animData.stream) this._drawStream(animData.stream);
      const { mouth, rot, srcModel } = animData;
      const r0 = this.rects[A.res.from];
      ctx.save();
      ctx.translate(mouth.x, mouth.y);
      ctx.rotate(rot);
      this._drawBottle({ x: -r0.w / 2, y: 0, w: r0.w, h: r0.h }, srcModel, {
        selected: false,
        complete: false,
        shadow: false,
      });
      ctx.restore();
    }

    this._drawParticles(now);
  }

  _computeAnim(now, A) {
    const res = A.res;
    const prevSrc = A.prev.bottles[res.from];
    const prevDst = A.prev.bottles[res.to];
    const postSrc = res.state.bottles[res.from];
    const postDst = res.state.bottles[res.to];
    const pouredHex = COLOR_HEX[topRun(prevSrc).color];
    const srcRect = this.rects[res.from];
    const dstRect = this.rects[res.to];

    const startMouth = { x: srcRect.x + srcRect.w / 2, y: srcRect.y };
    const pourMouth = {
      x: dstRect.x + dstRect.w / 2 - A.dir * dstRect.w * 0.62,
      y: dstRect.y - 24,
    };

    const el = now - A.t0;
    const { MOVE, POUR, FLASH, RETURN } = A;
    const total = MOVE + POUR + FLASH + RETURN;

    // 목적지 병의 (혼합 전) 색 배열: 원래 내용 + 부은 색
    const dstPreColors = prevDst.map((c) => COLOR_HEX[c]);
    const dstPostColors = postDst.map((c) => COLOR_HEX[c]);

    let mouth, rot;
    let srcModel, dstModel;
    let stream = null;

    const srcColorsFull = prevSrc.map((c) => COLOR_HEX[c]);

    if (el < MOVE) {
      const t = easeInOut(clamp01(el / MOVE));
      mouth = {
        x: startMouth.x + (pourMouth.x - startMouth.x) * t,
        y: startMouth.y + (pourMouth.y - startMouth.y) * t,
      };
      rot = TILT * A.dir * t;
      srcModel = { colors: srcColorsFull, fraction: 1, flash: 0 };
      dstModel = { colors: dstPreColors, fraction: 1, flash: 0 };
    } else if (el < MOVE + POUR) {
      const t = easeInOut(clamp01((el - MOVE) / POUR));
      const moved = res.amount * t;
      mouth = pourMouth;
      rot = TILT * A.dir;

      const remain = prevSrc.length - moved;
      const full = Math.floor(remain);
      srcModel = {
        colors: srcColorsFull.slice(0, Math.ceil(remain)),
        fraction: remain - full > 0 ? remain - full : 1,
        flash: 0,
      };
      const dstCount = prevDst.length + moved;
      const dstColors = dstPreColors.slice();
      for (let k = 0; k < Math.ceil(moved); k++) dstColors.push(pouredHex);
      dstModel = {
        colors: dstColors,
        fraction: moved % 1 > 0 ? moved % 1 : 1,
        flash: 0,
      };
      stream = this._streamGeom(mouth, dstRect, dstCount, pouredHex, A.dir);
    } else if (el < MOVE + POUR + FLASH) {
      const f = clamp01((el - MOVE - POUR) / FLASH);
      if (!A.mixFired) {
        A.mixFired = true;
        A.onMix && A.onMix();
        const surfY = this._surfaceY(dstRect, postDst.length);
        this._burst(dstRect.x + dstRect.w / 2, surfY, COLOR_HEX[res.color], 18);
      }
      mouth = pourMouth;
      rot = TILT * A.dir;
      srcModel = { colors: postSrc.map((c) => COLOR_HEX[c]), fraction: 1, flash: 0 };

      // 닿은 구간이 혼합색으로 물드는 연출
      const affected = res.mixedRunBefore + res.amount;
      const preMixColors = dstPreColors.slice();
      for (let k = 0; k < res.amount; k++) preMixColors.push(pouredHex);
      const colors = preMixColors.map((hex, idx) => {
        if (idx >= preMixColors.length - affected) {
          return lerpColor(hex, COLOR_HEX[res.color], easeOutCubic(f));
        }
        return hex;
      });
      dstModel = { colors, fraction: 1, flash: Math.sin(f * Math.PI) * 0.5 };
    } else if (el < total) {
      const t = easeInOut(clamp01((el - MOVE - POUR - FLASH) / RETURN));
      mouth = {
        x: pourMouth.x + (startMouth.x - pourMouth.x) * t,
        y: pourMouth.y + (startMouth.y - pourMouth.y) * t,
      };
      rot = TILT * A.dir * (1 - t);
      srcModel = { colors: postSrc.map((c) => COLOR_HEX[c]), fraction: 1, flash: 0 };
      dstModel = { colors: dstPostColors, fraction: 1, flash: 0 };
    } else {
      this.anim = null;
      if (!A.doneFired) {
        A.doneFired = true;
        A.onDone && A.onDone();
      }
      return null;
    }
    return { mouth, rot, srcModel, dstModel, stream };
  }

  _surfaceY(rect, unitCount) {
    const pad = 3.5;
    const unitH = (rect.h - pad * 2) / this.capacity;
    return rect.y + rect.h - pad - unitH * unitCount;
  }

  _streamGeom(mouth, dstRect, dstCount, hex, dir) {
    return {
      x0: mouth.x + dir * 7,
      y0: mouth.y + 3,
      x1: dstRect.x + dstRect.w / 2,
      y1: this._surfaceY(dstRect, dstCount),
      color: hex,
    };
  }

  _drawStream(s) {
    const ctx = this.ctx;
    if (s.y1 <= s.y0) return;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 6;
    ctx.globalAlpha = 0.95;
    ctx.beginPath();
    ctx.moveTo(s.x0, s.y0);
    ctx.quadraticCurveTo(s.x1, s.y0 + (s.y1 - s.y0) * 0.35, s.x1, s.y1);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }

  _drawBottle(rect, model, { selected, complete, shadow }) {
    const ctx = this.ctx;
    const { x, y, w, h } = rect;
    const r = w * 0.27;
    const pad = 3.5;
    const unitH = (h - pad * 2) / this.capacity;

    if (shadow) {
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.30)';
      ctx.beginPath();
      ctx.ellipse(x + w / 2, y + h + 7 + (selected ? LIFT : 0), w * 0.42, 4.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    if (selected || complete) {
      ctx.save();
      ctx.shadowColor = selected ? 'rgba(139,107,255,0.9)' : 'rgba(255,220,120,0.55)';
      ctx.shadowBlur = selected ? 20 : 14;
      rr(ctx, x, y, w, h, r);
      ctx.fillStyle = 'rgba(255,255,255,0.02)';
      ctx.fill();
      ctx.restore();
    }

    // 유리 몸통
    rr(ctx, x, y, w, h, r);
    ctx.fillStyle = 'rgba(255,255,255,0.055)';
    ctx.fill();

    // 물감 (몸통 모양으로 클리핑)
    ctx.save();
    rr(ctx, x + 1, y + 1, w - 2, h - 2, r - 1);
    ctx.clip();
    const n = model.colors.length;
    let topY = null;
    for (let k = 0; k < n; k++) {
      const uh = (k === n - 1 ? model.fraction : 1) * unitH;
      const yTop = y + h - pad - (k * unitH + uh);
      ctx.fillStyle = model.colors[k];
      ctx.fillRect(x + pad, yTop, w - pad * 2, uh + 0.6);
      if (k === n - 1) topY = yTop;
    }
    if (topY !== null && n > 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.beginPath();
      ctx.ellipse(x + w / 2, topY + 1.2, (w - pad * 2) / 2, 2.8, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    if (model.flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${model.flash})`;
      ctx.fillRect(x, y, w, h);
    }
    // 광택
    ctx.fillStyle = 'rgba(255,255,255,0.07)';
    rr(ctx, x + w * 0.13, y + 7, w * 0.16, h - 14, w * 0.08);
    ctx.fill();
    ctx.restore();

    // 유리 외곽선 + 입구
    rr(ctx, x, y, w, h, r);
    ctx.strokeStyle = selected ? 'rgba(190,170,255,0.75)' : 'rgba(255,255,255,0.28)';
    ctx.lineWidth = selected ? 2.2 : 1.6;
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(x + w / 2, y + 0.5, w / 2 - 2, 3.4, 0, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    if (complete) {
      const bx = x + w - 3;
      const by = y - 5;
      ctx.save();
      ctx.fillStyle = '#ffd166';
      ctx.beginPath();
      ctx.arc(bx, by, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.lineWidth = 2.2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(bx - 3.6, by + 0.2);
      ctx.lineTo(bx - 1, by + 3);
      ctx.lineTo(bx + 3.8, by - 2.8);
      ctx.stroke();
      ctx.restore();
    }
  }

  _drawParticles(now) {
    if (!this.particles.length) return;
    const ctx = this.ctx;
    const dt = Math.min(0.033, (now - (this._lastP || now)) / 1000);
    this._lastP = now;
    const alive = [];
    for (const p of this.particles) {
      p.age += dt;
      if (p.age >= p.ttl) continue;
      p.vy += p.g * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.vr) p.rot += p.vr * dt;
      const fade = clamp01((p.ttl - p.age) / (p.ttl * 0.3));
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.fillStyle = p.color;
      if (p.shape === 'rect') {
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
    for (const p of this.particles) if (p.age < p.ttl) alive.push(p);
    this.particles = alive;
  }
}

// ===== paint-mix-sort/audio.js =====
// WebAudio 신시사이저 — 오디오 파일 없이 코드로만 효과음을 만든다.
// 모바일 정책상 첫 사용자 제스처에서 컨텍스트가 열린다.

const STORAGE_MUTED = 'pms.muted';

class Sound {
  constructor() {
    this.muted = safeStorage.getItem(STORAGE_MUTED) === '1';
    this._ctx = null;
  }

  get ctx() {
    if (typeof AudioContext === 'undefined' && typeof webkitAudioContext === 'undefined') return null;
    if (!this._ctx) {
      try {
        this._ctx = new (window.AudioContext || window.webkitAudioContext)();
      } catch {
        return null;
      }
    }
    if (this._ctx.state === 'suspended') this._ctx.resume().catch(() => {});
    return this._ctx;
  }

  setMuted(m) {
    this.muted = m;
    safeStorage.setItem(STORAGE_MUTED, m ? '1' : '0');
  }

  _tone(freq, { type = 'sine', dur = 0.12, gain = 0.1, delay = 0, slide = 0 } = {}) {
    if (this.muted) return;
    const ctx = this.ctx;
    if (!ctx) return;
    try {
      const t0 = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t0 + dur);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(gain, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
      osc.connect(g).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
    } catch {}
  }

  _noise({ dur = 0.25, from = 900, to = 300, gain = 0.16, delay = 0 } = {}) {
    if (this.muted) return;
    const ctx = this.ctx;
    if (!ctx) return;
    try {
      const t0 = ctx.currentTime + delay;
      const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(from, t0);
      filter.frequency.exponentialRampToValueAtTime(Math.max(60, to), t0 + dur);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(gain, t0 + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
      src.connect(filter).connect(g).connect(ctx.destination);
      src.start(t0);
    } catch {}
  }

  select() {
    this._tone(540, { type: 'triangle', dur: 0.07, gain: 0.07 });
  }

  pour(amount) {
    this._noise({ dur: 0.2 + 0.08 * amount, from: 950, to: 280, gain: 0.15 });
  }

  mix() {
    this._tone(523, { type: 'triangle', dur: 0.14, gain: 0.1 });
    this._tone(659, { type: 'triangle', dur: 0.14, gain: 0.1, delay: 0.06 });
    this._tone(784, { type: 'triangle', dur: 0.22, gain: 0.12, delay: 0.12 });
  }

  complete() {
    this._tone(880, { type: 'triangle', dur: 0.13, gain: 0.09 });
    this._tone(1175, { type: 'triangle', dur: 0.2, gain: 0.08, delay: 0.07 });
  }

  win() {
    [523, 659, 784, 1047].forEach((f, i) =>
      this._tone(f, { type: 'triangle', dur: 0.26, gain: 0.11, delay: i * 0.09 })
    );
  }

  error() {
    this._tone(150, { type: 'square', dur: 0.09, gain: 0.05 });
  }
}

// ===== paint-mix-sort/game.js =====
// 게임 컨트롤러 — 입력을 엔진 호출로 바꾸고, HUD/오버레이/배너를 관리한다.




const STORAGE_LEVEL = 'pms.level';

const HINTS = {
  0: '병을 눌러 선택하고, 부을 병을 누르세요.\n🔴 빨강 + 🟡 노랑을 섞으면 🟠 주황!',
  6: '⚠️ 이번엔 빨강 병 자체가 목표예요. 빨강을 다 섞어버리면 안 됩니다!',
};

class Game {
  constructor({ renderer, sound, dom }) {
    this.renderer = renderer;
    this.sound = sound;
    this.dom = dom;
    const saved = parseInt(safeStorage.getItem(STORAGE_LEVEL) || '0', 10);
    this.levelIndex = Number.isFinite(saved) ? Math.min(Math.max(saved, 0), LEVEL_DATA.length - 1) : 0;
    this.busy = false;
    this.won = false;
  }

  get level() {
    return LEVEL_DATA[this.levelIndex];
  }

  loadLevel(i) {
    this.levelIndex = Math.min(Math.max(i, 0), LEVEL_DATA.length - 1);
    safeStorage.setItem(STORAGE_LEVEL, String(this.levelIndex));
    const lv = this.level;
    this.state = { capacity: CAPACITY, bottles: lv.bottles.map((b) => b.slice()) };
    this.targets = lv.targets.slice();
    this.history = [];
    this.selected = null;
    this.won = false;
    this.busy = false;
    clearTimeout(this._deadT);
    clearTimeout(this._bannerT);

    this.renderer.clearEffects();
    this.renderer.setState(this.state);
    this.renderer.setSelected(null);
    this.dom.overlay.classList.add('hidden');
    this.hideBanner();
    this.updateHud();
    this.updateTargets();

    const hint = HINTS[this.levelIndex];
    if (hint) {
      this.dom.hint.textContent = hint;
      this.dom.hint.classList.remove('hidden');
    } else {
      this.dom.hint.classList.add('hidden');
    }
  }

  deselect() {
    this.selected = null;
    this.renderer.setSelected(null);
  }

  tap(i) {
    if (this.busy || this.won) return;
    if (!this.state.bottles[i]) return;

    if (this.selected === null) {
      if (this.state.bottles[i].length) {
        this.selected = i;
        this.renderer.setSelected(i);
        this.sound.select();
      } else {
        this.renderer.shakeBottle(i);
      }
      return;
    }

    if (i === this.selected) {
      this.deselect();
      return;
    }

    if (canPour(this.state, this.selected, i, MIX_RULES)) {
      this.doPour(this.selected, i);
    } else if (this.state.bottles[i].length) {
      // 부을 수 없는 곳이면 선택을 옮겨준다 (연타 조작감)
      this.selected = i;
      this.renderer.setSelected(i);
      this.sound.select();
    } else {
      this.renderer.shakeBottle(i);
      this.sound.error();
    }
  }

  doPour(from, to) {
    const prev = this.state;
    const res = pour(prev, from, to, MIX_RULES);
    if (!res) return;

    this.history.push(prev);
    this.state = res.state;
    this.deselect();
    this.busy = true;
    this.hideBanner();
    this.sound.pour(res.amount);
    this.updateHud();

    const completedNow = isComplete(this.state, to) && !isComplete(prev, to);

    this.renderer.animatePour({
      prevState: prev,
      result: res,
      onMix: () => this.sound.mix(),
      onDone: () => {
        this.busy = false;
        this.renderer.setState(this.state);
        this.updateTargets();
        if (completedNow) {
          this.renderer.burstAtBottle(to, COLOR_HEX[res.color]);
          this.sound.complete();
        }
        if (isWin(this.state, this.targets)) this.win();
        else this.scheduleDeadCheck();
      },
    });
  }

  undo() {
    if (this.busy || this.won || !this.history.length) return;
    this.state = this.history.pop();
    this.deselect();
    this.renderer.setState(this.state);
    this.hideBanner();
    this.updateHud();
    this.updateTargets();
    this.sound.select();
  }

  restart() {
    if (this.busy) return;
    this.loadLevel(this.levelIndex);
  }

  next() {
    const last = this.levelIndex >= LEVEL_DATA.length - 1;
    this.loadLevel(last ? 0 : this.levelIndex + 1);
  }

  // 매 수 이후, 현재 상태가 확실히 못 푸는 상태인지 백그라운드로 확인
  scheduleDeadCheck() {
    clearTimeout(this._deadT);
    this._deadT = setTimeout(() => {
      if (this.won || this.busy) return;
      const r = solve(this.state, this.targets, MIX_RULES, { maxNodes: 25000 });
      if (!r.solved && r.exhausted) {
        this.showBanner('🚫 더 이상 풀 수 없어요 — 되돌리기(↩︎)로 살려보세요!', true);
      }
    }, 160);
  }

  win() {
    this.won = true;
    this.sound.win();
    this.renderer.celebrate();
    if (this.levelIndex + 1 < LEVEL_DATA.length) {
      safeStorage.setItem(STORAGE_LEVEL, String(this.levelIndex + 1));
    }
    const last = this.levelIndex >= LEVEL_DATA.length - 1;
    this.dom.overlayTitle.textContent = last ? '🎉 전 레벨 클리어!' : `레벨 ${this.levelIndex + 1} 클리어!`;
    this.dom.overlayInfo.textContent = `${this.history.length}수 · 참고 답안 ${this.level.solutionLength}수`;
    this.dom.btnNext.textContent = last ? '처음부터 다시 ↻' : '다음 레벨 ▶';
    setTimeout(() => this.dom.overlay.classList.remove('hidden'), 850);
  }

  updateHud() {
    this.dom.levelLabel.textContent = `레벨 ${this.levelIndex + 1}`;
    this.dom.moveLabel.textContent = `${this.history.length}수 · 총 ${LEVEL_DATA.length}레벨`;
    this.dom.btnUndo.disabled = !this.history.length;
  }

  updateTargets() {
    // 완성된 병 색 개수를 세서 목표 칩에 체크 표시
    const doneCount = {};
    this.state.bottles.forEach((b, i) => {
      if (isComplete(this.state, i)) doneCount[b[0]] = (doneCount[b[0]] || 0) + 1;
    });
    const bar = this.dom.targetsBar;
    bar.innerHTML = '';
    const remaining = { ...doneCount };
    for (const t of this.targets) {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.style.setProperty('--c', COLOR_HEX[t]);
      if (remaining[t] > 0) {
        chip.classList.add('done');
        remaining[t]--;
      }
      bar.appendChild(chip);
    }
  }

  showBanner(text, sticky = false) {
    clearTimeout(this._bannerT);
    this.dom.banner.textContent = text;
    this.dom.banner.classList.remove('hidden');
    if (!sticky) {
      this._bannerT = setTimeout(() => this.hideBanner(), 2300);
    }
  }

  hideBanner() {
    this.dom.banner.classList.add('hidden');
  }

  // 디버그/검증용: 현재 상태를 즉시 클리어 상태로 만든다
  autoWin() {
    if (this.won) return true;
    let moves;
    if (this.history.length === 0) {
      moves = this.level.solution;
    } else {
      const r = solve(this.state, this.targets, MIX_RULES, { maxNodes: 600000 });
      if (!r.solved) return false;
      moves = r.moves;
    }
    for (const mv of moves) {
      const res = pour(this.state, mv.from, mv.to, MIX_RULES);
      if (!res) return false;
      this.history.push(this.state);
      this.state = res.state;
    }
    this.renderer.setState(this.state);
    this.updateHud();
    this.updateTargets();
    if (isWin(this.state, this.targets)) {
      this.win();
      return true;
    }
    return false;
  }
}

// 부트스트랩 — DOM 연결, 입력, 리사이즈, 디버그 API.





const $ = (id) => document.getElementById(id);
const dom = {
  board: $('board'),
  levelLabel: $('levelLabel'),
  moveLabel: $('moveLabel'),
  btnUndo: $('btnUndo'),
  btnRestart: $('btnRestart'),
  btnMute: $('btnMute'),
  btnNext: $('btnNext'),
  targetsBar: $('targetsBar'),
  legend: $('legend'),
  hint: $('hint'),
  banner: $('banner'),
  overlay: $('overlay'),
  overlayTitle: $('overlayTitle'),
  overlayInfo: $('overlayInfo'),
};

const renderer = new Renderer(dom.board);
const sound = new Sound();
const game = new Game({ renderer, sound, dom });

// 혼합 공식 범례: R+Y=O, Y+B=G, R+B=P
function buildLegend() {
  const dot = (c) => `<span class="dot" style="--c:${COLOR_HEX[c]}"></span>`;
  const pairs = [
    ['R', 'Y'],
    ['Y', 'B'],
    ['R', 'B'],
  ];
  dom.legend.innerHTML = pairs
    .map(([a, b]) => `<span class="formula">${dot(a)}+${dot(b)}=${dot(mixOf(a, b))}</span>`)
    .join('');
}

function updateMuteIcon() {
  dom.btnMute.textContent = sound.muted ? '🔇' : '🔊';
}

dom.board.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const r = dom.board.getBoundingClientRect();
  const i = renderer.hitTest(e.clientX - r.left, e.clientY - r.top);
  if (i !== null) game.tap(i);
  else game.deselect();
});
dom.board.addEventListener('contextmenu', (e) => e.preventDefault());

dom.btnUndo.addEventListener('click', () => game.undo());
dom.btnRestart.addEventListener('click', () => game.restart());
dom.btnNext.addEventListener('click', () => game.next());
dom.btnMute.addEventListener('click', () => {
  sound.setMuted(!sound.muted);
  updateMuteIcon();
});

new ResizeObserver(() => renderer.resize()).observe(dom.board);
window.addEventListener('resize', () => renderer.resize());

buildLegend();
updateMuteIcon();
renderer.resize();
game.loadLevel(game.levelIndex);

// ?debug — 자동화 테스트/개발용 훅
if (new URLSearchParams(location.search).has('debug')) {
  window.__pms = {
    game,
    renderer,
    sound,
    levelCount: LEVEL_DATA.length,
    tap: (i) => game.tap(i),
    state: () => game.state,
    loadLevel: (i) => game.loadLevel(i),
    autoWin: () => game.autoWin(),
    center: (i) => {
      const r = dom.board.getBoundingClientRect();
      const c = renderer.bottleCenter(i);
      return c ? { x: r.left + c.x, y: r.top + c.y } : null;
    },
  };
}
