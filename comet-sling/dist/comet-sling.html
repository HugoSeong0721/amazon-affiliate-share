<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☄️</text></svg>">
<title>Comet Sling — One-Touch Orbit Dash</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#05040c">
<style>
/* 어두운 네온 우주 — 형제 게임들의 파스텔 낮과 정반대의 톤.
   UI는 최소한만: 점수, 음소거, 결과 카드. 나머지는 전부 캔버스가 말한다. */

:root {
  --bg: #05040c;
  --text: #eef3ff;
  --muted: #6f7ba3;
  --neon: #8ef6ff;
  --neon-dim: rgba(142, 246, 255, 0.35);
  --violet: #b06bff;
  --gold: #ffd34d;
  --panel: rgba(14, 12, 30, 0.92);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}

html, body { height: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

#app {
  position: relative;
  height: 100dvh;
  width: 100%;
  max-width: 540px;
  /* 게임 배경 — 캔버스가 매 프레임 칠하지 않도록 여기서 한 번만 칠한다 */
  background: linear-gradient(180deg, #0a0618 0%, #03030a 100%);
  overflow: hidden;
}

#board {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  cursor: pointer;
}

/* ----- HUD — 캔버스 위에 떠 있는 최소 UI ----- */

#hud {
  position: absolute;
  top: calc(8px + env(safe-area-inset-top));
  left: 0;
  right: 0;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  pointer-events: none;
  padding: 0 14px;
}

.hud-score { text-align: center; }

#scoreLabel {
  font-size: 44px;
  font-weight: 800;
  letter-spacing: 0.04em;
  color: var(--text);
  text-shadow: 0 0 18px var(--neon-dim), 0 0 4px rgba(142, 246, 255, 0.6);
  font-variant-numeric: tabular-nums;
  line-height: 1.05;
}

#bestLabel {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.22em;
  color: var(--muted);
}

.hud-right {
  position: absolute;
  right: 14px;
  top: 0;
  display: flex;
  gap: 8px;
  pointer-events: auto;
}

.hud-btn {
  pointer-events: auto;
  width: 40px;
  height: 40px;
  border: 1px solid rgba(142, 246, 255, 0.18);
  border-radius: 12px;
  background: rgba(14, 12, 30, 0.6);
  color: var(--text);
  font-size: 17px;
  cursor: pointer;
  backdrop-filter: blur(4px);
}

.hud-btn:active { transform: scale(0.94); }

/* ----- 일시정지 ----- */

#pause {
  position: absolute;
  inset: 0;
  z-index: 22;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(3, 3, 8, 0.72);
  backdrop-filter: blur(2px);
}

#pause.hidden { display: none; }

/* 재개 카운트다운 중: 터치가 게임으로 통과하고 배경도 얇아진다 */
#pause.counting {
  pointer-events: none;
  background: rgba(3, 3, 8, 0.35);
  backdrop-filter: none;
}

.pause-card {
  text-align: center;
  padding: 28px 44px;
  border: 1px solid rgba(142, 246, 255, 0.22);
  border-radius: 20px;
  background: var(--panel);
  animation: cardIn 0.25s cubic-bezier(0.2, 1.4, 0.4, 1);
}

#pauseTitle {
  font-size: 34px;
  font-weight: 900;
  letter-spacing: 0.14em;
  color: var(--text);
  text-shadow: 0 0 20px var(--neon-dim);
  font-variant-numeric: tabular-nums;
}

.pause-note {
  margin-top: 8px;
  font-size: 12.5px;
  letter-spacing: 0.08em;
  color: var(--muted);
  animation: fadePulse 1.2s ease-in-out infinite;
}

.pause-note.hidden { display: none; }

#btnResume {
  display: block;
  margin: 18px auto 0;
  padding: 12px 30px;
  border: none;
  border-radius: 14px;
  background: var(--neon);
  color: #04121a;
  font-size: 16px;
  font-weight: 900;
  cursor: pointer;
}

#btnResume:active { transform: scale(0.96); }

/* ----- 결과 카드 ----- */

#overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(80% 60% at 50% 45%, rgba(5, 4, 12, 0.2) 0%, rgba(5, 4, 12, 0.75) 100%);
  z-index: 20;
  pointer-events: none; /* 탭은 캔버스로 흘려보낸다 — 아무 데나 눌러 재시작 */
}

#overlay.hidden { display: none; }

.overlay-card {
  text-align: center;
  padding: 26px 44px;
  border: 1px solid rgba(142, 246, 255, 0.22);
  border-radius: 20px;
  background: var(--panel);
  box-shadow: 0 0 42px rgba(142, 246, 255, 0.1), 0 18px 50px rgba(0, 0, 0, 0.55);
  animation: cardIn 0.32s cubic-bezier(0.2, 1.4, 0.4, 1);
}

@keyframes cardIn {
  from { transform: translateY(16px) scale(0.92); opacity: 0; }
  to { transform: none; opacity: 1; }
}

#overlayScore {
  font-size: 64px;
  font-weight: 900;
  color: var(--neon);
  text-shadow: 0 0 26px var(--neon-dim);
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}

#overlayBest {
  margin-top: 4px;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.24em;
  color: var(--muted);
}

#overlayBest.newbest {
  color: var(--gold);
  text-shadow: 0 0 16px rgba(255, 211, 77, 0.5);
  animation: bestPulse 0.9s ease-in-out infinite;
}

@keyframes bestPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

.challenge-note {
  margin-top: 10px;
  font-size: 13.5px;
  font-weight: 800;
  color: var(--gold);
}

.challenge-note.hidden { display: none; }

#btnShare {
  margin-top: 16px;
  padding: 11px 22px;
  border: 1px solid rgba(255, 211, 77, 0.5);
  border-radius: 12px;
  background: rgba(255, 211, 77, 0.12);
  color: var(--gold);
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  pointer-events: auto; /* 오버레이는 탭을 흘려보내지만 이 버튼은 받는다 */
}

#btnShare:active { transform: scale(0.96); }

#toast {
  position: absolute;
  bottom: calc(40px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  z-index: 50;
  padding: 10px 18px;
  border-radius: 20px;
  background: rgba(14, 12, 30, 0.95);
  border: 1px solid rgba(142, 246, 255, 0.3);
  color: var(--text);
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  animation: cardIn 0.25s;
}

#toast.hidden { display: none; }

.retry-note {
  margin-top: 18px;
  font-size: 13px;
  letter-spacing: 0.14em;
  color: var(--muted);
  animation: fadePulse 1.6s ease-in-out infinite;
}

@keyframes fadePulse {
  0%, 100% { opacity: 0.45; }
  50% { opacity: 1; }
}

/* ----- 이메일 가입 게이트 (첫 실행 한 번만) ----- */

#signup {
  position: absolute;
  inset: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: radial-gradient(90% 70% at 50% 40%, rgba(10, 6, 24, 0.7) 0%, rgba(3, 3, 10, 0.96) 100%);
  backdrop-filter: blur(3px);
}

#signup.hidden { display: none; }

.signup-card {
  width: min(88vw, 340px);
  text-align: center;
  padding: 30px 24px 20px;
  border: 1px solid rgba(142, 246, 255, 0.22);
  border-radius: 22px;
  background: var(--panel);
  box-shadow: 0 0 42px rgba(142, 246, 255, 0.1), 0 18px 50px rgba(0, 0, 0, 0.55);
  animation: cardIn 0.32s cubic-bezier(0.2, 1.4, 0.4, 1);
}

.signup-logo { font-size: 44px; line-height: 1; }

.signup-title {
  margin-top: 8px;
  font-size: 26px;
  font-weight: 900;
  letter-spacing: 0.02em;
  color: var(--neon);
  text-shadow: 0 0 22px var(--neon-dim);
}

.signup-sub {
  margin-top: 4px;
  font-size: 13px;
  color: var(--muted);
}

#googleBtn {
  margin: 18px auto 0;
  display: flex;
  justify-content: center;
  min-height: 40px;
}

#googleBtn.hidden { display: none; }

.or-divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 14px 0 0;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 0.2em;
}

.or-divider.hidden { display: none; }

.or-divider::before,
.or-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(255, 255, 255, 0.12);
}

#emailForm {
  display: flex;
  gap: 8px;
  margin-top: 16px;
}

#emailInput {
  flex: 1;
  min-width: 0;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid rgba(142, 246, 255, 0.25);
  background: rgba(3, 3, 10, 0.6);
  color: var(--text);
  font-size: 15px;
  outline: none;
}

#emailInput:focus { border-color: var(--neon); }

#emailInput.shake { animation: shakeX 0.35s; border-color: #ff5a3c; }

@keyframes shakeX {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

#emailSubmit {
  padding: 12px 16px;
  border: none;
  border-radius: 12px;
  background: var(--neon);
  color: #04121a;
  font-size: 14px;
  font-weight: 900;
  cursor: pointer;
  white-space: nowrap;
}

#emailSubmit:active { transform: scale(0.96); }

.skip-btn {
  margin-top: 14px;
  background: none;
  border: none;
  color: var(--muted);
  font-size: 12.5px;
  text-decoration: underline;
  cursor: pointer;
}

.signup-privacy {
  margin-top: 14px;
  font-size: 10.5px;
  color: rgba(111, 123, 163, 0.75);
  line-height: 1.4;
}

/* ----- 광고 자리 (형제 게임들과 같은 구조) ----- */

#adSlot {
  position: absolute;
  inset: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(3, 3, 8, 0.9);
}

#adSlot.hidden { display: none; }

.ad-frame {
  width: min(86vw, 360px);
  border-radius: 16px;
  overflow: hidden;
  background: #10142a;
  border: 1px solid rgba(255, 255, 255, 0.12);
}

.ad-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  background: rgba(255, 255, 255, 0.05);
}

.ad-tag {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.12em;
  color: var(--muted);
  border: 1px solid var(--muted);
  border-radius: 4px;
  padding: 1px 6px;
}

.ad-close {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: none;
  background: rgba(255, 255, 255, 0.12);
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
}

.ad-close:disabled { opacity: 0.55; cursor: default; }

.ad-body {
  padding: 42px 20px;
  text-align: center;
}

.ad-title { font-weight: 800; margin-bottom: 6px; }

.ad-sub { font-size: 12.5px; color: var(--muted); line-height: 1.5; }

</style>
</head>
<body>
<div id="app">
    <canvas id="board"></canvas>

    <header id="hud">
      <div class="hud-score">
        <div id="scoreLabel">0</div>
        <div id="bestLabel">BEST 0</div>
      </div>
      <div class="hud-right">
        <button id="btnPause" class="hud-btn" title="Pause" aria-label="Pause">⏸️</button>
        <button id="btnMute" class="hud-btn" title="Sound on/off" aria-label="Sound">🔊</button>
      </div>
    </header>

    <div id="pause" class="hidden">
      <div class="pause-card">
        <div id="pauseTitle">PAUSED</div>
        <p id="pauseNote" class="pause-note hidden">hold to stay in orbit</p>
        <button id="btnResume" type="button">▶ Resume</button>
      </div>
    </div>

    <div id="overlay" class="hidden">
      <div class="overlay-card">
        <div id="overlayScore">0</div>
        <div id="overlayBest">BEST 0</div>
        <p id="overlayChallenge" class="challenge-note hidden"></p>
        <button id="btnShare" type="button">📤 Challenge a friend</button>
        <p class="retry-note">tap to fly again</p>
      </div>
    </div>

    <div id="toast" class="hidden"></div>



    <div id="signup" class="hidden">
      <div class="signup-card">
        <div class="signup-logo">☄️</div>
        <h1 class="signup-title">Comet Sling</h1>
        <p class="signup-sub">Save your best score &amp; get updates</p>
        <div id="googleBtn" class="hidden"></div>
        <div id="orDivider" class="or-divider hidden"><span>or</span></div>
        <form id="emailForm" novalidate>
          <input id="emailInput" type="email" inputmode="email" autocomplete="email"
                 placeholder="your@email.com" aria-label="Email">
          <button id="emailSubmit" type="submit">Play ▶</button>
        </form>
        <button id="skipBtn" type="button" class="skip-btn">just play</button>
        <p class="signup-privacy">Your email is only used for game updates.</p>
      </div>
    </div>

    <div id="adSlot" class="hidden">
      <div class="ad-frame">
        <div class="ad-head">
          <span class="ad-tag">AD</span>
          <button id="adClose" class="ad-close" disabled>5</button>
        </div>
        <div class="ad-body">
          <p class="ad-title">Ad placeholder</p>
          <p class="ad-sub">An interstitial ad will appear here once an ad network is connected.</p>
        </div>
      </div>
    </div>
  </div>
<script type="module">

const safeStorage = (() => {
  try {
    localStorage.setItem('__probe', '1');
    localStorage.removeItem('__probe');
    return localStorage;
  } catch {
    const mem = new Map();
    return {
      getItem: (k) => (mem.has(k) ? mem.get(k) : null),
      setItem: (k, v) => mem.set(k, String(v)),
      removeItem: (k) => mem.delete(k),
    };
  }
})();

// ===== comet-sling/engine.js =====
// 순수 게임 로직 — DOM/캔버스 없음. 시드 RNG, 트랙 생성, 고정 스텝 물리, 충돌, 점수.
//
// 결정론이 이 파일의 계약이다: 같은 시드 + 같은 입력 시퀀스 = 같은 런.
// 물리는 고정 dt(1/120초)로만 전진하고, 트랙은 앵커 인덱스 순서로만 생성되므로
// ensureTrack을 언제 몇 번 부르든 결과가 같다. 테스트가 이 계약을 검증한다.

const DT = 1 / 120; // 고정 물리 스텝(초)

// 월드 좌표: y는 위로 증가. 코멧은 (0,0)에서 출발해 위로 난다.
const WORLD = {
  halfW: 50,          // 통로 반폭 — 벽에 닿으면 죽는다
  cometR: 2.2,        // 코멧 반지름
  hazardR: 5.5,       // 소행성 반지름
  captureR: 38,       // 이 거리 안의 앵커를 잡을 수 있다 (홀드 중 자동)
  orbitMin: 11,       // 궤도 반지름 하한 — 너무 붙어서 잡으면 이만큼 밀어낸다
  orbitMax: 26,       // 궤도 반지름 상한
  nearMissBand: 5,    // 소행성을 이 여유 안으로 스치면 보너스
  fallLimit: 130,     // 최고점에서 이만큼 떨어지면 죽는다 (카메라 밖)
  genMargin: 260,     // 코멧 위로 이만큼 미리 트랙을 깔아 둔다
};

// mulberry32 — 작고 결정적인 시드 RNG
function makeRng(seed) {
  let s = seed >>> 0;
  return function rng() {
    s = (s + 0x6d2b79f5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// 높이에 따른 난이도 곡선 — 전부 단조. 테스트가 단조성을 검증한다.
// 첫 플레이테스트 피드백("너무 어려워")에 맞춰 시작을 느리고 너그럽게,
// 정점은 그대로 두어 상급자의 목표는 지킨다.
function paramsAt(height) {
  const h = Math.max(0, height);
  const ramp = 1 - Math.exp(-h / 1300); // 0 → 1 포화 곡선 (완만하게)
  return {
    speed: 32 + 68 * ramp,                          // 32 → 100
    hazardChance: Math.min(0.85, 0.08 + 1.0 * ramp), // 구간당 소행성 확률
    maxHazards: h < 250 ? 1 : 2,                    // 구간당 최대 소행성 수
    anchorJitter: 14 + 16 * ramp,                   // 앵커 좌우 흔들림 폭
  };
}

// 초반 에임 어시스트 — 릴리즈 방향을 위쪽으로 이만큼 끌어당긴다.
// 완벽한 타이밍이 아니어도 대충 위로 가게 해서, 조작을 배우는 동안 벽에 덜 부딪히게.
// 높이 800에서 완전히 사라진다 (단조 감소).
function assistAt(height) {
  return Math.max(0, 0.38 * (1 - Math.max(0, height) / 800));
}

// 궤도 회전 각속도 — 순수하게 speed/r 로 하면 작은 원이 정신없이 빨라진다
// (반지름 11 vs 26 이 2.4배 차이). 유효 반지름을 눌러서 차이는 남기되 얌전하게:
// 작은 원은 '살짝 빠르고', 큰 원은 '여유로운' 정도 (약 1.5배 차이).
function orbitOmega(speed, r) {
  return speed / (0.55 * r + 10);
}

// 자석 조준 — 릴리즈 방향이 근처 앵커와 이 각도 이내로 맞으면 그 앵커로 스냅한다.
// "옆으로 튕겨나간다"는 느낌의 해독제: 얼추 맞으면 정확히 맞은 걸로 쳐 준다.
const SNAP_DEG = 25;
const SNAP_MAX_DIST = 230;

// 지금 놓으면 날아갈 방향 (순수 함수 — 릴리즈와 조준선 표시가 같은 값을 쓴다).
// 반환: { dx, dy, snapped } — snapped 는 스냅된 앵커 인덱스 또는 null
function aim(state) {
  const o = state.orbit;
  if (!o) return { dx: state.dirX, dy: state.dirY, snapped: null };
  let dx = -Math.sin(o.theta) * o.dir;
  let dy = Math.cos(o.theta) * o.dir + assistAt(state.height);
  const len = Math.hypot(dx, dy);
  dx /= len;
  dy /= len;

  // 진행 방향과 가장 잘 맞는 앵커를 찾는다 (지금 돌고 있는 앵커는 제외).
  // 소행성이 막고 있는 앵커에는 스냅하지 않는다 — 금색으로 잠긴 조준선은
  // "여기로 가면 닿는다"는 약속이므로, 가는 길에 죽으면 거짓말이 된다.
  let best = null, bestCos = Math.cos((SNAP_DEG * Math.PI) / 180);
  for (let i = state.anchorFrom || 0; i < state.anchors.length; i++) {
    if (i === o.i) continue;
    const a = state.anchors[i];
    if (a.y > state.y + SNAP_MAX_DIST) break;       // 위로 정렬 — 더 볼 필요 없다
    const ax = a.x - state.x, ay = a.y - state.y;
    const d = Math.hypot(ax, ay);
    if (d < WORLD.orbitMin || d > SNAP_MAX_DIST) continue;
    const cos = (ax * dx + ay * dy) / d;
    if (cos > bestCos && pathIsClear(state, a.x, a.y)) { bestCos = cos; best = i; }
  }
  if (best !== null) {
    const a = state.anchors[best];
    const d = Math.hypot(a.x - state.x, a.y - state.y);
    return { dx: (a.x - state.x) / d, dy: (a.y - state.y) / d, snapped: best };
  }
  return { dx, dy, snapped: null };
}

// 코멧에서 (tx,ty)까지 직선이 소행성에 막히지 않는지 (창 안의 소행성만 본다)
function pathIsClear(state, tx, ty) {
  const clear = WORLD.hazardR + WORLD.cometR + 1;
  const top = Math.max(state.y, ty) + 200;
  for (let i = state.hazardFrom || 0; i < state.hazards.length; i++) {
    const hz = state.hazards[i];
    if (hz.y > top) break;
    if (distToSegment(hz.x, hz.y, state.x, state.y, tx, ty) < clear) return false;
  }
  return true;
}

// ----- 트랙 생성 (앵커 순서대로만 소비되는 RNG 스트림) -----

function nextAnchor(prev, rng, p) {
  const dy = 58 + rng() * 26;
  const maxX = WORLD.halfW - WORLD.orbitMax - WORLD.cometR - 2;
  let x = prev.x + (rng() * 2 - 1) * p.anchorJitter * 2;
  x = Math.max(-maxX, Math.min(maxX, x));
  return { x, y: prev.y + dy };
}

function distToSegment(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const len2 = dx * dx + dy * dy;
  const t = len2 === 0 ? 0 : Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / len2));
  const cx = ax + t * dx, cy = ay + t * dy;
  return Math.hypot(px - cx, py - cy);
}

// 구간(a→b) 사이에 소행성을 놓되, 플레이 가능성 불변식을 지킨다:
//  - 어떤 앵커와도 orbitMax + hazardR + cometR + 3 이상 떨어진다 (궤도 중 절대 안 부딪힘)
//  - a→b 직선에서 hazardR + cometR + 4 이상 떨어진다 (이상적인 비행선은 항상 열려 있다)
//  - 통로 안에 완전히 들어간다
function placeHazards(a, b, allAnchors, rng, p) {
  const out = [];
  const n = rng() < p.hazardChance ? 1 + (p.maxHazards > 1 && rng() < 0.35 ? 1 : 0) : 0;
  const anchorClear = WORLD.orbitMax + WORLD.hazardR + WORLD.cometR + 3;
  const lineClear = WORLD.hazardR + WORLD.cometR + 4;
  const maxX = WORLD.halfW - WORLD.hazardR - 1;
  for (let k = 0; k < n; k++) {
    for (let tries = 0; tries < 25; tries++) {
      const y = a.y + (0.25 + rng() * 0.5) * (b.y - a.y);
      const x = (rng() * 2 - 1) * maxX;
      if (distToSegment(x, y, a.x, a.y, b.x, b.y) < lineClear) continue;
      if (allAnchors.some((an) => Math.hypot(an.x - x, an.y - y) < anchorClear)) continue;
      if (out.some((hz) => Math.hypot(hz.x - x, hz.y - y) < WORLD.hazardR * 2 + 2)) continue;
      out.push({ x, y });
      break;
    }
  }
  return out;
}

// ----- 런 상태 -----

function newRun(seed) {
  const state = {
    seed: seed >>> 0,
    rng: makeRng(seed),
    t: 0,
    mode: 'flying',          // 'flying' | 'orbit'
    x: 0, y: 0,
    dirX: 0, dirY: 1,        // 비행 방향 (단위벡터)
    orbit: null,             // { i, r, theta, dir }
    height: 0,               // 도달 최고 y — 점수의 뼈대
    sparks: 0,               // 니어미스 횟수
    dead: false,
    deathCause: null,        // 'wall' | 'hazard' | 'fell'
    anchors: [{ x: 0, y: 64 }],
    hazards: [],
    // 스캔 시작점 — 코멧 아래로 한참 지난 것들은 영원히 무관해지므로 건너뛴다.
    // (인덱스는 그대로 두므로 orbit.i / _credited 가 안전하다)
    anchorFrom: 0,
    hazardFrom: 0,
    // 방금 놓은 앵커 — 사거리를 벗어나기 전까지는 다시 잡히지 않는다.
    // (없으면 놓자마자 같은 앵커를 다시 잡아 제자리를 뱅뱅 돈다)
    noLatch: -1,
    _credited: new Set(),    // 니어미스 중복 방지 (hazard 인덱스)
    _held: false,
    events: [],              // 프레임 이벤트 큐 — 렌더러/사운드가 비운다
  };
  ensureTrack(state, WORLD.genMargin);
  return state;
}

// upToY까지 트랙을 깔아 둔다. 앵커 i → i+1 순서로만 RNG를 소비하므로 결정적이다.
function ensureTrack(state, upToY) {
  while (state.anchors[state.anchors.length - 1].y < upToY) {
    const prev = state.anchors[state.anchors.length - 1];
    const p = paramsAt(prev.y);
    const next = nextAnchor(prev, state.rng, p);
    state.anchors.push(next);
    for (const hz of placeHazards(prev, next, state.anchors, state.rng, p)) state.hazards.push(hz);
  }
}

function score(state) {
  return Math.floor(state.height / 4) + state.sparks * 25;
}

function tryLatch(state) {
  let best = -1, bestD = WORLD.captureR;
  for (let i = state.anchorFrom; i < state.anchors.length; i++) {
    if (i === state.noLatch) continue;              // 방금 놓은 앵커는 건너뛴다
    const a = state.anchors[i];
    if (a.y > state.y + WORLD.captureR) break;      // 위로 정렬 — 더 볼 필요 없다
    if (a.y < state.y - WORLD.captureR) continue;   // 한참 지난 앵커는 안 잡는다
    const d = Math.hypot(a.x - state.x, a.y - state.y);
    if (d < bestD) { bestD = d; best = i; }
  }
  if (best < 0) return false;
  const a = state.anchors[best];
  const relX = state.x - a.x, relY = state.y - a.y;
  const r = Math.max(WORLD.orbitMin, Math.min(WORLD.orbitMax, bestD));
  // 진행 방향이 이어지도록 회전 방향을 고른다: cross(rel, dir) > 0 → 반시계
  const cross = relX * state.dirY - relY * state.dirX;
  const dir = cross >= 0 ? 1 : -1;
  state.orbit = { i: best, r, theta: Math.atan2(relY, relX), dir };
  state.mode = 'orbit';
  state.events.push({ type: 'latch', i: best });
  return true;
}

function release(state) {
  // 접선 + 에임 어시스트 + 자석 조준 — 조준선(aim)이 보여준 그대로 날아간다
  const a = aim(state);
  state.dirX = a.dx;
  state.dirY = a.dy;
  state.noLatch = state.orbit.i;
  state.orbit = null;
  state.mode = 'flying';
  state.events.push({ type: 'release', snapped: a.snapped });
}

function die(state, cause) {
  state.dead = true;
  state.deathCause = cause;
  state.events.push({ type: 'death', cause });
}


// 한 물리 스텝. input = { hold: boolean }
function step(state, input) {
  if (state.dead) return state;
  state.t += DT;
  const p = paramsAt(state.height);
  const held = !!input.hold;

  // 홀드 에지 처리 — 잡기/놓기
  if (state.mode === 'orbit' && !held) release(state);
  if (state.mode === 'flying' && held) tryLatch(state); // 사거리 밖이면 계속 날면서 다음 스텝에 재시도

  if (state.mode === 'orbit') {
    const o = state.orbit;
    const a = state.anchors[o.i];
    o.theta += o.dir * orbitOmega(p.speed, o.r) * DT;
    state.x = a.x + Math.cos(o.theta) * o.r;
    state.y = a.y + Math.sin(o.theta) * o.r;
  } else {
    state.x += state.dirX * p.speed * DT;
    state.y += state.dirY * p.speed * DT;
  }
  state._held = held;

  if (state.y > state.height) state.height = state.y;
  ensureTrack(state, state.y + WORLD.genMargin);

  // 방금 놓은 앵커의 사거리를 벗어났으면 다시 잡을 수 있게 풀어 준다
  if (state.noLatch >= 0) {
    const a = state.anchors[state.noLatch];
    if (!a || Math.hypot(a.x - state.x, a.y - state.y) > WORLD.captureR + 4) state.noLatch = -1;
  }

  // 창(window) 전진 — 최고점에서 fallLimit 아래로 사라진 것들은 다시 만날 수 없다.
  // 이걸 안 하면 트랙이 길어질수록 매 스텝의 스캔이 무한히 늘어 후반에 끊긴다.
  const cutoff = state.height - WORLD.fallLimit - 80;
  while (state.anchorFrom < state.anchors.length - 1 && state.anchors[state.anchorFrom].y < cutoff) {
    state.anchorFrom++;
  }
  while (state.hazardFrom < state.hazards.length && state.hazards[state.hazardFrom].y < cutoff) {
    state.hazardFrom++;
  }

  // 죽음 판정
  if (Math.abs(state.x) > WORLD.halfW - WORLD.cometR) return die(state, 'wall'), state;
  if (state.y < state.height - WORLD.fallLimit) return die(state, 'fell'), state;

  // 소행성: 충돌 + 니어미스 (지나간 것은 건너뛴다)
  for (let i = state.hazardFrom; i < state.hazards.length; i++) {
    const hz = state.hazards[i];
    // 소행성은 구간 안에서 y가 조금 뒤섞일 수 있으므로, 한 구간보다 훨씬 넉넉히 지나서 끊는다
    if (hz.y > state.y + 200) break;

    if (hz.y < state.y - 60) continue;
    const d = Math.hypot(hz.x - state.x, hz.y - state.y);
    if (d < WORLD.hazardR + WORLD.cometR) return die(state, 'hazard'), state;
    if (d < WORLD.hazardR + WORLD.cometR + WORLD.nearMissBand && !state._credited.has(i)) {
      state._credited.add(i);
      state.sparks += 1;
      state.events.push({ type: 'spark', x: hz.x, y: hz.y });
    }
  }
  return state;
}

// 이벤트 큐를 비우며 반환 — 렌더러/사운드용
function drainEvents(state) {
  const ev = state.events;
  state.events = [];
  return ev;
}

// ===== comet-sling/render.js =====
// 캔버스 렌더러 — 게임의 '분위기'가 사는 곳.
// 깊은 우주 배경, 패럴랙스 별, 네온 글로우, 코멧 트레일, 파티클, 화면 흔들림.
// 월드 좌표(y 위로 증가)를 화면 좌표로 뒤집어 그린다. 카메라는 y만 따라간다.


const COL = {
  bgTop: '#0a0618',
  bgBottom: '#03030a',
  comet: '#8ef6ff',
  cometCore: '#ffffff',
  trail: 'rgba(110, 235, 255, 0.55)',
  anchor: '#b06bff',
  anchorActive: '#e3c2ff',
  hazard: '#ff5a3c',
  hazardCore: '#7d1f10',
  wall: 'rgba(120, 90, 255, 0.5)',
  spark: '#ffd34d',
  hint: 'rgba(255,255,255,0.85)',
};

class Renderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.camY = 0;
    this.trail = [];
    this.particles = [];
    this._shake = 0;
    this._stars = this._makeStars();
    this._t = 0;
    this._dprCap = 1.5;
    this.vx = 0;
    this.vy = 0;
    this._frameTimes = [];
    this._lastFrameAt = 0;
    this.resize();
  }

  _makeStars() {
    // 고정 시드 별밭 — 층마다 패럴랙스 계수가 다르다
    const layers = [];
    let s = 1234567;
    const rnd = () => ((s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
    for (const [count, depth, size] of [[70, 0.15, 1], [45, 0.35, 1.6], [22, 0.6, 2.4]]) {
      const pts = [];
      for (let i = 0; i < count; i++) pts.push({ x: rnd(), y: rnd(), tw: rnd() * Math.PI * 2 });
      layers.push({ pts, depth, size });
    }
    return layers;
  }

  resize() {
    // 화소 수가 곧 비용이다. 1.5배까지만 쓰고, 프레임이 밀리면 _autoQuality 가 더 낮춘다.
    const dpr = Math.min(window.devicePixelRatio || 1, this._dprCap ?? 1.5);
    const r = this.canvas.getBoundingClientRect();
    this.dpr = dpr;
    this.canvas.width = Math.round(r.width * dpr);
    this.canvas.height = Math.round(r.height * dpr);
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.w = r.width;
    this.h = r.height;
    this.scale = this.w / (WORLD.halfW * 2 + 8);
    this._bake();
  }

  // 오프스크린 캔버스 하나를 만들어 CSS 픽셀 기준으로 그릴 수 있게 준비한다
  _surface(w, h) {
    const c = document.createElement('canvas');
    c.width = Math.ceil(w * this.dpr);
    c.height = Math.ceil(h * this.dpr);
    const cx = c.getContext('2d');
    cx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    return { canvas: c, ctx: cx, w, h };
  }

  // 매 프레임 shadowBlur를 다시 계산하면 폰에서 프레임이 반토막 난다.
  // 글로우가 붙는 것들(앵커·소행성·코멧)과 별밭·그라디언트를 리사이즈 때 한 번만 굽는다.
  _bake() {
    // 벽 그라디언트 (좌/우 공용 — x는 그릴 때 옮긴다)
    const wg = this.ctx.createLinearGradient(-6, 0, 6, 0);
    wg.addColorStop(0, 'rgba(120,90,255,0)');
    wg.addColorStop(0.5, COL.wall);
    wg.addColorStop(1, 'rgba(120,90,255,0)');
    this._wallGrad = wg;

    // 앵커 — 평소/활성 두 벌
    const ringR = 4.6 * this.scale * 0.55;
    const coreR = 1.4 * this.scale * 0.55;
    this._sprAnchor = [false, true].map((active) => {
      const blur = active ? 22 : 12;
      const pad = blur + 6;
      const s = this._surface((ringR + pad) * 2, (ringR + pad) * 2);
      const c = s.ctx, m = s.w / 2;
      const col = active ? COL.anchorActive : COL.anchor;
      c.shadowColor = col;
      c.shadowBlur = blur;
      c.strokeStyle = col;
      c.lineWidth = active ? 3 : 2;
      c.beginPath();
      c.arc(m, m, ringR, 0, Math.PI * 2);
      c.stroke();
      c.fillStyle = col;
      c.beginPath();
      c.arc(m, m, coreR, 0, Math.PI * 2);
      c.fill();
      return s;
    });

    // 소행성 — 모양이 조금씩 다른 세 벌 (회전은 그릴 때 준다)
    const hr = WORLD.hazardR * this.scale;
    this._sprHazard = [0, 1, 2].map((variant) => {
      const pad = 14 + 6;
      const s = this._surface((hr + pad) * 2, (hr + pad) * 2);
      const c = s.ctx, m = s.w / 2;
      c.shadowColor = COL.hazard;
      c.shadowBlur = 14;
      c.fillStyle = COL.hazardCore;
      c.strokeStyle = COL.hazard;
      c.lineWidth = 2;
      c.beginPath();
      for (let k = 0; k < 8; k++) {
        const a = (k / 8) * Math.PI * 2;
        const rr = hr * (0.82 + 0.18 * Math.sin(variant * 3.1 + k * 2.7));
        const px = m + Math.cos(a) * rr, py = m + Math.sin(a) * rr;
        k === 0 ? c.moveTo(px, py) : c.lineTo(px, py);
      }
      c.closePath();
      c.fill();
      c.stroke();
      c.shadowBlur = 0;
      c.fillStyle = 'rgba(255,90,60,0.5)';
      c.beginPath();
      c.arc(m - hr * 0.25, m - hr * 0.2, hr * 0.18, 0, Math.PI * 2);
      c.fill();
      return s;
    });

    // 코멧
    const cr = WORLD.cometR * this.scale;
    {
      const pad = 26 + 6;
      const s = this._surface((cr + pad) * 2, (cr + pad) * 2);
      const c = s.ctx, m = s.w / 2;
      c.shadowColor = COL.comet;
      c.shadowBlur = 26;
      c.fillStyle = COL.comet;
      c.beginPath();
      c.arc(m, m, cr, 0, Math.PI * 2);
      c.fill();
      c.shadowBlur = 10;
      c.fillStyle = COL.cometCore;
      c.beginPath();
      c.arc(m, m, cr * 0.55, 0, Math.PI * 2);
      c.fill();
      this._sprComet = s;
    }

  }

  // 기기 성능을 실제로 재서, 60fps를 못 내면 해상도를 한 단계씩 낮춘다.
  // 어떤 폰인지 미리 알 수 없으니 추측하지 않고 측정한다. 내리기만 하고 다시 올리지
  // 않는다 — 왔다 갔다 하면 그게 더 거슬린다.
  _autoQuality() {
    const now = performance.now();
    const prev = this._lastFrameAt;
    this._lastFrameAt = now;
    if (!prev) return;
    const dtMs = now - prev;
    if (dtMs > 500) return; // 탭 전환 등으로 멈춘 구간은 버린다
    const f = this._frameTimes;
    f.push(dtMs);
    if (f.length < 90) return;
    f.sort((a, b) => a - b);
    const median = f[Math.floor(f.length / 2)];
    f.length = 0;
    if (median > 20 && this._dprCap > 1) {
      this._dprCap = Math.max(1, this._dprCap - 0.25);
      this.resize();
    }
  }

  // 스프라이트를 중심 좌표에 그린다 (CSS 픽셀 기준)
  _blit(ctx, s, x, y, rot = 0) {
    if (rot) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.drawImage(s.canvas, -s.w / 2, -s.h / 2, s.w, s.h);
      ctx.restore();
      return;
    }
    ctx.drawImage(s.canvas, x - s.w / 2, y - s.h / 2, s.w, s.h);
  }

  reset(state) {
    this.camY = state.y;
    this.vx = state.x;
    this.vy = state.y;
    this.trail = [];
    this.particles = [];
    this._shake = 0;
  }

  // 월드 → 화면
  sx(x) { return this.w / 2 + x * this.scale; }
  sy(y) { return this.h * 0.68 - (y - this.camY) * this.scale; }

  shake(power) { this._shake = Math.max(this._shake, power); }

  clearTrail() { this.trail = []; }

  burst(wx, wy) {
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2, v = 30 + Math.random() * 90;
      this.particles.push({ x: wx, y: wy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.6, max: 0.6, col: COL.spark, r: 1.6 });
    }
  }

  explode(wx, wy) {
    for (let i = 0; i < 42; i++) {
      const a = Math.random() * Math.PI * 2, v = 40 + Math.random() * 200;
      const col = Math.random() < 0.6 ? COL.comet : '#ffffff';
      this.particles.push({ x: wx, y: wy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.9 + Math.random() * 0.5, max: 1.2, col, r: 1.2 + Math.random() * 2.2 });
    }
  }

  draw(state, ui) {
    const ctx = this.ctx;
    // 애니메이션은 실제 경과 시간으로 — 프레임 수에 묶으면 주사율마다 속도가 달라진다
    const dt = Math.min(ui.dt || 1 / 60, 0.1);
    this._t += dt;
    this._autoQuality();

    // 화면상의 코멧 위치 — 물리 스텝 사이를 보간한 값 (없으면 물리 위치 그대로)
    const view = ui.view || { x: state.x, y: state.y };
    this.vx = view.x;
    this.vy = view.y;

    // 카메라 — 위로는 바로, 아래로는 천천히. 지수 감쇠라 주사율과 무관하게 같은 속도다.
    const target = Math.max(view.y, state.height - 20);
    const k = state.dead ? 2.5 : 9;
    this.camY += (target - this.camY) * (1 - Math.exp(-k * dt));

    // 트레일 기록 (죽으면 멈춘다)
    if (!state.dead && ui.mode === 'running') {
      this.trail.push({ x: view.x, y: view.y });
      if (this.trail.length > 46) this.trail.shift();
    }

    // 흔들림
    let ox = 0, oy = 0;
    if (this._shake > 0.2) {
      ox = (Math.random() * 2 - 1) * this._shake;
      oy = (Math.random() * 2 - 1) * this._shake;
      this._shake *= 0.86;
    }

    // 배경은 CSS(#app)가 한 번만 칠한다 — 매 프레임 전체 화면을 다시 칠하는 게
    // 렌더링에서 가장 비쌌다. 캔버스는 투명하게 지우기만 한다.
    ctx.clearRect(0, 0, this.w, this.h);

    ctx.save();
    ctx.translate(ox, oy);

    this._drawStars(ctx);
    this._drawWalls(ctx, state);
    if (ui.challenge) this._drawFinishLine(ctx, ui.challenge);
    this._drawAnchors(ctx, state, ui);
    this._drawHazards(ctx, state);
    this._drawTrail(ctx);
    if (!state.dead && state.orbit) this._drawAimLine(ctx, state);
    if (!state.dead && ui.mode !== 'ready') this._drawComet(ctx, state);
    this._drawParticles(ctx, dt);
    if (ui.mode === 'ready') this._drawReadyComet(ctx, state);
    if (ui.mode === 'ready' && ui.demo) this._drawGhostDemo(ctx, state);
    else if (ui.coach) this._drawCoachFinger(ctx, ui.coach === 'hold', ui.coach === 'hold' ? 'hold' : 'let go!');

    ctx.restore();
  }

  _drawStars(ctx) {
    // 상태 변경(fillStyle/globalAlpha)이 별 개수만큼 일어나면 폰에서 비싸다.
    // 반짝임을 층 단위로 묶어 변경 횟수를 137번 → 3번으로 줄인다.
    ctx.fillStyle = '#cfd9ff';
    for (const layer of this._stars) {
      const scroll = (this.camY * this.scale * layer.depth) % this.h;
      const tw = 0.5 + 0.5 * Math.abs(Math.sin(this._t * 1.3 + layer.depth * 7));
      ctx.globalAlpha = 0.25 + 0.5 * layer.depth * tw;
      for (const p of layer.pts) {
        let y = (p.y * this.h + scroll) % this.h;
        if (y < 0) y += this.h;
        ctx.fillRect(p.x * this.w, this.h - y, layer.size, layer.size);
      }
    }
    ctx.globalAlpha = 1;
  }

  _drawWalls(ctx, state) {
    const xl = this.sx(-WORLD.halfW), xr = this.sx(WORLD.halfW);
    for (const x of [xl, xr]) {
      ctx.save();
      ctx.translate(x, 0);
      ctx.fillStyle = this._wallGrad;
      ctx.fillRect(-6, 0, 12, this.h);
      ctx.restore();
      ctx.strokeStyle = 'rgba(170,140,255,0.8)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, this.h);
      ctx.stroke();
    }
    // 벽 눈금 — 스크롤이 몸으로 느껴지게. 한 path에 모아 stroke는 한 번만.
    ctx.strokeStyle = 'rgba(170,140,255,0.35)';
    ctx.lineWidth = 1;
    const stepW = 40 * this.scale;
    const base = (this.camY * this.scale) % stepW;
    ctx.beginPath();
    for (let y = -stepW; y < this.h + stepW; y += stepW) {
      const yy = y + base;
      ctx.moveTo(xl, yy);
      ctx.lineTo(xl + 7, yy);
      ctx.moveTo(xr, yy);
      ctx.lineTo(xr - 7, yy);
    }
    ctx.stroke();
  }

  // 도전장 결승선 — 친구 기록의 높이에 금색 선. 넘으면 초록으로 남는다.
  _drawFinishLine(ctx, c) {
    if (!this._visible(c.height, 40)) return;
    const y = this.sy(c.height);
    const col = c.beaten ? 'rgba(120, 240, 160, 0.75)' : 'rgba(255, 211, 77, 0.75)';
    ctx.save();
    ctx.setLineDash([12, 8]);
    ctx.lineDashOffset = -this._t * 25;
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(this.sx(-WORLD.halfW), y);
    ctx.lineTo(this.sx(WORLD.halfW), y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = '800 13px system-ui';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillStyle = col;
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 5;
    ctx.fillText(c.beaten ? `🏆 ${c.score}` : `🏁 ${c.score}`, this.sx(WORLD.halfW) - 8, y - 5);
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  _visible(wy, pad = 80) {
    const y = this.sy(wy);
    return y > -pad && y < this.h + pad;
  }

  _drawAnchors(ctx, state, ui) {
    const pulse = 0.5 + 0.5 * Math.sin(this._t * 3.2);
    // 점선 큰 원은 래스터화가 비싸다 — 사거리 안의 '가장 가까운' 앵커 하나만 그린다
    let nearest = -1, nearestD = WORLD.captureR;
    if (!state.dead) {
      for (let i = state.anchorFrom || 0; i < state.anchors.length; i++) {
        const a = state.anchors[i];
        if (a.y < state.y - WORLD.captureR) continue;
        const d = Math.hypot(a.x - state.x, a.y - state.y);
        if (d < nearestD) { nearestD = d; nearest = i; }
      }
    }
    for (let i = state.anchorFrom || 0; i < state.anchors.length; i++) {
      const a = state.anchors[i];
      if (this.sy(a.y) < -80) break;   // 화면 위로 벗어남 — 앵커는 정렬돼 있으니 끝
      if (!this._visible(a.y)) continue;
      const x = this.sx(a.x), y = this.sy(a.y);
      const active = state.orbit && state.orbit.i === i;
      const inRange = i === nearest;

      // 잡을 수 있는 앵커: 점선 캡처 링이 숨쉰다
      if (inRange && !active) {
        ctx.setLineDash([4, 6]);
        ctx.strokeStyle = `rgba(176,107,255,${0.25 + 0.3 * pulse})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(x, y, WORLD.captureR * this.scale * (0.92 + 0.06 * pulse), 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // 궤도 중: 실제 궤도 원 + 앵커→코멧 빔
      if (active) {
        ctx.strokeStyle = 'rgba(227,194,255,0.5)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(x, y, state.orbit.r * this.scale, 0, Math.PI * 2);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(227,194,255,0.35)';
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(this.sx(this.vx), this.sy(this.vy));
        ctx.stroke();
      }

      // 앵커 본체 — 미리 구운 네온 링
      this._blit(ctx, this._sprAnchor[active ? 1 : 0], x, y);
    }
  }

  _drawHazards(ctx, state) {
    for (let i = state.hazardFrom || 0; i < state.hazards.length; i++) {
      const hz = state.hazards[i];
      if (this.sy(hz.y) < -280) break; // 화면 위로 한참 벗어남 (구간 내 뒤섞임 여유 포함)
      if (!this._visible(hz.y)) continue;
      this._blit(ctx, this._sprHazard[i % 3], this.sx(hz.x), this.sy(hz.y), this._t * 0.4 + i * 1.7);
    }
  }

  _drawTrail(ctx) {
    const n = this.trail.length;
    if (n < 2) return;
    // 점마다 stroke 하면 폰에서 45번의 래스터화가 된다. 굵기/투명도가 비슷한
    // 네 구간으로 묶어 폴리라인 4번으로 그린다 — 보기엔 그대로다.
    const CHUNKS = 4;
    ctx.strokeStyle = COL.trail;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (let c = 0; c < CHUNKS; c++) {
      const from = Math.floor((c * (n - 1)) / CHUNKS);
      const to = Math.floor(((c + 1) * (n - 1)) / CHUNKS);
      if (to <= from) continue;
      const t = (c + 1) / CHUNKS;
      ctx.globalAlpha = t * 0.7;
      ctx.lineWidth = t * 5;
      ctx.beginPath();
      ctx.moveTo(this.sx(this.trail[from].x), this.sy(this.trail[from].y));
      for (let i = from + 1; i <= to; i++) {
        ctx.lineTo(this.sx(this.trail[i].x), this.sy(this.trail[i].y));
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // 조준선 — 지금 놓으면 날아갈 방향. 근처 앵커에 스냅되면 금색으로 잠긴다.
  // "옆으로 튕겨나갔다"가 아니라 "옆을 향할 때 놓았다"를 눈으로 알게 해 준다.
  _drawAimLine(ctx, state) {
    const a = aim(state);
    const x0 = this.sx(this.vx), y0 = this.sy(this.vy);
    let lenW = 85;
    if (a.snapped !== null) {
      const t = state.anchors[a.snapped];
      lenW = Math.hypot(t.x - state.x, t.y - state.y);
    }
    const x1 = this.sx(this.vx + a.dx * lenW), y1 = this.sy(this.vy + a.dy * lenW);
    const locked = a.snapped !== null;
    const col = locked ? 'rgba(255,211,77,0.9)' : 'rgba(142,246,255,0.45)';

    ctx.save();
    ctx.setLineDash(locked ? [7, 5] : [4, 7]);
    ctx.lineDashOffset = -this._t * 40; // 점선이 진행 방향으로 흐른다
    ctx.strokeStyle = col;
    ctx.lineWidth = locked ? 2.5 : 1.5;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
    ctx.setLineDash([]);

    // 화살촉
    const ang = Math.atan2(y1 - y0, x1 - x0);
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x1 - 9 * Math.cos(ang - 0.42), y1 - 9 * Math.sin(ang - 0.42));
    ctx.lineTo(x1 - 9 * Math.cos(ang + 0.42), y1 - 9 * Math.sin(ang + 0.42));
    ctx.closePath();
    ctx.fill();

    // 스냅된 앵커에 잠금 링
    if (locked) {
      const t = state.anchors[a.snapped];
      const pulse = 0.85 + 0.15 * Math.sin(this._t * 8);
      ctx.strokeStyle = 'rgba(255,211,77,0.85)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(this.sx(t.x), this.sy(t.y), 10 * pulse, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  _drawComet(ctx, state) {
    this._blit(ctx, this._sprComet, this.sx(this.vx), this.sy(this.vy));
  }

  _drawParticles(ctx, dt) {
    this.particles = this.particles.filter((p) => (p.life -= dt) > 0);
    for (const p of this.particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.97;
      p.vy *= 0.97;
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.col;
      ctx.beginPath();
      ctx.arc(this.sx(p.x), this.sy(p.y), p.r * this.scale * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // 출발대: 코멧이 숨쉬듯 떠 있다
  _drawReadyComet(ctx, state) {
    const bob = Math.sin(this._t * 2.2) * 4;
    this._blit(ctx, this._sprComet, this.sx(this.vx), this.sy(this.vy) + bob);
  }

  // 유령 시범 — 첫 릴리즈에 성공하기 전까지, 출발대에서 유령 혜성이 직접 보여준다:
  // 다가가고 → (손가락이 누르면) 붙어서 한 바퀴 돌고 → (손가락이 떼면) 위로 날아간다.
  // 글 대신 손이 가르친다.
  _drawGhostDemo(ctx, state) {
    const a = state.anchors[0];
    const r = 20;
    const T = 4.4, t = this._t % T;
    let gx, gy, pressed = false, label = null, alpha = 0.7;

    if (t < 1.1) {
      // 아래에서 궤도 가장자리로 다가간다
      const k = t / 1.1;
      gx = a.x + r;
      gy = a.y - 60 + 60 * k;
    } else if (t < 3.0) {
      // 손가락이 누르고 — 한 바퀴
      pressed = true;
      label = 'hold';
      const th = ((t - 1.1) / 1.9) * Math.PI * 2;
      gx = a.x + Math.cos(th) * r;
      gy = a.y + Math.sin(th) * r;
    } else if (t < 3.9) {
      // 손가락을 떼고 — 접선(위)으로 날아가며 사라진다
      const k = (t - 3.0) / 0.9;
      gx = a.x + r;
      gy = a.y + k * 90;
      alpha = 0.7 * (1 - k);
      if (k < 0.45) label = 'let go!';
    } else {
      this._drawCoachFinger(ctx, false, null);
      return;
    }

    // 시범 중에는 캡처 링을 항상 보여준다
    ctx.setLineDash([4, 6]);
    ctx.strokeStyle = 'rgba(176,107,255,0.35)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(this.sx(a.x), this.sy(a.y), WORLD.captureR * this.scale * 0.95, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    if (pressed) {
      ctx.strokeStyle = 'rgba(227,194,255,0.45)';
      ctx.beginPath();
      ctx.arc(this.sx(a.x), this.sy(a.y), r * this.scale, 0, Math.PI * 2);
      ctx.stroke();
    }

    // 유령 혜성
    ctx.globalAlpha = alpha;
    this._blit(ctx, this._sprComet, this.sx(gx), this.sy(gy));
    ctx.globalAlpha = 1;

    this._drawCoachFinger(ctx, pressed, label);
  }

  // 화면 아래 중앙의 코치 손가락 — 엄지가 실제로 닿을 자리에서 누름/뗌을 보여준다
  _drawCoachFinger(ctx, pressed, label) {
    const hx = this.w / 2, hy = this.h * 0.88;
    const pulse = 0.5 + 0.5 * Math.sin(this._t * 5);

    ctx.beginPath();
    ctx.arc(hx, hy, pressed ? 24 : 27, 0, Math.PI * 2);
    if (pressed) {
      ctx.fillStyle = `rgba(142,246,255,${0.16 + 0.12 * pulse})`;
      ctx.fill();
      ctx.strokeStyle = COL.hint;
      ctx.lineWidth = 3;
      ctx.stroke();
    } else {
      ctx.strokeStyle = `rgba(255,255,255,${0.3 + 0.25 * pulse})`;
      ctx.lineWidth = 2;
      ctx.setLineDash([3, 5]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.font = '26px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('👆', hx, hy + (pressed ? 3 : 0));

    if (label) {
      ctx.font = '800 15px system-ui';
      ctx.fillStyle = label === 'hold' ? COL.hint : COL.spark;
      ctx.shadowColor = 'rgba(0,0,0,0.8)';
      ctx.shadowBlur = 6;
      ctx.fillText(label, hx, hy + 46);
      ctx.shadowBlur = 0;
    }
  }
}

// ===== comet-sling/audio.js =====
// 신시사이저 효과음 — 오디오 파일 없이 코드로만 만든다.
// 형제 게임들의 Sound와 같은 뼈대지만, 소리의 결이 다르다:
// 딸깍·퐁 같은 '장난감' 소리 대신 휘익·지잉·쿵 같은 '속도'의 소리다.
//
// 효과음은 전부 WebAudio 한 경로다 — 지연이 가장 짧고, 재생이 메인 스레드를
// 건드리지 않는다. (한때 iOS에서 효과음마다 <audio>를 재생하는 경로를 뒀는데,
// 사파리의 미디어 파이프라인이 재생마다 메인 스레드를 잡아 미세한 끊김을 만들었다.)
//
// 아이폰 무음 스위치는 WebAudio를 통째로 죽이는데, 해법은 재생 경로를 바꾸는 게
// 아니라 오디오 세션을 바꾸는 것이다: 첫 제스처에서 '무음 루프' <audio>를 하나
// 틀어 두면 사파리가 미디어 재생 모드로 전환되고, 그 뒤로는 WebAudio도 무음
// 스위치를 무시하고 들린다. (unmute.js 등이 쓰는 널리 알려진 기법)

const STORAGE_MUTED = 'cms.muted';
const MASTER = 2.4; // 전체 음량 — 개별 레시피는 그대로 두고 여기서 키운다

const isIOS = () =>
  typeof navigator !== 'undefined' &&
  (/iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1));

// 레시피 — voice(v)는 컨텍스트에 독립적인 두 가지 붓만 쓴다.
// v.tone(주파수, 옵션) · v.noise(옵션). 시간은 항상 t0 기준 상대값.
const RECIPES = {
  // 출발 — 낮은 곳에서 치솟는 휘익
  launch: (v) => {
    v.noise({ dur: 0.35, gain: 0.1, freq: 500, q: 0.8 });
    v.tone(160, { type: 'sawtooth', dur: 0.32, gain: 0.05, slide: 420 });
  },
  // 앵커에 딱 붙는 순간 — 짧고 단단한 저음 + 자기장 울림
  latch: (v) => {
    v.tone(110, { type: 'square', dur: 0.06, gain: 0.1 });
    v.tone(330, { type: 'sine', dur: 0.18, gain: 0.05, delay: 0.02 });
  },
  // 놓는 순간 — 위로 감기는 지잉
  release: (v) => {
    v.tone(220, { type: 'sawtooth', dur: 0.16, gain: 0.06, slide: 500 });
    v.noise({ dur: 0.14, gain: 0.05, freq: 1800, q: 1.5 });
  },
  // 니어미스 — 밝은 반짝
  spark: (v) => {
    v.tone(1500, { type: 'sine', dur: 0.09, gain: 0.09 });
    v.tone(2100, { type: 'sine', dur: 0.1, gain: 0.06, delay: 0.045 });
  },
  // 죽음 — 부딪힘은 묵직하게
  crashHard: (v) => {
    v.noise({ dur: 0.4, gain: 0.22, freq: 220, q: 0.7 });
    v.tone(70, { type: 'square', dur: 0.3, gain: 0.12 });
  },
  // 죽음 — 추락은 아래로 흘러내리게
  crashFall: (v) => {
    v.tone(500, { type: 'sine', dur: 0.5, gain: 0.09, slide: -420 });
  },
  // 최고 기록 갱신
  fanfare: (v) => {
    [523, 659, 784, 1047].forEach((f, i) =>
      v.tone(f, { type: 'triangle', dur: 0.16, gain: 0.09, delay: i * 0.09 })
    );
  },
};

// 잡음원(1초)은 컨텍스트당 한 번만 만들어 돌려 쓴다.
// 소리마다 새로 채우면 재생 순간에 난수 1만5천 개를 만드느라 프레임이 튄다.
const noiseCache = new WeakMap();
function sharedNoise(ctx) {
  let buf = noiseCache.get(ctx);
  if (buf) return buf;
  const len = Math.ceil(ctx.sampleRate);
  buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  noiseCache.set(ctx, buf);
  return buf;
}

// 컨텍스트에 레시피를 그리는 붓
function makeVoice(ctx, destination, t0) {
  return {
    tone(freq, { type = 'sine', dur = 0.12, gain = 0.1, delay = 0, slide = 0 } = {}) {
      const t = t0 + delay;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(gain, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
      osc.connect(g).connect(destination);
      osc.start(t);
      osc.stop(t + dur + 0.05);
    },
    noise({ dur = 0.3, gain = 0.18, freq = 800, delay = 0, q = 1 } = {}) {
      const t = t0 + delay;
      const buf = sharedNoise(ctx);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      // 같은 잡음원을 임의 지점부터 잘라 쓰므로 매번 다르게 들린다
      const offset = Math.random() * Math.max(0, buf.duration - dur);
      const filt = ctx.createBiquadFilter();
      filt.type = 'bandpass';
      filt.frequency.setValueAtTime(freq, t);
      filt.Q.value = q;
      const g = ctx.createGain();
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
      src.connect(filt).connect(g).connect(destination);
      src.start(t, offset, dur);
    },
  };
}

// 무음 루프용 WAV data URI — 헤더 + 0으로 채운 표본. 코드로 만들면 파일이 필요 없다.
function silentWavUri(seconds = 0.2, rate = 8000) {
  const n = Math.ceil(seconds * rate);
  const bytes = new Uint8Array(44 + n * 2); // data 구간은 0(무음)으로 남는다
  const view = new DataView(bytes.buffer);
  const str = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
  str(0, 'RIFF');
  view.setUint32(4, 36 + n * 2, true);
  str(8, 'WAVEfmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, rate, true);
  view.setUint32(28, rate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  str(36, 'data');
  view.setUint32(40, n * 2, true);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return 'data:audio/wav;base64,' + btoa(bin);
}

class Sound {
  constructor({ forceHtml5 = false } = {}) {
    this.muted = safeStorage.getItem(STORAGE_MUTED) === '1';
    this._ctx = null;
    this._warmed = false;
    // iOS: 무음 스위치가 WebAudio를 죽인다 → 무음 루프로 세션을 미디어 모드로 바꾼다.
    // (?html5audio 는 이 우회를 아무 데서나 켜 보는 테스트 스위치로 남겨 둔다)
    this._needKeepAlive = forceHtml5 || isIOS();
    this._keepAliveEl = null;
  }

  get ctx() {
    if (typeof AudioContext === 'undefined' && typeof webkitAudioContext === 'undefined') return null;
    if (!this._ctx) {
      try {
        this._ctx = new (window.AudioContext || window.webkitAudioContext)();
      } catch {
        return null;
      }
    }
    if (this._ctx.state === 'suspended') this._ctx.resume().catch(() => {});
    return this._ctx;
  }

  setMuted(m) {
    this.muted = m;
    safeStorage.setItem(STORAGE_MUTED, m ? '1' : '0');
  }

  // 오디오 장치를 미리 연다 — 이게 이 파일에서 가장 비싼 한 번(폰에서 100ms 이상)이다.
  // 누르는 순간에 열면 그게 곧 "홀드할 때 처음 끊김"이 되므로, 로딩 직후에 열어 둔다.
  // 컨텍스트 '생성'은 제스처가 필요 없고, '재생'만 제스처가 필요하다.
  prime() {
    const ctx = this.ctx;
    if (ctx) try { sharedNoise(ctx); } catch {} // 잡음원도 지금 만들어 둔다
  }

  // 첫 제스처에서 딱 한 번:
  //  - WebAudio 재생 허가(resume)
  //  - iOS면 무음 루프를 시작해 무음 스위치를 우회
  warm() {
    if (this._warmed) return;
    this._warmed = true;
    this.ctx; // getter가 resume까지 처리한다
    if (this._needKeepAlive) {
      try {
        const el = new Audio(silentWavUri());
        el.loop = true;
        el.play().catch(() => {});
        this._keepAliveEl = el;
      } catch {}
    }
  }

  _play(name) {
    if (this.muted) return;
    const ctx = this.ctx;
    if (!ctx) return;
    try {
      const master = ctx.createGain();
      master.gain.value = MASTER;
      master.connect(ctx.destination);
      RECIPES[name](makeVoice(ctx, master, ctx.currentTime));
    } catch {}
  }

  launch() { this._play('launch'); }
  latch() { this._play('latch'); }
  release() { this._play('release'); }
  spark() { this._play('spark'); }
  fanfare() { this._play('fanfare'); }
  crash(cause) { this._play(cause === 'fell' ? 'crashFall' : 'crashHard'); }
}

// ===== comet-sling/ads.js =====
// 전면 광고 자리와 노출 빈도 관리 — 형제 게임들과 같은 뼈대, 다른 단위.
//
// 퍼즐 게임은 '레벨 클리어'를 세지만, 엔드리스 러너는 '런'을 센다. 규칙도 그에 맞춘다:
//   - 처음 몇 런은 무조건 무광고 (재미를 느끼기 전에 끊으면 그대로 이탈한다)
//   - 런 도중에는 절대 안 뜬다. 죽고 나서 "다시" 를 누르는 전환 순간에만 뜬다
//   - 짧은 런(몇 초 만에 죽음) 뒤에는 안 뜬다 — 연속 즉사에 광고까지 겹치면 최악의 경험이다
//   - 런 수 조건과 시간 간격을 함께 본다

const STORAGE_AD = 'cms.ads';

const AD_CONFIG = {
  // 이 횟수만큼 런을 마치기 전에는 광고를 띄우지 않는다
  freeRuns: 5,
  // 그 뒤로는 이 런 수마다
  everyNRuns: 3,
  // 아무리 자주 죽어도 이 시간(초) 안에는 두 번 띄우지 않는다
  minSecondsBetween: 60,
  // 이 시간(초)보다 짧았던 런 뒤에는 띄우지 않는다
  minRunSeconds: 20,
  // 닫기 버튼이 열리기까지의 시간(초)
  countdownSeconds: 5,
};

// 광고 자리만 보여주는 기본 제공자 — 실제 SDK를 붙일 때 이 객체만 갈아끼운다.
function createPlaceholderProvider({ root, closeBtn, config = AD_CONFIG }) {
  return {
    name: 'placeholder',
    isReady: () => true,
    show() {
      return new Promise((resolve) => {
        let left = config.countdownSeconds;
        root.classList.remove('hidden');
        closeBtn.disabled = true;
        closeBtn.textContent = String(left);

        const tick = setInterval(() => {
          left -= 1;
          if (left > 0) {
            closeBtn.textContent = String(left);
            return;
          }
          clearInterval(tick);
          closeBtn.disabled = false;
          closeBtn.textContent = '✕';
          closeBtn.setAttribute('aria-label', 'Close ad');
        }, 1000);

        const done = () => {
          clearInterval(tick);
          closeBtn.removeEventListener('click', done);
          root.classList.add('hidden');
          resolve();
        };
        closeBtn.addEventListener('click', done);
      });
    },
  };
}

class AdManager {
  constructor({ provider, config = AD_CONFIG, enabled = true }) {
    this.provider = provider;
    this.config = config;
    this.enabled = enabled;
    this.showing = false;

    let saved = {};
    try {
      saved = JSON.parse(safeStorage.getItem(STORAGE_AD) || '{}');
    } catch {
      saved = {};
    }
    this.runsTotal = Number(saved.runsTotal) || 0;
    this.runsSinceAd = Number(saved.runsSinceAd) || 0;
    // 마지막 광고 시각은 저장하지 않는다 — 앱을 다시 열었을 때
    // "너무 이르다"는 이유로 건너뛰는 게 더 이상하다.
    this.lastShownAt = 0;
  }

  _save() {
    try {
      safeStorage.setItem(
        STORAGE_AD,
        JSON.stringify({ runsTotal: this.runsTotal, runsSinceAd: this.runsSinceAd })
      );
    } catch {}
  }

  // 런이 하나 끝났다. 노출 여부 판단은 maybeShow에서.
  noteRunEnded() {
    this.runsTotal += 1;
    this.runsSinceAd += 1;
    this._save();
  }

  shouldShow(runSeconds, now = Date.now()) {
    if (!this.enabled || this.showing) return false;
    if (this.runsTotal <= this.config.freeRuns) return false;
    if (this.runsSinceAd < this.config.everyNRuns) return false;
    if (runSeconds < this.config.minRunSeconds) return false;
    if (this.lastShownAt && now - this.lastShownAt < this.config.minSecondsBetween * 1000) {
      return false;
    }
    return this.provider.isReady();
  }

  // 조건이 맞으면 광고를 띄우고 닫힐 때까지 기다린다. 아니면 즉시 넘어간다.
  async maybeShow(runSeconds, now = Date.now()) {
    if (!this.shouldShow(runSeconds, now)) return false;
    this.showing = true;
    try {
      await this.provider.show();
    } catch {
      // 광고를 못 띄워도 게임 흐름은 멈추지 않는다
    }
    this.showing = false;
    this.runsSinceAd = 0;
    this.lastShownAt = Date.now();
    this._save();
    return true;
  }
}

// ===== comet-sling/signup.js =====
// 이메일 가입 게이트 — 첫 실행 때 한 번만 뜬다.
//
// 두 가지 경로로 이메일을 받는다:
//   1) 직접 입력 → 시작하기
//   2) 구글 로그인 버튼 (SIGNUP_CONFIG.googleClientId 를 채우면 켜진다)
//
// 받은 이메일은 기기에 저장하고, SIGNUP_CONFIG.endpoint(Apps Script 웹앱 URL)가
// 설정돼 있으면 구글 시트로도 보낸다. 전송 실패분은 큐에 쌓았다가 다음 실행 때 재시도한다.
// 설정 방법은 EMAIL-SETUP.md 참고.
//
// 강제 가입은 이탈을 부르므로 "그냥 플레이" 를 반드시 남겨 둔다 — 이메일 몇 개보다
// 플레이어 전부를 잃는 쪽이 훨씬 비싸다.

const SIGNUP_CONFIG = {
  // 구글 클라우드 콘솔에서 발급한 웹 OAuth 클라이언트 ID (비어 있으면 구글 버튼 숨김)
  googleClientId: '',
  // 이메일이 쌓일 Apps Script 웹앱 URL (비어 있으면 기기 저장만)
  endpoint: '',
};

const SIGNUP_STORE = {
  email: 'cms.email',
  skipped: 'cms.emailSkipped',
  queue: 'cms.emailQueue',
};

function validEmail(v) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
}

function loadQueue() {
  try {
    return JSON.parse(safeStorage.getItem(SIGNUP_STORE.queue) || '[]');
  } catch {
    return [];
  }
}

function saveQueue(q) {
  try {
    safeStorage.setItem(SIGNUP_STORE.queue, JSON.stringify(q.slice(-20)));
  } catch {}
}

// Apps Script는 no-cors 로 쏜다 — 응답은 못 읽지만 도착은 한다.
// 도착 확인이 불가능하므로 큐에서 지우는 건 fetch 가 예외 없이 끝났을 때다.
async function send(entry, config) {
  if (!config.endpoint) return false;
  try {
    await fetch(config.endpoint, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(entry),
    });
    return true;
  } catch {
    return false;
  }
}

async function flushQueue(config) {
  const q = loadQueue();
  if (!q.length || !config.endpoint) return;
  const remain = [];
  for (const entry of q) {
    if (!(await send(entry, config))) remain.push(entry);
  }
  saveQueue(remain);
}

// 랭킹용 점수 제출 — 이메일과 같은 endpoint 로 보낸다 (시트의 scores 탭에 쌓임).
// 신기록일 때만 부르면 시트가 깔끔하다. 실패분은 이메일과 같은 큐로 재시도.
function submitScore(score, config = SIGNUP_CONFIG) {
  const entry = {
    type: 'score',
    score,
    email: safeStorage.getItem(SIGNUP_STORE.email) || '',
    game: 'comet-sling',
    at: new Date().toISOString(),
  };
  send(entry, config).then((ok) => {
    if (!ok && config.endpoint) {
      const q = loadQueue();
      q.push(entry);
      saveQueue(q);
    }
  });
}

function decodeJwtEmail(credential) {
  try {
    const payload = JSON.parse(
      atob(credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))
    );
    return payload.email || null;
  } catch {
    return null;
  }
}

// 구글 로그인 버튼 — 클라이언트 ID가 있을 때만 스크립트를 불러와 렌더한다.
// 스크립트 로드에 실패해도 이메일 입력은 그대로 살아 있다.
function initGoogleButton(dom, config, onEmail) {
  if (!config.googleClientId) return;
  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client';
  s.async = true;
  s.onload = () => {
    try {
      window.google.accounts.id.initialize({
        client_id: config.googleClientId,
        callback: (resp) => {
          const email = decodeJwtEmail(resp.credential);
          if (email) onEmail(email, 'google');
        },
      });
      window.google.accounts.id.renderButton(dom.googleBtn, {
        theme: 'filled_black',
        size: 'large',
        text: 'continue_with',
        width: 280,
      });
      dom.googleBtn.classList.remove('hidden');
      dom.orDivider.classList.remove('hidden');
    } catch {}
  };
  document.head.appendChild(s);
}

class SignupGate {
  constructor({ dom, config = SIGNUP_CONFIG, onDone }) {
    this.dom = dom;
    this.config = config;
    this.onDone = onDone || (() => {});

    // 이미 가입했거나 건너뛴 사람에게는 다시 묻지 않는다
    if (safeStorage.getItem(SIGNUP_STORE.email) || safeStorage.getItem(SIGNUP_STORE.skipped) === '1') {
      this.dom.signup.classList.add('hidden');
      flushQueue(this.config); // 미전송분 재시도
      this.onDone();
      return;
    }

    this.dom.signup.classList.remove('hidden');

    const accept = (email, via) => this._accept(email, via);

    this.dom.emailForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const v = this.dom.emailInput.value.trim();
      if (!validEmail(v)) {
        this.dom.emailInput.classList.add('shake');
        setTimeout(() => this.dom.emailInput.classList.remove('shake'), 400);
        return;
      }
      accept(v, 'form');
    });

    this.dom.skipBtn.addEventListener('click', () => {
      safeStorage.setItem(SIGNUP_STORE.skipped, '1');
      this._close();
    });

    initGoogleButton(this.dom, this.config, accept);
  }

  _accept(email, via) {
    safeStorage.setItem(SIGNUP_STORE.email, email);
    const entry = { email, via, game: 'comet-sling', at: new Date().toISOString() };
    send(entry, this.config).then((ok) => {
      if (!ok) {
        const q = loadQueue();
        q.push(entry);
        saveQueue(q);
      }
    });
    this._close();
  }

  _close() {
    this.dom.signup.classList.add('hidden');
    this.onDone();
  }
}

// ===== comet-sling/game.js =====
// 게임 껍데기 — 엔진(순수 물리)을 화면·소리·저장과 잇는다.
// 모드: ready(출발대) → running(런) → dead(결과) → ready…



const STORE = {
  best: 'cms.best',
  runs: 'cms.runs',
  taught: 'cms.taught', // 성공한 릴리즈 누적 수 — 0이면 유령 시범, 3 미만이면 코치 손가락
};

const COACH_UNTIL_RELEASES = 3;

class Game {
  constructor({ renderer, sound, dom, onRunEnded, challengeScore = null }) {
    this.renderer = renderer;
    this.sound = sound;
    this.dom = dom;
    this.onRunEnded = onRunEnded || (() => {});

    this.paused = false;
    this._resuming = false;
    this.dom.btnPause.addEventListener('click', (e) => {
      e.stopPropagation();
      this.pause();
    });
    this.dom.btnResume.addEventListener('click', () => this._resume());
    // 백그라운드로 가면 자동 일시정지 — 전화 한 통에 런을 잃지 않게
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) this.pause();
    });

    // 도전장: 공유 링크(?beat=N)로 들어오면 친구 기록이 결승선으로 그려진다
    this.challenge = challengeScore > 0
      ? { score: challengeScore, height: challengeScore * 4, beaten: false }
      : null;

    this.dom.btnShare.addEventListener('click', (e) => {
      e.stopPropagation();
      this._share();
    });

    this.best = Number(safeStorage.getItem(STORE.best) || 0);
    this.runs = Number(safeStorage.getItem(STORE.runs) || 0);
    this.releases = Number(safeStorage.getItem(STORE.taught) || 0);

    this.mode = 'ready';
    this.holding = false;
    this._acc = 0;
    this._deadAt = 0;
    this._newBest = false;
    this._runSeconds = 0;
    this.state = newRun(this._seed());

    this._syncHud();
    this.dom.overlay.classList.add('hidden');
  }

  _seed() {
    // 런마다 다른 시드. 디버그에서는 ?seed=로 고정할 수 있다 (main.js).
    return (Date.now() ^ (Math.random() * 0xffffffff)) >>> 0;
  }

  // ----- 입력 -----

  press() {
    // 일시정지 중에는 입력 무시 — 단, 재개 카운트다운 중의 홀드는 허용 (궤도 유지용)
    if (this.paused && !this._resuming) return;
    this.holding = true;
    if (this.mode === 'ready') {
      this.mode = 'running';
      this._runSeconds = 0;
      this.dom.overlay.classList.add('hidden');
      this.sound.launch();
    } else if (this.mode === 'dead' && performance.now() - this._deadAt > 600) {
      this._retry();
    }
  }

  releasePress() {
    this.holding = false;
  }

  async _retry() {
    this.holding = false;
    await this.onRunEnded(this._runSeconds); // 광고 게이트 — 짧은 런에는 안 뜬다 (ads.js)
    this.state = newRun(this._forcedSeed ?? this._seed());
    this.mode = 'ready';
    this._newBest = false;
    this._prevX = undefined;
    this._prevY = undefined;
    this.renderer.reset(this.state);
    this.dom.overlay.classList.add('hidden');
    this._syncHud();
  }

  // ----- 일시정지 -----

  pause() {
    if (this.mode !== 'running' || this.state.dead || this.paused) return;
    this.paused = true;
    this._resuming = false;
    clearInterval(this._resumeTimer);
    this.dom.pause.classList.remove('counting');
    this.dom.pauseTitle.textContent = 'PAUSED';
    this.dom.pauseNote.classList.add('hidden');
    this.dom.btnResume.classList.remove('hidden');
    this.dom.pause.classList.remove('hidden');
  }

  _resume() {
    if (!this.paused || this._resuming) return;
    this._resuming = true;
    this.dom.pause.classList.add('counting'); // 터치가 게임으로 통과한다 (홀드 준비용)
    this.dom.btnResume.classList.add('hidden');
    // 궤도 중이었다면 "누르고 있으면 계속 돈다"를 알려준다
    this.dom.pauseNote.classList.toggle('hidden', this.state.mode !== 'orbit');
    let left = 3;
    this.dom.pauseTitle.textContent = String(left);
    this._resumeTimer = setInterval(() => {
      left -= 1;
      if (left > 0) {
        this.dom.pauseTitle.textContent = String(left);
        return;
      }
      clearInterval(this._resumeTimer);
      this.dom.pause.classList.add('hidden');
      this.dom.pause.classList.remove('counting');
      this.paused = false;
      this._resuming = false;
    }, 700);
  }

  // ----- 프레임 -----

  frame(dtMs) {
    if (this.paused) {
      this.renderer.draw(this.state, {
        mode: this.mode, holding: this.holding, challenge: this.challenge,
        view: this._view(), dt: Math.min(dtMs, 100) / 1000,
      });
      return;
    }
    if (this.mode === 'running' && !this.state.dead) {
      this._acc += Math.min(dtMs, 100) / 1000;
      this._runSeconds += Math.min(dtMs, 100) / 1000;
      // 캐치업 상한 — 프레임이 한 번 밀렸을 때 다음 프레임에 물리를 몰아서 돌리면
      // 그 프레임이 또 밀린다(죽음의 나선). 밀린 시간은 버리고 넘어간다.
      let steps = 0;
      while (this._acc >= DT && steps < 6) {
        // 보간용으로 '한 스텝 전' 위치를 남긴다
        this._prevX = this.state.x;
        this._prevY = this.state.y;
        step(this.state, { hold: this.holding });
        this._acc -= DT;
        steps++;
      }
      if (steps === 6) this._acc = 0;
      this._handleEvents();
      this._checkChallenge();
      this._syncHud();
    }
    this.renderer.draw(this.state, {
      mode: this.mode,
      holding: this.holding,
      demo: this.releases === 0,
      coach: this._coach(),
      challenge: this.challenge,
      view: this._view(),
      dt: Math.min(dtMs, 100) / 1000,
    });
  }

  // 물리는 120Hz 고정 간격, 화면은 기기 주사율(60/90/120Hz)이다. 그대로 그리면
  // 어떤 프레임은 0칸, 어떤 프레임은 2칸 움직여 눈에 덜컥거린다.
  // 마지막 두 스텝 사이를 남은 시간(_acc) 비율로 보간해 화면만 매끄럽게 만든다.
  // (물리 자체는 손대지 않으므로 결정론은 그대로다)
  _view() {
    const s = this.state;
    if (this._prevX === undefined || s.dead) return { x: s.x, y: s.y };
    const a = Math.max(0, Math.min(1, this._acc / DT));
    return {
      x: this._prevX + (s.x - this._prevX) * a,
      y: this._prevY + (s.y - this._prevY) * a,
    };
  }

  // 결승선(친구 기록 높이)을 넘는 순간 한 번 축하한다
  _checkChallenge() {
    const c = this.challenge;
    if (!c || c.beaten || this.state.height < c.height) return;
    c.beaten = true;
    this.sound.fanfare();
    this.renderer.burst(this.state.x, this.state.y);
  }

  // 결과 공유 — 공유 시트가 있으면 그걸로, 없으면 클립보드 복사
  async _share() {
    const s = Math.max(score(this.state), this.best);
    const url = new URL(location.href);
    url.search = `?beat=${s}`;
    const text = `☄️ I scored ${s} in Comet Sling — can you beat me?`;
    try {
      if (navigator.share) {
        await navigator.share({ text, url: url.toString() });
        return;
      }
    } catch {
      return; // 사용자가 공유 시트를 닫음 — 조용히
    }
    try {
      await navigator.clipboard.writeText(`${text} ${url}`);
      this._toast('Link copied!');
    } catch {
      this._toast(url.toString());
    }
  }

  _toast(msg) {
    const t = this.dom.toast;
    t.textContent = msg;
    t.classList.remove('hidden');
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => t.classList.add('hidden'), 1800);
  }

  // 아직 손에 익기 전(릴리즈 3회 미만)에는 지금 뭘 해야 하는지 손가락이 짚어준다
  _coach() {
    if (this.releases >= COACH_UNTIL_RELEASES) return null;
    if (this.mode !== 'running' || this.state.dead) return null;
    const s = this.state;
    if (s.mode === 'orbit') {
      // 릴리즈 타이밍 — 조준선이 실제로 위를 향할 때만 권한다.
      // (스냅은 아래쪽 앵커도 잡을 수 있어서, 잠김만 보고 권하면 아래로 놓게 가르친다)
      const a = aim(s);
      if (a.dy < 0.3) return null;
      return a.snapped !== null || a.dy > 0.55 ? 'release' : null;
    }
    if (!this.holding) {
      // 잡을 수 있는 앵커가 사거리 안에 있는데 안 누르고 있다 (창 안에서만 찾는다)
      let near = false;
      for (let i = s.anchorFrom || 0; i < s.anchors.length && !near; i++) {
        const a = s.anchors[i];
        if (a.y > s.y + WORLD.captureR * 1.2) break;
        if (a.y < s.y - WORLD.captureR) continue;
        near = Math.hypot(a.x - s.x, a.y - s.y) < WORLD.captureR * 1.2;
      }
      if (near) return 'hold';
    }
    return null;
  }

  _handleEvents() {
    for (const ev of drainEvents(this.state)) {
      if (ev.type === 'latch') this.sound.latch();
      if (ev.type === 'release') {
        this.sound.release();
        if (this.releases < COACH_UNTIL_RELEASES) {
          this.releases += 1;
          safeStorage.setItem(STORE.taught, String(this.releases));
        }
      }
      if (ev.type === 'spark') {
        this.sound.spark();
        this.renderer.burst(ev.x, ev.y);
      }
      if (ev.type === 'death') this._onDeath(ev.cause);
    }
  }

  _onDeath(cause) {
    this.holding = false;
    this.sound.crash(cause);
    this.renderer.shake(cause === 'wall' ? 10 : 14);
    this.renderer.explode(this.state.x, this.state.y);

    setTimeout(() => this._finalizeDeath(), 650);
  }

  _finalizeDeath() {
    this.mode = 'dead';
    this._deadAt = performance.now();
    this.runs += 1;
    safeStorage.setItem(STORE.runs, String(this.runs));

    const s = score(this.state);
    if (s > this.best) {
      this.best = s;
      this._newBest = true;
      safeStorage.setItem(STORE.best, String(s));
      submitScore(s); // 랭킹 시트로 (endpoint 설정 시) — 신기록만 보낸다
    }
    if (this._newBest) this.sound.fanfare();

    this.dom.overlayScore.textContent = String(s);
    this.dom.overlayBest.textContent = this._newBest ? 'NEW BEST!' : `BEST ${this.best}`;
    this.dom.overlayBest.classList.toggle('newbest', this._newBest);
    const c = this.challenge;
    this.dom.overlayChallenge.classList.toggle('hidden', !c);
    if (c) {
      this.dom.overlayChallenge.textContent = c.beaten
        ? `🏆 You beat your friend's ${c.score}!`
        : `🏁 ${c.score} to beat`;
    }
    this.dom.overlay.classList.remove('hidden');
    this._syncHud();
  }

  // 매 프레임 textContent를 다시 쓰면 그때마다 레이아웃이 다시 계산된다.
  // 값이 실제로 바뀔 때만 쓴다.
  _syncHud() {
    const s = String(score(this.state));
    if (s !== this._hudScore) {
      this._hudScore = s;
      this.dom.scoreLabel.textContent = s;
    }
    const b = `BEST ${this.best}`;
    if (b !== this._hudBest) {
      this._hudBest = b;
      this.dom.bestLabel.textContent = b;
    }
  }
}

// ===== comet-sling/main.js =====
// 부트스트랩 — DOM 연결, 입력(홀드/릴리즈), 루프, 리사이즈, 디버그 API.







const $ = (id) => document.getElementById(id);
const dom = {
  board: $('board'),
  scoreLabel: $('scoreLabel'),
  bestLabel: $('bestLabel'),
  btnMute: $('btnMute'),
  overlay: $('overlay'),
  overlayScore: $('overlayScore'),
  overlayBest: $('overlayBest'),
  overlayChallenge: $('overlayChallenge'),
  btnShare: $('btnShare'),
  toast: $('toast'),
  pause: $('pause'),
  pauseTitle: $('pauseTitle'),
  pauseNote: $('pauseNote'),
  btnResume: $('btnResume'),
  btnPause: $('btnPause'),
  signup: $('signup'),
  emailForm: $('emailForm'),
  emailInput: $('emailInput'),
  skipBtn: $('skipBtn'),
  googleBtn: $('googleBtn'),
  orDivider: $('orDivider'),
};

const params = new URLSearchParams(location.search);

const renderer = new Renderer(dom.board);
// ?html5audio 로 iOS 경로(무음 스위치에 안 막히는 <audio> 재생)를 어디서든 강제할 수 있다
const sound = new Sound({ forceHtml5: params.has('html5audio') });

// ?noads 로 광고를 끌 수 있다 (개발·자동화 테스트용)
const ads = new AdManager({
  enabled: !params.has('noads'),
  provider: createPlaceholderProvider({
    root: $('adSlot'),
    closeBtn: $('adClose'),
    config: AD_CONFIG,
  }),
});

const game = new Game({
  renderer,
  sound,
  dom,
  // 도전장 링크(?beat=N) — 친구 기록이 결승선으로 그려진다
  challengeScore: Number(params.get('beat')) || null,
  // 광고는 죽은 뒤 "다시" 전환 순간에만. 런 도중에는 절대 안 뜬다.
  onRunEnded: async (runSeconds) => {
    ads.noteRunEnded();
    await ads.maybeShow(runSeconds);
  },
});

// 첫 실행 이메일 게이트 — 가입/건너뛰기 전에는 키 입력을 게임에 흘리지 않는다
// (포인터는 게이트가 화면을 덮고 있어 자동으로 막힌다)
let gateOpen = true;
new SignupGate({
  dom,
  config: SIGNUP_CONFIG,
  onDone: () => {
    gateOpen = false;
  },
});

// ?seed=123 으로 트랙을 고정할 수 있다 (리플레이/테스트용)
if (params.has('seed')) {
  game._forcedSeed = Number(params.get('seed')) >>> 0;
  game.state = newRun(game._forcedSeed);
  renderer.reset(game.state);
}

function updateMuteIcon() {
  dom.btnMute.textContent = sound.muted ? '🔇' : '🔊';
}

// 입력 — 화면 아무 데나 누르면 잡고, 떼면 놓는다. 한 손가락이 전부다.
dom.board.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  sound.warm(); // 첫 제스처에서 오디오를 미리 깨워 런 시작 프레임이 끊기지 않게
  game.press();
});
window.addEventListener('pointerup', () => game.releasePress());
window.addEventListener('pointercancel', () => game.releasePress());
window.addEventListener('blur', () => game.releasePress());
dom.board.addEventListener('contextmenu', (e) => e.preventDefault());

// 데스크톱 테스트용: 스페이스/아무 키나 홀드
window.addEventListener('keydown', (e) => {
  if (e.repeat || gateOpen) return;
  sound.warm(); // 한 번만 실행된다 (audio.js)
  if (e.key === ' ' || e.key === 'ArrowUp') game.press();
  if (e.key === 'Escape' || e.key === 'p') game.pause();
});
window.addEventListener('keyup', (e) => {
  if (e.key === ' ' || e.key === 'ArrowUp') game.releasePress();
});

dom.btnMute.addEventListener('click', (e) => {
  e.stopPropagation();
  sound.setMuted(!sound.muted);
  updateMuteIcon();
});

new ResizeObserver(() => renderer.resize()).observe(dom.board);
window.addEventListener('resize', () => renderer.resize());

updateMuteIcon();
renderer.resize();

// 오디오 장치는 첫 터치가 아니라 첫 화면이 그려진 직후에 열어 둔다 — 열는 데 100ms 넘게
// 걸리므로, 누르는 순간에 열면 그게 곧 "홀드할 때 처음 끊김"이 된다.
// (idle 콜백은 사용자가 1초 안에 누르면 아직 안 돌아 있어서 늦다)
requestAnimationFrame(() => setTimeout(() => sound.prime(), 0));

// 물리 워밍업 — 버려지는 시뮬레이션을 미리 돌려 JIT을 데운다 (첫 런 끊김 방지)
{
  const warm = newRun(1);
  for (let i = 0; i < 900; i++) step(warm, { hold: i % 300 < 200 });
}

// 메인 루프 — 렌더는 rAF, 물리는 game.frame 안에서 고정 스텝으로 돈다
let last = performance.now();
function loop(now) {
  const dtMs = now - last;
  last = now;
  game.frame(dtMs);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ?debug — 자동화 테스트/개발용 훅
if (params.has('debug')) {
  window.__cms = {
    game,
    renderer,
    sound,
    ads,
    adsModule: { AdManager, AD_CONFIG },
    engine: { newRun, WORLD, paramsAt, aim },
    state: () => game.state,
    press: () => game.press(),
    release: () => game.releasePress(),
    kill: () => {
      game.state.dead = false;
      game.state.events.push({ type: 'death', cause: 'debug' });
      game._handleEvents();
    },
    newRun: (seed) => {
      game.state = newRun(seed >>> 0);
      game.mode = 'ready';
      renderer.reset(game.state);
      dom.overlay.classList.add('hidden');
    },
  };
}

</script>
