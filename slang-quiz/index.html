<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>요즘 영어 — 신조어·줄임말 마스터</title>
<style>
  :root {
    --bg: #fdf8ef;
    --card: #ffffff;
    --ink: #262a35;
    --muted: #7d7f8c;
    --accent: #f4506b;
    --accent-ink: #ffffff;
    --highlight: #ffd447;
    --success: #2fae82;
    --success-bg: #e3f6ee;
    --danger: #e5484d;
    --danger-bg: #fdeaea;
    --border: #262a35;
    --soft: #f4eee1;
    --shadow: #262a35;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1c26;
      --card: #252836;
      --ink: #f0efe9;
      --muted: #9698a8;
      --accent: #ff7a93;
      --accent-ink: #2a1017;
      --highlight: #e8bd2e;
      --success: #4ecCA0;
      --success-bg: #1f3a31;
      --danger: #ff6b70;
      --danger-bg: #43242a;
      --border: #0f1017;
      --soft: #20222f;
      --shadow: #0f1017;
    }
  }
  :root[data-theme="light"] {
    --bg: #fdf8ef;
    --card: #ffffff;
    --ink: #262a35;
    --muted: #7d7f8c;
    --accent: #f4506b;
    --accent-ink: #ffffff;
    --highlight: #ffd447;
    --success: #2fae82;
    --success-bg: #e3f6ee;
    --danger: #e5484d;
    --danger-bg: #fdeaea;
    --border: #262a35;
    --soft: #f4eee1;
    --shadow: #262a35;
  }
  :root[data-theme="dark"] {
    --bg: #1a1c26;
    --card: #252836;
    --ink: #f0efe9;
    --muted: #9698a8;
    --accent: #ff7a93;
    --accent-ink: #2a1017;
    --highlight: #e8bd2e;
    --success: #4ecca0;
    --success-bg: #1f3a31;
    --danger: #ff6b70;
    --danger-bg: #43242a;
    --border: #0f1017;
    --soft: #20222f;
    --shadow: #0f1017;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 14px 40px;
  }
  .app { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 16px; }
  .screen { display: none; flex-direction: column; gap: 16px; }
  .screen.active { display: flex; }

  .bubble-title {
    align-self: flex-start;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
    padding: 12px 20px;
    border: 2px solid var(--border);
    border-radius: 22px 22px 22px 4px;
    box-shadow: 4px 4px 0 var(--shadow);
  }
  .subtitle { color: var(--muted); font-size: 14px; line-height: 1.6; }
  .subtitle strong { color: var(--ink); }

  .progress-pill {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 12px 16px;
    box-shadow: 3px 3px 0 var(--shadow);
    font-size: 14px;
    font-weight: 700;
  }
  .progress-track { flex: 1; height: 10px; background: var(--soft); border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
  .progress-fill { height: 100%; background: var(--success); width: 0%; transition: width 0.4s ease; }

  .level-list { display: flex; flex-direction: column; gap: 12px; }
  .level-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    box-shadow: 4px 4px 0 var(--shadow);
    cursor: pointer;
    text-align: left;
    font: inherit;
    color: inherit;
    transition: transform 0.08s ease;
  }
  .level-card:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--shadow); }
  .level-card.locked { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
  .level-card .num {
    flex-shrink: 0;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    background: var(--highlight);
    color: #262a35;
    font-weight: 800;
    font-size: 17px;
    border: 2px solid var(--border);
    border-radius: 12px;
  }
  .level-card.cleared .num { background: var(--success); color: #fff; }
  .level-card .info { flex: 1; min-width: 0; }
  .level-card .name { font-weight: 800; font-size: 16px; }
  .level-card .words-preview { font-size: 12px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .level-card .state { font-size: 20px; flex-shrink: 0; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .back-btn {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 10px;
    box-shadow: 2px 2px 0 var(--shadow);
    font: inherit;
    font-weight: 700;
    font-size: 13px;
    color: var(--ink);
    padding: 8px 14px;
    cursor: pointer;
  }
  .level-tag { font-weight: 800; font-size: 15px; }
  .hearts { font-size: 16px; letter-spacing: 2px; }

  .flashcard {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 20px;
    box-shadow: 5px 5px 0 var(--shadow);
    padding: 30px 24px;
    min-height: 300px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 14px;
    cursor: pointer;
  }
  .flashcard .term {
    font-size: clamp(34px, 9vw, 48px);
    font-weight: 800;
    letter-spacing: -1px;
    color: var(--accent);
    text-wrap: balance;
  }
  .flashcard .tap-hint { font-size: 13px; color: var(--muted); }
  .flashcard .meaning { font-size: 20px; font-weight: 800; text-wrap: balance; }
  .flashcard .detail { font-size: 14px; color: var(--muted); line-height: 1.7; }
  .flashcard .example {
    background: var(--soft);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 14px;
    line-height: 1.6;
    width: 100%;
  }
  .flashcard .example .en { font-weight: 700; }
  .flashcard .example .ko { color: var(--muted); font-size: 13px; margin-top: 4px; }

  .card-nav { display: flex; gap: 10px; align-items: center; }
  .card-nav .count { font-weight: 800; font-size: 14px; color: var(--muted); min-width: 52px; text-align: center; }
  .btn {
    flex: 1;
    background: var(--card);
    color: var(--ink);
    border: 2px solid var(--border);
    border-radius: 14px;
    box-shadow: 3px 3px 0 var(--shadow);
    font: inherit;
    font-weight: 800;
    font-size: 15px;
    padding: 14px 0;
    cursor: pointer;
    transition: transform 0.08s ease;
  }
  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { background: none; border: none; box-shadow: none; color: var(--muted); font-weight: 600; font-size: 13px; text-decoration: underline; }
  .btn:disabled { opacity: 0.4; pointer-events: none; }

  .quiz-progress { display: flex; gap: 5px; }
  .quiz-progress span { flex: 1; height: 8px; border-radius: 4px; background: var(--soft); border: 1px solid var(--border); }
  .quiz-progress span.done { background: var(--success); }
  .quiz-progress span.miss { background: var(--danger); }
  .quiz-progress span.now { background: var(--highlight); }

  .question-card {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 20px;
    box-shadow: 5px 5px 0 var(--shadow);
    padding: 26px 22px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .question-card .ask { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.05em; }
  .question-card .prompt { font-size: clamp(24px, 7vw, 34px); font-weight: 800; letter-spacing: -0.5px; text-wrap: balance; }
  .question-card .prompt.small { font-size: 20px; letter-spacing: 0; line-height: 1.5; }
  .question-card .prompt em { font-style: normal; color: var(--accent); }

  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 14px;
    box-shadow: 3px 3px 0 var(--shadow);
    font: inherit;
    font-weight: 700;
    font-size: 15px;
    color: var(--ink);
    padding: 14px 16px;
    text-align: left;
    cursor: pointer;
    transition: transform 0.08s ease;
  }
  .choice:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow); }
  .choice.correct { background: var(--success-bg); border-color: var(--success); box-shadow: 3px 3px 0 var(--success); }
  .choice.wrong { background: var(--danger-bg); border-color: var(--danger); box-shadow: 3px 3px 0 var(--danger); }
  .choice:disabled { cursor: default; }

  .feedback {
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
    box-shadow: 3px 3px 0 var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 14px;
    line-height: 1.6;
  }
  .feedback.good { background: var(--success-bg); }
  .feedback.bad { background: var(--danger-bg); }
  .feedback .verdict { font-weight: 800; font-size: 15px; }
  .feedback .word-line { font-weight: 800; }
  .feedback .word-line em { font-style: normal; color: var(--accent); }
  .feedback .ex { color: var(--muted); font-size: 13px; }
  .hidden { display: none !important; }

  .result-card {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 20px;
    box-shadow: 5px 5px 0 var(--shadow);
    padding: 32px 24px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .result-card .emoji { font-size: 52px; }
  .result-card h2 { font-size: 24px; font-weight: 800; }
  .result-card p { font-size: 14px; color: var(--muted); line-height: 1.7; }
  .missed-box { text-align: left; display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
  .missed-box .label { font-size: 13px; font-weight: 800; color: var(--danger); }
  .missed-item {
    background: var(--soft);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    line-height: 1.5;
  }
  .missed-item strong { color: var(--accent); }

  button:focus-visible { outline: 3px solid var(--highlight); outline-offset: 2px; }
  footer { margin-top: 20px; font-size: 12px; color: var(--muted); text-align: center; }
  footer button { background: none; border: none; color: var(--muted); font-size: 12px; text-decoration: underline; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- 홈 -->
  <section class="screen active" id="homeScreen">
    <div class="bubble-title">요즘 영어 💬</div>
    <p class="subtitle">신조어, 슬랭, 줄임말 몰라서 대화에서 겉돌았다면 여기서 끝내요.<br>
    레벨마다 <strong>카드로 배우고 → 퀴즈로 클리어</strong>. 뒤로 갈수록 최신 유행어가 나옵니다.</p>
    <div class="progress-pill">
      <span id="homeProgressText"></span>
      <div class="progress-track"><div class="progress-fill" id="homeProgressFill"></div></div>
    </div>
    <div class="level-list" id="levelList"></div>
    <footer><button id="resetBtn">진행도 초기화</button></footer>
  </section>

  <!-- 학습 (플래시카드) -->
  <section class="screen" id="learnScreen">
    <div class="topbar">
      <button class="back-btn" id="learnBackBtn">← 홈</button>
      <span class="level-tag" id="learnLevelTag"></span>
      <span style="width:60px"></span>
    </div>
    <div class="flashcard" id="flashcard"></div>
    <div class="card-nav">
      <button class="btn" id="prevCardBtn">← 이전</button>
      <span class="count" id="cardCount"></span>
      <button class="btn" id="nextCardBtn">다음 →</button>
    </div>
    <button class="btn primary" id="startQuizBtn">📝 퀴즈 시작 (8문제)</button>
  </section>

  <!-- 퀴즈 -->
  <section class="screen" id="quizScreen">
    <div class="topbar">
      <button class="back-btn" id="quizBackBtn">← 그만두기</button>
      <span class="level-tag" id="quizLevelTag"></span>
      <span class="hearts" id="quizHearts"></span>
    </div>
    <div class="quiz-progress" id="quizProgress"></div>
    <div class="question-card">
      <div class="ask" id="questionAsk"></div>
      <div class="prompt" id="questionPrompt"></div>
    </div>
    <div class="choices" id="choices"></div>
    <div class="feedback hidden" id="feedback"></div>
    <button class="btn primary hidden" id="nextQuestionBtn">다음 문제 →</button>
  </section>

  <!-- 결과 -->
  <section class="screen" id="resultScreen">
    <div class="result-card">
      <div class="emoji" id="resultEmoji"></div>
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
      <div class="missed-box hidden" id="missedBox"></div>
    </div>
    <button class="btn primary" id="resultMainBtn"></button>
    <button class="btn" id="resultHomeBtn">홈으로</button>
  </section>

</div>

<script>
(() => {
  'use strict';

  // ---------- 단어 데이터 ----------
  // t: 표현, m: 짧은 뜻(퀴즈 보기), d: 설명, ex/exKo: 예문, grp: 유의어 그룹(보기 충돌 방지)
  const LEVELS = [
    { name: '기본 줄임말 Ⅰ', desc: '채팅의 기초 체력', words: [
      { t: 'LOL', m: '크게 웃김 (ㅋㅋㅋ)', d: "'laughing out loud'의 줄임말. 한국어의 ㅋㅋㅋ에 해당하는 가장 기본 표현.", ex: 'That video was hilarious, LOL.', exKo: '그 영상 완전 웃겼어 ㅋㅋㅋ', grp: 'laugh' },
      { t: 'OMG', m: '헐, 세상에', d: "'oh my god'의 줄임말. 놀랐을 때 반사적으로 쓰는 감탄사.", ex: 'OMG, did you see that?', exKo: '헐, 너 그거 봤어?' },
      { t: 'BTW', m: '그건 그렇고, 참고로', d: "'by the way'의 줄임말. 화제를 바꾸거나 곁다리 정보를 붙일 때.", ex: 'BTW, are you free this weekend?', exKo: '그건 그렇고, 이번 주말에 시간 돼?' },
      { t: 'FYI', m: '참고하라고 알려주는 정보', d: "'for your information'의 줄임말. 회사 메일에서도 아주 많이 쓰임.", ex: 'FYI, the meeting moved to 3pm.', exKo: '참고로, 회의가 3시로 옮겨졌어요.' },
      { t: 'ASAP', m: '최대한 빨리', d: "'as soon as possible'의 줄임말. 급한 일을 부탁할 때.", ex: 'Can you send it ASAP?', exKo: '최대한 빨리 보내줄 수 있어?' },
      { t: 'IDK', m: '잘 모르겠어', d: "'I don't know'의 줄임말. 채팅에서 세 글자로 끝내는 '몰라'.", ex: 'IDK what to eat for dinner.', exKo: '저녁 뭐 먹을지 모르겠네.' },
      { t: 'TMI', m: '굳이 몰라도 될 과한 정보', d: "'too much information'의 줄임말. 원래는 '그런 것까진 말 안 해도 돼'라는 뉘앙스.", ex: "Dude, that's TMI. I didn't need to know that.", exKo: '야 그건 TMI야, 몰라도 됐어.' },
      { t: 'BRB', m: '금방 돌아올게', d: "'be right back'의 줄임말. 잠깐 자리 비울 때.", ex: 'BRB, someone is at the door.', exKo: '금방 올게, 누가 문 앞에 왔어.' },
    ]},
    { name: '기본 줄임말 Ⅱ', desc: '아직 기초, 하지만 필수', words: [
      { t: 'TBH', m: '솔직히 말하면', d: "'to be honest'의 줄임말. 솔직한 의견을 말하기 전에 붙임.", ex: "TBH, I didn't like the movie.", exKo: '솔직히 그 영화 별로였어.', grp: 'honest' },
      { t: 'IMO', m: '내 생각에는', d: "'in my opinion'의 줄임말. 겸손하게 의견 낼 때. IMHO(humble 추가)도 같은 뜻.", ex: 'IMO, the first season was better.', exKo: '내 생각엔 시즌 1이 더 나았어.' },
      { t: 'NGL', m: '거짓말 안 보태고', d: "'not gonna lie'의 줄임말. 솔직한 감상 앞에 붙이는 요즘 애용 표현.", ex: 'NGL, that outfit is fire.', exKo: '거짓말 안 하고 그 옷 진짜 멋지다.', grp: 'honest' },
      { t: 'IDC', m: '상관 없어, 신경 안 써', d: "'I don't care'의 줄임말. 시크하게 무관심을 표현.", ex: 'IDC what they think about me.', exKo: '걔네가 날 어떻게 생각하든 상관 없어.' },
      { t: 'SMH', m: '어이없어서 고개 절레절레', d: "'shaking my head'의 줄임말. 한심하거나 어이없을 때.", ex: 'He was late again, SMH.', exKo: '걔 또 지각했어, 어휴 진짜.' },
      { t: 'IRL', m: '현실에서, 실제로', d: "'in real life'의 줄임말. 온라인이 아닌 실제 세계를 가리킴.", ex: 'We finally met IRL after two years.', exKo: '2년 만에 드디어 실제로 만났어.' },
      { t: 'DM', m: '개인 메시지 (쪽지)', d: "'direct message'의 줄임말. 'DM 보내' = 개인 메시지로 연락해.", ex: 'Just DM me the details.', exKo: '자세한 건 DM으로 보내줘.' },
      { t: 'AKA', m: '~라고도 불리는, 일명', d: "'also known as'의 줄임말. 별명이나 다른 이름을 소개할 때.", ex: 'My brother, AKA the pizza monster, ate it all.', exKo: '일명 피자 괴물인 우리 형이 다 먹어버렸어.' },
    ]},
    { name: '일상 채팅 표현', desc: '친구랑 문자할 때 그대로', words: [
      { t: 'RN', m: '지금 당장, 이 순간', d: "'right now'의 줄임말. 'I'm so tired rn' 처럼 문장 끝에 자주 붙음.", ex: "I'm so hungry RN.", exKo: '나 지금 너무 배고파.' },
      { t: 'OFC', m: '당연하지', d: "'of course'의 줄임말. 흔쾌히 수락할 때.", ex: 'OFC you can come with us!', exKo: '당연히 너도 같이 가도 되지!' },
      { t: 'NVM', m: '아니다, 신경 쓰지 마', d: "'never mind'의 줄임말. 방금 한 말을 취소하거나 됐다고 할 때.", ex: 'NVM, I found my keys.', exKo: '아니다 됐어, 열쇠 찾았어.' },
      { t: 'LMK', m: '알게 되면 알려줘', d: "'let me know'의 줄임말. 답을 기다린다는 뉘앙스.", ex: 'LMK when you arrive.', exKo: '도착하면 알려줘.' },

      { t: 'mewing', m: '턱선 만들기 (혀 운동) 밈', d: '혀를 입천장에 붙여 턱선을 살린다는 운동. 말 걸면 입 다물고 턱선 만드는 중이라는 제스처 밈으로 유행.', ex: 'He pointed at his jaw — "Can\'t talk, mewing."', exKo: '턱을 가리키며 "말 못 해, 지금 턱선 만드는 중."' },
    ]},
    { name: '최신 유행어 Ⅱ', desc: '이걸 알면 통역 가능', words: [
      { t: 'cooked', m: '망했다, 끝장났다', d: "'We're cooked' = 우리 망했다. 반대로 'he cooked'는 '잘 해냈다'라 문맥 주의.", ex: "The exam starts in 5 minutes and I studied nothing. I'm cooked.", exKo: '시험 5분 전인데 공부 하나도 안 함. 나 망했어.', grp: 'fail' },
      { t: 'let him cook', m: '냅둬 봐, 뭔가 하고 있어', d: '이상해 보여도 일단 지켜보자, 잘하고 있으니 방해하지 말자는 뜻.', ex: 'His idea sounds crazy but let him cook.', exKo: '말도 안 되는 아이디어 같지만 일단 지켜보자.' },
      { t: 'lock in', m: '초집중 모드에 들어가다', d: '딴짓 다 끊고 목표에만 몰입하는 것. 시험 기간 단골 표현.', ex: 'Finals are next week. Time to lock in.', exKo: '다음 주가 기말이야. 이제 초집중 모드다.' },
      { t: 'crash out', m: '이성을 잃고 폭발하다', d: '참다 참다 뚜껑이 열려서 막 나가는 상태.', ex: 'One more bug in my code and I might crash out.', exKo: '버그 하나만 더 나오면 나 진짜 폭발할지도.' },
      { t: 'opp', m: '적, 나를 노리는 상대', d: "'opposition/opponent'에서 온 말. 원래 힙합 슬랭, 지금은 가볍게 '견제 대상'에도 씀.", ex: "Don't share your plans with your opps.", exKo: '네 계획을 견제 세력한테 흘리지 마.' },
      { t: 'yap', m: '쓸데없이 말을 쏟아내다', d: "말이 너무 많은 것. 'yapper' = 수다쟁이, 'yapping session' = 수다 타임.", ex: 'He yapped for 20 minutes about his keyboard.', exKo: '걔 키보드 얘기로 20분을 떠들었어.' },
      { t: 'glaze', m: '과하게 빨아주다, 무조건 찬양하다', d: '누군가를 지나치게 추켜세우고 감싸는 것. 도가 지나친 팬심을 비꼴 때.', ex: 'Stop glazing him, he just did his job.', exKo: '그만 좀 빨아줘, 걔는 그냥 할 일 한 거야.' },
      { t: 'tuff', m: '간지 나는, 멋진', d: "'tough'의 변형 표기. 외모·사진·아이템이 멋질 때. 반어적으로도 씀.", ex: 'That new profile pic is tuff.', exKo: '새 프사 완전 간지 난다.', grp: 'cool' },
    ]},
    { name: '초고난도 최신 밈', desc: '여기까지 알면 원어민 10대급', words: [
      { t: '6 7', m: '뜻 없이 외치는 유행 밈 (six-seven)', d: '노래 가사에서 퍼진, 사실상 의미 없는 밈. 숫자 6·7만 나오면 외치는 게 포인트. 2025년 최고 유행어.', ex: 'The teacher said "page 67" and the class yelled "6 7!"', exKo: '선생님이 "67쪽"이라 하자 반 전체가 "6 7!"을 외쳤다.' },
      { t: 'huzz', m: '여자들 (장난스러운 표현)', d: "여성들을 가리키는 장난 섞인 스트리머 슬랭. 'bruzz'는 남자들. 다소 짓궂은 뉘앙스라 조심.", ex: 'He said he\'s going to the gym to impress the huzz.', exKo: '걔 여자들한테 잘 보이려고 헬스장 간대.' },
      { t: 'chopped', m: '못생긴, 후줄근한', d: '외모나 상태가 형편없다는 뜻의 최신 슬랭.', ex: 'I woke up looking chopped today.', exKo: '오늘 일어났는데 몰골이 말이 아니야.', grp: 'fail' },
      { t: 'PMO', m: '짜증 나게 하다 (piss me off)', d: "'(you) piss me off'의 줄임말. 'pmo'라고 소문자로 툭 던짐. 문맥 따라 'put me on(추천해줘)'일 때도 있음.", ex: 'People who chew loudly PMO.', exKo: '쩝쩝대는 사람들 진짜 짜증 나.' },
      { t: 'ts', m: '이거, 이것 (this + 비속어)', d: "'this stuff'의 거친 버전 줄임말. 'ts pmo' = '이거 진짜 짜증 나'. 소문자로 씀.", ex: 'ts pmo so much, bro.', exKo: '이거 진짜 너무 짜증 나.' },
      { t: 'ICL', m: '솔직히 말해서 (I can\'t lie)', d: "'I can't lie'의 줄임말. NGL과 비슷하지만 더 최신 느낌.", ex: 'ICL, that album surprised me.', exKo: '솔직히 그 앨범 좀 놀랐어.', grp: 'honest' },
      { t: 'aura farming', m: '멋있어 보이려고 포인트 쌓기', d: "일부러 시크하고 멋있는 행동을 해서 '아우라 점수'를 모으는 것. 대개 비꼬는 뉘앙스.", ex: 'He stared out the bus window in the rain. Aura farming.', exKo: '비 오는 날 버스 창밖만 바라보더라. 아우라 적립 중.' },
      { t: 'looksmaxxing', m: '외모를 최대치로 끌어올리기', d: '피부·헤어·운동 등으로 외모를 극한까지 개선하려는 트렌드. maxxing은 "~을 극대화"라는 접미어로도 유행.', ex: 'He started skincare and gym — full looksmaxxing mode.', exKo: '걔 피부 관리에 헬스까지, 완전 외모 끌올 모드야.' },
    ]},
  ];

  const QUIZ_SIZE = 8;
  const MAX_HEARTS = 3;

  // ---------- 진행도 ----------
  const STORAGE_KEY = 'slang-quiz-progress';
  let clearedCount = 0;
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (saved.cleared >= 0) clearedCount = Math.min(saved.cleared, LEVELS.length);
  } catch (e) { /* 손상된 저장값은 무시 */ }
  function saveProgress() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ cleared: clearedCount })); } catch (e) { /* 저장 불가 환경 */ }
  }

  // ---------- 상태 ----------
  let currentLevel = 0;
  let cardIndex = 0;
  let cardFlipped = false;
  let questions = [];
  let qIndex = 0;
  let hearts = MAX_HEARTS;
  let missed = [];
  let answered = false;
  let results = []; // 'done' | 'miss'

  const $ = (id) => document.getElementById(id);
  const screens = { home: $('homeScreen'), learn: $('learnScreen'), quiz: $('quizScreen'), result: $('resultScreen') };
  function show(name) {
    Object.values(screens).forEach((s) => s.classList.remove('active'));
    screens[name].classList.add('active');
    window.scrollTo(0, 0);
  }

  const shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  // ---------- 홈 ----------
  function renderHome() {
    $('homeProgressText').textContent = clearedCount + '/' + LEVELS.length + ' 클리어';
    $('homeProgressFill').style.width = (clearedCount / LEVELS.length * 100) + '%';
    const list = $('levelList');
    list.innerHTML = '';
    LEVELS.forEach((lv, i) => {
      const btn = document.createElement('button');
      btn.className = 'level-card';
      const cleared = i < clearedCount;
      const unlocked = i <= clearedCount;
      if (cleared) btn.classList.add('cleared');
      if (!unlocked) { btn.classList.add('locked'); btn.disabled = true; }
      const preview = lv.words.slice(0, 4).map((w) => w.t).join(' · ');
      btn.innerHTML =
        '<span class="num">' + (i + 1) + '</span>' +
        '<span class="info"><span class="name">' + lv.name + '</span>' +
        '<span class="words-preview">' + (unlocked ? preview + ' …' : lv.desc) + '</span></span>' +
        '<span class="state">' + (cleared ? '✅' : unlocked ? '▶️' : '🔒') + '</span>';
      btn.addEventListener('click', () => { if (unlocked) openLearn(i); });
      list.appendChild(btn);
    });
  }

  // ---------- 학습 ----------
  function openLearn(levelIdx) {
    currentLevel = levelIdx;
    cardIndex = 0;
    cardFlipped = false;
    $('learnLevelTag').textContent = 'Lv.' + (levelIdx + 1) + ' ' + LEVELS[levelIdx].name;
    renderCard();
    show('learn');
  }

  function renderCard() {
    const words = LEVELS[currentLevel].words;
    const w = words[cardIndex];
    const fc = $('flashcard');
    if (!cardFlipped) {
      fc.innerHTML = '<div class="term">' + w.t + '</div><div class="tap-hint">카드를 눌러 뜻 확인 👆</div>';
    } else {
      fc.innerHTML =
        '<div class="term" style="font-size:26px">' + w.t + '</div>' +
        '<div class="meaning">' + w.m + '</div>' +
        '<div class="detail">' + w.d + '</div>' +
        '<div class="example"><div class="en">💬 ' + w.ex + '</div><div class="ko">' + w.exKo + '</div></div>';
    }
    $('cardCount').textContent = (cardIndex + 1) + ' / ' + words.length;
    $('prevCardBtn').disabled = cardIndex === 0;
    $('nextCardBtn').disabled = cardIndex === words.length - 1;
  }

  $('flashcard').addEventListener('click', () => { cardFlipped = !cardFlipped; renderCard(); });
  $('prevCardBtn').addEventListener('click', () => { if (cardIndex > 0) { cardIndex--; cardFlipped = false; renderCard(); } });
  $('nextCardBtn').addEventListener('click', () => {
    if (cardIndex < LEVELS[currentLevel].words.length - 1) { cardIndex++; cardFlipped = false; renderCard(); }
  });
  $('learnBackBtn').addEventListener('click', () => { renderHome(); show('home'); });

  // ---------- 퀴즈 생성 ----------
  const groupOf = (w) => w.grp || w.t;

  function buildQuestions(levelIdx) {
    const words = LEVELS[levelIdx].words;
    const allWords = LEVELS.flatMap((lv) => lv.words);
    return shuffle(words).slice(0, QUIZ_SIZE).map((w) => {
      const type = Math.random() < 0.5 ? 'meaning' : 'term'; // meaning: 표현→뜻, term: 뜻→표현
      const pool = shuffle(allWords.filter((o) => o.t !== w.t && groupOf(o) !== groupOf(w)));
      const distractors = pool.slice(0, 3);
      const choices = shuffle([w, ...distractors]);
      return { w, type, choices };
    });
  }

  function openQuiz() {
    questions = buildQuestions(currentLevel);
    qIndex = 0;
    hearts = MAX_HEARTS;
    missed = [];
    results = [];
    $('quizLevelTag').textContent = 'Lv.' + (currentLevel + 1) + ' 퀴즈';
    renderQuestion();
    show('quiz');
  }

  $('startQuizBtn').addEventListener('click', openQuiz);
  $('quizBackBtn').addEventListener('click', () => { renderHome(); show('home'); });

  function renderQuizHeader() {
    $('quizHearts').textContent = '❤️'.repeat(hearts) + '🖤'.repeat(MAX_HEARTS - hearts);
    const bar = $('quizProgress');
    bar.innerHTML = '';
    for (let i = 0; i < questions.length; i++) {
      const seg = document.createElement('span');
      if (i < results.length) seg.classList.add(results[i]);
      else if (i === qIndex) seg.classList.add('now');
      bar.appendChild(seg);
    }
  }

  function renderQuestion() {
    answered = false;
    const q = questions[qIndex];
    renderQuizHeader();
    $('feedback').classList.add('hidden');
    $('nextQuestionBtn').classList.add('hidden');

    if (q.type === 'meaning') {
      $('questionAsk').textContent = 'Q' + (qIndex + 1) + '. 이 표현의 뜻은?';
      $('questionPrompt').className = 'prompt';
      $('questionPrompt').innerHTML = '<em>' + q.w.t + '</em>';
    } else {
      $('questionAsk').textContent = 'Q' + (qIndex + 1) + '. 이 뜻에 맞는 표현은?';
      $('questionPrompt').className = 'prompt small';
      $('questionPrompt').textContent = '“' + q.w.m + '”';
    }

    const box = $('choices');
    box.innerHTML = '';
    q.choices.forEach((cw) => {
      const btn = document.createElement('button');
      btn.className = 'choice';
      btn.textContent = q.type === 'meaning' ? cw.m : cw.t;
      btn.addEventListener('click', () => answer(cw, btn));
      box.appendChild(btn);
    });
  }

  function answer(chosen, btn) {
    if (answered) return;
    answered = true;
    const q = questions[qIndex];
    const correct = chosen.t === q.w.t;
    document.querySelectorAll('.choice').forEach((b) => {
      b.disabled = true;
      const label = q.type === 'meaning' ? q.w.m : q.w.t;
      if (b.textContent === label) b.classList.add('correct');
    });
    if (!correct) {
      btn.classList.add('wrong');
      hearts--;
      missed.push(q.w);
      results.push('miss');
    } else {
      results.push('done');
    }
    renderQuizHeader();

    const fb = $('feedback');
    fb.className = 'feedback ' + (correct ? 'good' : 'bad');
    fb.innerHTML =
      '<span class="verdict">' + (correct ? '⭕ 정답!' : '❌ 오답! 하트 -1') + '</span>' +
      '<span class="word-line"><em>' + q.w.t + '</em> = ' + q.w.m + '</span>' +
      '<span>' + q.w.d + '</span>' +
      '<span class="ex">💬 ' + q.w.ex + ' — ' + q.w.exKo + '</span>';
    fb.classList.remove('hidden');

    if (!correct && hearts <= 0) {
      $('nextQuestionBtn').textContent = '결과 보기';
    } else {
      $('nextQuestionBtn').textContent = qIndex === questions.length - 1 ? '결과 보기' : '다음 문제 →';
    }
    $('nextQuestionBtn').classList.remove('hidden');
  }

  $('nextQuestionBtn').addEventListener('click', () => {
    if (hearts <= 0 || qIndex === questions.length - 1) { finishQuiz(); return; }
    qIndex++;
    renderQuestion();
  });

  // ---------- 결과 ----------
  function finishQuiz() {
    const passed = hearts > 0;
    const correctCount = results.filter((r) => r === 'done').length;
    if (passed && currentLevel === clearedCount) {
      clearedCount++;
      saveProgress();
    }
    $('resultEmoji').textContent = passed ? '🎉' : '💔';
    $('resultTitle').textContent = passed ? '레벨 클리어!' : '아쉽다!';
    $('resultText').innerHTML = passed
      ? questions.length + '문제 중 <strong>' + correctCount + '문제</strong> 정답! ' +
        (clearedCount >= LEVELS.length ? '모든 레벨을 정복했어요. 이제 어떤 채팅도 무섭지 않다! 🏆' : '다음 레벨이 열렸어요.')
      : '하트를 다 썼어요. 틀린 단어를 복습하고 다시 도전해요!';

    const mb = $('missedBox');
    if (missed.length > 0) {
      mb.classList.remove('hidden');
      mb.innerHTML = '<span class="label">📌 틀린 단어 복습</span>' +
        missed.map((w) => '<div class="missed-item"><strong>' + w.t + '</strong> = ' + w.m + '<br>' + w.d + '</div>').join('');
    } else {
      mb.classList.add('hidden');
    }

    const mainBtn = $('resultMainBtn');
    if (passed && clearedCount < LEVELS.length && currentLevel === clearedCount - 1) {
      mainBtn.textContent = '다음 레벨 배우러 가기 →';
      mainBtn.onclick = () => openLearn(clearedCount);
    } else if (passed) {
      mainBtn.textContent = '홈으로';
      mainBtn.onclick = () => { renderHome(); show('home'); };
    } else {
      mainBtn.textContent = '카드 다시 보고 재도전';
      mainBtn.onclick = () => openLearn(currentLevel);
    }
    show('result');
  }

  $('resultHomeBtn').addEventListener('click', () => { renderHome(); show('home'); });

  $('resetBtn').addEventListener('click', () => {
    if (confirm('진행도를 초기화하고 레벨 1부터 다시 시작할까요?')) {
      clearedCount = 0;
      saveProgress();
      renderHome();
    }
  });

  renderHome();
})();
</script>
</body>
</html>
