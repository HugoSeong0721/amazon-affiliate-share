<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slang Master — Learn Modern English</title>
<style>
  :root {
    --bg: #fdf8ef;
    --card: #ffffff;
    --ink: #262a35;
    --muted: #7d7f8c;
    --accent: #f4506b;
    --accent-ink: #ffffff;
    --highlight: #ffd447;
    --success: #2fae82;
    --success-bg: #e3f6ee;
    --danger: #e5484d;
    --danger-bg: #fdeaea;
    --border: #262a35;
    --soft: #f4eee1;
    --shadow: #262a35;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1c26;
      --card: #252836;
      --ink: #f0efe9;
      --muted: #9698a8;
      --accent: #ff7a93;
      --accent-ink: #2a1017;
      --highlight: #e8bd2e;
      --success: #4ecca0;
      --success-bg: #1f3a31;
      --danger: #ff6b70;
      --danger-bg: #43242a;
      --border: #0f1017;
      --soft: #20222f;
      --shadow: #0f1017;
    }
  }
  :root[data-theme="light"] {
    --bg: #fdf8ef;
    --card: #ffffff;
    --ink: #262a35;
    --muted: #7d7f8c;
    --accent: #f4506b;
    --accent-ink: #ffffff;
    --highlight: #ffd447;
    --success: #2fae82;
    --success-bg: #e3f6ee;
    --danger: #e5484d;
    --danger-bg: #fdeaea;
    --border: #262a35;
    --soft: #f4eee1;
    --shadow: #262a35;
  }
  :root[data-theme="dark"] {
    --bg: #1a1c26;
    --card: #252836;
    --ink: #f0efe9;
    --muted: #9698a8;
    --accent: #ff7a93;
    --accent-ink: #2a1017;
    --highlight: #e8bd2e;
    --success: #4ecca0;
    --success-bg: #1f3a31;
    --danger: #ff6b70;
    --danger-bg: #43242a;
    --border: #0f1017;
    --soft: #20222f;
    --shadow: #0f1017;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 14px 40px;
  }
  .app { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 16px; }
  .screen { display: none; flex-direction: column; gap: 16px; }
  .screen.active { display: flex; }

  .home-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .bubble-title {
    align-self: flex-start;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
    padding: 12px 20px;
    border: 2px solid var(--border);
    border-radius: 22px 22px 22px 4px;
    box-shadow: 4px 4px 0 var(--shadow);
  }
  .lang-btn {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 10px;
    box-shadow: 2px 2px 0 var(--shadow);
    font: inherit;
    font-weight: 700;
    font-size: 13px;
    color: var(--ink);
    padding: 8px 12px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .subtitle { color: var(--muted); font-size: 14px; line-height: 1.6; }
  .subtitle strong { color: var(--ink); }

  .progress-pill {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 12px 16px;
    box-shadow: 3px 3px 0 var(--shadow);
    font-size: 14px;
    font-weight: 700;
  }
  .progress-track { flex: 1; height: 10px; background: var(--soft); border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
  .progress-fill { height: 100%; background: var(--success); width: 0%; transition: width 0.4s ease; }

  .level-list { display: flex; flex-direction: column; gap: 12px; }
  .level-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    box-shadow: 4px 4px 0 var(--shadow);
    cursor: pointer;
    text-align: left;
    font: inherit;
    color: inherit;
    transition: transform 0.08s ease;
  }
  .level-card:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--shadow); }
  .level-card.locked { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
  .level-card .num {
    flex-shrink: 0;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    background: var(--highlight);
    color: #262a35;
    font-weight: 800;
    font-size: 17px;
    border: 2px solid var(--border);
    border-radius: 12px;
  }
  .level-card.cleared .num { background: var(--success); color: #fff; }
  .level-card .info { flex: 1; min-width: 0; }
  .level-card .name { display: block; font-weight: 800; font-size: 16px; }
  .level-card .words-preview { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .level-card .state { font-size: 20px; flex-shrink: 0; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .back-btn {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 10px;
    box-shadow: 2px 2px 0 var(--shadow);
    font: inherit;
    font-weight: 700;
    font-size: 13px;
    color: var(--ink);
    padding: 8px 14px;
    cursor: pointer;
  }
  .level-tag { font-weight: 800; font-size: 15px; }
  .hearts { font-size: 16px; letter-spacing: 2px; }

  .flashcard {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 20px;
    box-shadow: 5px 5px 0 var(--shadow);
    padding: 30px 24px;
    min-height: 300px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 14px;
    cursor: pointer;
  }
  .flashcard .term {
    font-size: clamp(34px, 9vw, 48px);
    font-weight: 800;
    letter-spacing: -1px;
    color: var(--accent);
    text-wrap: balance;
  }
  .flashcard .tap-hint { font-size: 13px; color: var(--muted); }
  .flashcard .meaning { font-size: 20px; font-weight: 800; text-wrap: balance; }
  .flashcard .detail { font-size: 14px; color: var(--muted); line-height: 1.7; }
  .flashcard .example {
    background: var(--soft);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 14px;
    line-height: 1.6;
    width: 100%;
  }
  .flashcard .example .en { font-weight: 700; }
  .flashcard .example .ko { color: var(--muted); font-size: 13px; margin-top: 4px; }

  .card-nav { display: flex; gap: 10px; align-items: center; }
  .card-nav .count { font-weight: 800; font-size: 14px; color: var(--muted); min-width: 52px; text-align: center; }
  .btn {
    flex: 1;
    background: var(--card);
    color: var(--ink);
    border: 2px solid var(--border);
    border-radius: 14px;
    box-shadow: 3px 3px 0 var(--shadow);
    font: inherit;
    font-weight: 800;
    font-size: 15px;
    padding: 14px 0;
    cursor: pointer;
    transition: transform 0.08s ease;
  }
  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn:disabled { opacity: 0.4; pointer-events: none; }

  .quiz-progress { display: flex; gap: 5px; }
  .quiz-progress span { flex: 1; height: 8px; border-radius: 4px; background: var(--soft); border: 1px solid var(--border); }
  .quiz-progress span.done { background: var(--success); }
  .quiz-progress span.miss { background: var(--danger); }
  .quiz-progress span.now { background: var(--highlight); }

  .question-card {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 20px;
    box-shadow: 5px 5px 0 var(--shadow);
    padding: 26px 22px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .question-card .ask { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.05em; }
  .question-card .prompt { font-size: clamp(24px, 7vw, 34px); font-weight: 800; letter-spacing: -0.5px; text-wrap: balance; }
  .question-card .prompt.small { font-size: 20px; letter-spacing: 0; line-height: 1.5; }
  .question-card .prompt em { font-style: normal; color: var(--accent); }

  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 14px;
    box-shadow: 3px 3px 0 var(--shadow);
    font: inherit;
    font-weight: 700;
    font-size: 15px;
    color: var(--ink);
    padding: 14px 16px;
    text-align: left;
    cursor: pointer;
    transition: transform 0.08s ease;
  }
  .choice:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow); }
  .choice.correct { background: var(--success-bg); border-color: var(--success); box-shadow: 3px 3px 0 var(--success); }
  .choice.wrong { background: var(--danger-bg); border-color: var(--danger); box-shadow: 3px 3px 0 var(--danger); }
  .choice:disabled { cursor: default; }

  .feedback {
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
    box-shadow: 3px 3px 0 var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 14px;
    line-height: 1.6;
  }
  .feedback.good { background: var(--success-bg); }
  .feedback.bad { background: var(--danger-bg); }
  .feedback .verdict { font-weight: 800; font-size: 15px; }
  .feedback .word-line { font-weight: 800; }
  .feedback .word-line em { font-style: normal; color: var(--accent); }
  .feedback .ex { color: var(--muted); font-size: 13px; }
  .hidden { display: none !important; }

  .result-card {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 20px;
    box-shadow: 5px 5px 0 var(--shadow);
    padding: 32px 24px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .result-card .emoji { font-size: 52px; }
  .result-card h2 { font-size: 24px; font-weight: 800; }
  .result-card p { font-size: 14px; color: var(--muted); line-height: 1.7; }
  .missed-box { text-align: left; display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
  .missed-box .label { font-size: 13px; font-weight: 800; color: var(--danger); }
  .missed-item {
    background: var(--soft);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    line-height: 1.5;
  }
  .missed-item strong { color: var(--accent); }

  button:focus-visible { outline: 3px solid var(--highlight); outline-offset: 2px; }
  footer { margin-top: 20px; font-size: 12px; color: var(--muted); text-align: center; }
  footer button { background: none; border: none; color: var(--muted); font-size: 12px; text-decoration: underline; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Home -->
  <section class="screen active" id="homeScreen">
    <div class="home-top">
      <div class="bubble-title" id="appTitle">Slang Master 💬</div>
      <button class="lang-btn" id="langBtn">🌐 한국어</button>
    </div>
    <p class="subtitle" id="appSubtitle"></p>
    <div class="progress-pill">
      <span id="homeProgressText"></span>
      <div class="progress-track"><div class="progress-fill" id="homeProgressFill"></div></div>
    </div>
    <div class="level-list" id="levelList"></div>
    <footer><button id="resetBtn"></button></footer>
  </section>

  <!-- Learn (flashcards) -->
  <section class="screen" id="learnScreen">
    <div class="topbar">
      <button class="back-btn" id="learnBackBtn"></button>
      <span class="level-tag" id="learnLevelTag"></span>
      <span style="width:60px"></span>
    </div>
    <div class="flashcard" id="flashcard"></div>
    <div class="card-nav">
      <button class="btn" id="prevCardBtn"></button>
      <span class="count" id="cardCount"></span>
      <button class="btn" id="nextCardBtn"></button>
    </div>
    <button class="btn primary" id="startQuizBtn"></button>
  </section>

  <!-- Quiz -->
  <section class="screen" id="quizScreen">
    <div class="topbar">
      <button class="back-btn" id="quizBackBtn"></button>
      <span class="level-tag" id="quizLevelTag"></span>
      <span class="hearts" id="quizHearts"></span>
    </div>
    <div class="quiz-progress" id="quizProgress"></div>
    <div class="question-card">
      <div class="ask" id="questionAsk"></div>
      <div class="prompt" id="questionPrompt"></div>
    </div>
    <div class="choices" id="choices"></div>
    <div class="feedback hidden" id="feedback"></div>
    <button class="btn primary hidden" id="nextQuestionBtn"></button>
  </section>

  <!-- Result -->
  <section class="screen" id="resultScreen">
    <div class="result-card">
      <div class="emoji" id="resultEmoji"></div>
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
      <div class="missed-box hidden" id="missedBox"></div>
    </div>
    <button class="btn primary" id="resultMainBtn"></button>
    <button class="btn" id="resultHomeBtn"></button>
  </section>

</div>

<script>
(() => {
  'use strict';

  // ---------- UI strings ----------
  const STR = {
    en: {
      title: 'Slang Master 💬',
      subtitle: 'Tired of not getting the slang, memes, and acronyms everyone uses?<br><strong>Learn with cards → clear the quiz</strong>, level by level. Later levels bring the freshest slang.',
      cleared: 'cleared',
      reset: 'Reset progress',
      resetConfirm: 'Reset your progress and start over from level 1?',
      home: '← Home',
      quit: '← Quit',
      tapHint: 'Tap the card to see the meaning 👆',
      prev: '← Prev',
      next: 'Next →',
      startQuiz: '📝 Start quiz (8 questions)',
      quiz: 'quiz',
      askMeaning: (n) => 'Q' + n + '. What does this mean?',
      askTerm: (n) => 'Q' + n + '. Which expression matches?',
      correct: '⭕ Correct!',
      wrong: '❌ Wrong! −1 heart',
      seeResults: 'See results',
      nextQ: 'Next question →',
      clearTitle: 'Level cleared!',
      failTitle: 'So close!',
      clearText: (total, ok, done) => ok + ' out of ' + total + ' correct! ' +
        (done ? 'You conquered every level. No chat can scare you now! 🏆' : 'The next level is unlocked.'),
      failText: 'You ran out of hearts. Review the words you missed and try again!',
      missedLabel: '📌 Words to review',
      nextLevel: 'Learn the next level →',
      backHome: 'Back to home',
      retry: 'Review cards & retry',
      langBtn: '🌐 한국어',
    },
    ko: {
      title: '요즘 영어 💬',
      subtitle: '신조어, 슬랭, 줄임말 몰라서 대화에서 겉돌았다면 여기서 끝내요.<br>레벨마다 <strong>카드로 배우고 → 퀴즈로 클리어</strong>. 뒤로 갈수록 최신 유행어가 나옵니다.',
      cleared: '클리어',
      reset: '진행도 초기화',
      resetConfirm: '진행도를 초기화하고 레벨 1부터 다시 시작할까요?',
      home: '← 홈',
      quit: '← 그만두기',
      tapHint: '카드를 눌러 뜻 확인 👆',
      prev: '← 이전',
      next: '다음 →',
      startQuiz: '📝 퀴즈 시작 (8문제)',
      quiz: '퀴즈',
      askMeaning: (n) => 'Q' + n + '. 이 표현의 뜻은?',
      askTerm: (n) => 'Q' + n + '. 이 뜻에 맞는 표현은?',
      correct: '⭕ 정답!',
      wrong: '❌ 오답! 하트 -1',
      seeResults: '결과 보기',
      nextQ: '다음 문제 →',
      clearTitle: '레벨 클리어!',
      failTitle: '아쉽다!',
      clearText: (total, ok, done) => total + '문제 중 ' + ok + '문제 정답! ' +
        (done ? '모든 레벨을 정복했어요. 이제 어떤 채팅도 무섭지 않다! 🏆' : '다음 레벨이 열렸어요.'),
      failText: '하트를 다 썼어요. 틀린 단어를 복습하고 다시 도전해요!',
      missedLabel: '📌 틀린 단어 복습',
      nextLevel: '다음 레벨 배우러 가기 →',
      backHome: '홈으로',
      retry: '카드 다시 보고 재도전',
      langBtn: '🌐 English',
    },
  };

  // ---------- Word data ----------
  // t: term / en,ko: {m: short meaning (quiz choice), d: explanation} / ex,exKo: example / grp: synonym group
  const LEVELS = [
    { name: { en: 'Basic Acronyms Ⅰ', ko: '기본 줄임말 Ⅰ' }, desc: { en: 'Texting survival kit', ko: '채팅의 기초 체력' }, words: [
      { t: 'LOL', grp: 'laugh',
        en: { m: 'laughing out loud', d: 'The classic way to show something made you laugh in chat.' },
        ko: { m: '크게 웃김 (ㅋㅋㅋ)', d: "'laughing out loud'의 줄임말. 한국어의 ㅋㅋㅋ에 해당하는 가장 기본 표현." },
        ex: 'That video was hilarious, LOL.', exKo: '그 영상 완전 웃겼어 ㅋㅋㅋ' },
      { t: 'OMG',
        en: { m: 'oh my god (surprise)', d: 'A reflex exclamation when something shocks or surprises you.' },
        ko: { m: '헐, 세상에', d: "'oh my god'의 줄임말. 놀랐을 때 반사적으로 쓰는 감탄사." },
        ex: 'OMG, did you see that?', exKo: '헐, 너 그거 봤어?' },
      { t: 'BTW',
        en: { m: 'by the way', d: 'Used to switch topics or add a side note.' },
        ko: { m: '그건 그렇고, 참고로', d: "'by the way'의 줄임말. 화제를 바꾸거나 곁다리 정보를 붙일 때." },
        ex: 'BTW, are you free this weekend?', exKo: '그건 그렇고, 이번 주말에 시간 돼?' },
      { t: 'FYI',
        en: { m: 'for your information', d: 'Attaches a heads-up or useful info; very common at work.' },
        ko: { m: '참고하라고 알려주는 정보', d: "'for your information'의 줄임말. 회사 메일에서도 아주 많이 쓰임." },
        ex: 'FYI, the meeting moved to 3pm.', exKo: '참고로, 회의가 3시로 옮겨졌어요.' },
      { t: 'ASAP',
        en: { m: 'as soon as possible', d: 'Used when you need something done urgently.' },
        ko: { m: '최대한 빨리', d: "'as soon as possible'의 줄임말. 급한 일을 부탁할 때." },
        ex: 'Can you send it ASAP?', exKo: '최대한 빨리 보내줄 수 있어?' },
      { t: 'IDK',
        en: { m: "I don't know", d: 'Three letters to say you have no idea.' },
        ko: { m: '잘 모르겠어', d: "'I don't know'의 줄임말. 채팅에서 세 글자로 끝내는 '몰라'." },
        ex: 'IDK what to eat for dinner.', exKo: '저녁 뭐 먹을지 모르겠네.' },
      { t: 'TMI',
        en: { m: 'too much information', d: "Said when someone overshares details you really didn't need." },
        ko: { m: '굳이 몰라도 될 과한 정보', d: "'too much information'의 줄임말. 원래는 '그런 것까진 말 안 해도 돼'라는 뉘앙스." },
        ex: "Dude, that's TMI. I didn't need to know that.", exKo: '야 그건 TMI야, 몰라도 됐어.' },
      { t: 'BRB',
        en: { m: 'be right back', d: 'Stepping away for a moment mid-chat.' },
        ko: { m: '금방 돌아올게', d: "'be right back'의 줄임말. 잠깐 자리 비울 때." },
        ex: 'BRB, someone is at the door.', exKo: '금방 올게, 누가 문 앞에 왔어.' },
    ]},
    { name: { en: 'Basic Acronyms Ⅱ', ko: '기본 줄임말 Ⅱ' }, desc: { en: 'Still basics, still essential', ko: '아직 기초, 하지만 필수' }, words: [
      { t: 'TBH', grp: 'honest',
        en: { m: 'to be honest', d: 'Placed before an honest opinion.' },

        ko: { m: '멋있어 보이려고 포인트 쌓기', d: "일부러 시크하고 멋있는 행동을 해서 '아우라 점수'를 모으는 것. 대개 비꼬는 뉘앙스." },
        ex: 'He stared out the bus window in the rain. Aura farming.', exKo: '비 오는 날 버스 창밖만 바라보더라. 아우라 적립 중.' },
      { t: 'looksmaxxing',
        en: { m: 'maximizing your appearance', d: 'Skincare, gym, haircut — optimizing looks to the limit. "-maxxing" works as a suffix for anything.' },
        ko: { m: '외모를 최대치로 끌어올리기', d: '피부·헤어·운동 등으로 외모를 극한까지 개선하려는 트렌드. maxxing은 "~을 극대화"라는 접미어로도 유행.' },
        ex: 'He started skincare and gym — full looksmaxxing mode.', exKo: '걔 피부 관리에 헬스까지, 완전 외모 끌올 모드야.' },
    ]},
  ];

  const QUIZ_SIZE = 8;
  const MAX_HEARTS = 3;

  // ---------- language ----------
  const LANG_KEY = 'slang-quiz-lang';
  let lang = 'en';
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved === 'en' || saved === 'ko') lang = saved;
    else if ((navigator.language || '').startsWith('ko')) lang = 'ko';
  } catch (e) { /* default en */ }
  const S = () => STR[lang];
  const M = (w) => w[lang].m;
  const D = (w) => w[lang].d;

  // ---------- progress ----------
  const STORAGE_KEY = 'slang-quiz-progress';
  let clearedCount = 0;
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (saved.cleared >= 0) clearedCount = Math.min(saved.cleared, LEVELS.length);
  } catch (e) { /* ignore corrupted save */ }
  function saveProgress() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ cleared: clearedCount })); } catch (e) { /* private mode */ }
  }

  // ---------- state ----------
  let currentLevel = 0;
  let cardIndex = 0;
  let cardFlipped = false;
  let questions = [];
  let qIndex = 0;
  let hearts = MAX_HEARTS;
  let missed = [];
  let answered = false;
  let results = []; // 'done' | 'miss'

  const $ = (id) => document.getElementById(id);
  const screens = { home: $('homeScreen'), learn: $('learnScreen'), quiz: $('quizScreen'), result: $('resultScreen') };
  function show(name) {
    Object.values(screens).forEach((s) => s.classList.remove('active'));
    screens[name].classList.add('active');
    window.scrollTo(0, 0);
  }

  const shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  // ---------- static labels ----------
  function applyLang() {
    document.documentElement.lang = lang;
    $('appTitle').textContent = S().title;
    $('appSubtitle').innerHTML = S().subtitle;
    $('langBtn').textContent = S().langBtn;
    $('resetBtn').textContent = S().reset;
    $('learnBackBtn').textContent = S().home;
    $('quizBackBtn').textContent = S().quit;
    $('prevCardBtn').textContent = S().prev;
    $('nextCardBtn').textContent = S().next;
    $('startQuizBtn').textContent = S().startQuiz;
    $('resultHomeBtn').textContent = S().backHome;
  }

  // ---------- home ----------
  function renderHome() {
    $('homeProgressText').textContent = clearedCount + '/' + LEVELS.length + ' ' + S().cleared;
    $('homeProgressFill').style.width = (clearedCount / LEVELS.length * 100) + '%';
    const list = $('levelList');
    list.innerHTML = '';
    LEVELS.forEach((lv, i) => {
      const btn = document.createElement('button');
      btn.className = 'level-card';
      const cleared = i < clearedCount;
      const unlocked = i <= clearedCount;
      if (cleared) btn.classList.add('cleared');
      if (!unlocked) { btn.classList.add('locked'); btn.disabled = true; }
      const preview = lv.words.slice(0, 4).map((w) => w.t).join(' · ');
      btn.innerHTML =
        '<span class="num">' + (i + 1) + '</span>' +
        '<span class="info"><span class="name">' + lv.name[lang] + '</span>' +
        '<span class="words-preview">' + (unlocked ? preview + ' …' : lv.desc[lang]) + '</span></span>' +
        '<span class="state">' + (cleared ? '✅' : unlocked ? '▶️' : '🔒') + '</span>';
      btn.addEventListener('click', () => { if (unlocked) openLearn(i); });
      list.appendChild(btn);
    });
  }

  // ---------- learn ----------
  function openLearn(levelIdx) {
    currentLevel = levelIdx;
    cardIndex = 0;
    cardFlipped = false;
    $('learnLevelTag').textContent = 'Lv.' + (levelIdx + 1) + ' ' + LEVELS[levelIdx].name[lang];
    renderCard();
    show('learn');
  }

  function renderCard() {
    const words = LEVELS[currentLevel].words;
    const w = words[cardIndex];
    const fc = $('flashcard');
    if (!cardFlipped) {
      fc.innerHTML = '<div class="term">' + w.t + '</div><div class="tap-hint">' + S().tapHint + '</div>';
    } else {
      fc.innerHTML =
        '<div class="term" style="font-size:26px">' + w.t + '</div>' +
        '<div class="meaning">' + M(w) + '</div>' +
        '<div class="detail">' + D(w) + '</div>' +
        '<div class="example"><div class="en">💬 ' + w.ex + '</div>' +
        (lang === 'ko' ? '<div class="ko">' + w.exKo + '</div>' : '') + '</div>';
    }
    $('cardCount').textContent = (cardIndex + 1) + ' / ' + words.length;
    $('prevCardBtn').disabled = cardIndex === 0;
    $('nextCardBtn').disabled = cardIndex === words.length - 1;
  }

  $('flashcard').addEventListener('click', () => { cardFlipped = !cardFlipped; renderCard(); });
  $('prevCardBtn').addEventListener('click', () => { if (cardIndex > 0) { cardIndex--; cardFlipped = false; renderCard(); } });
  $('nextCardBtn').addEventListener('click', () => {
    if (cardIndex < LEVELS[currentLevel].words.length - 1) { cardIndex++; cardFlipped = false; renderCard(); }
  });
  $('learnBackBtn').addEventListener('click', () => { renderHome(); show('home'); });

  // ---------- quiz ----------
  const groupOf = (w) => w.grp || w.t;

  function buildQuestions(levelIdx) {
    const words = LEVELS[levelIdx].words;
    const allWords = LEVELS.flatMap((lv) => lv.words);
    return shuffle(words).slice(0, QUIZ_SIZE).map((w) => {
      const type = Math.random() < 0.5 ? 'meaning' : 'term'; // meaning: term→meaning, term: meaning→term
      const pool = shuffle(allWords.filter((o) => o.t !== w.t && groupOf(o) !== groupOf(w)));
      const distractors = pool.slice(0, 3);
      const choices = shuffle([w, ...distractors]);
      return { w, type, choices };
    });
  }

  function openQuiz() {
    questions = buildQuestions(currentLevel);
    qIndex = 0;
    hearts = MAX_HEARTS;
    missed = [];
    results = [];
    $('quizLevelTag').textContent = 'Lv.' + (currentLevel + 1) + ' ' + S().quiz;
    renderQuestion();
    show('quiz');
  }

  $('startQuizBtn').addEventListener('click', openQuiz);
  $('quizBackBtn').addEventListener('click', () => { renderHome(); show('home'); });

  function renderQuizHeader() {
    $('quizHearts').textContent = '❤️'.repeat(hearts) + '🖤'.repeat(MAX_HEARTS - hearts);
    const bar = $('quizProgress');
    bar.innerHTML = '';
    for (let i = 0; i < questions.length; i++) {
      const seg = document.createElement('span');
      if (i < results.length) seg.classList.add(results[i]);
      else if (i === qIndex) seg.classList.add('now');
      bar.appendChild(seg);
    }
  }

  function renderQuestion() {
    answered = false;
    const q = questions[qIndex];
    renderQuizHeader();
    $('feedback').classList.add('hidden');
    $('nextQuestionBtn').classList.add('hidden');

    if (q.type === 'meaning') {
      $('questionAsk').textContent = S().askMeaning(qIndex + 1);
      $('questionPrompt').className = 'prompt';
      $('questionPrompt').innerHTML = '<em>' + q.w.t + '</em>';
    } else {
      $('questionAsk').textContent = S().askTerm(qIndex + 1);
      $('questionPrompt').className = 'prompt small';
      $('questionPrompt').textContent = '“' + M(q.w) + '”';
    }

    const box = $('choices');
    box.innerHTML = '';
    q.choices.forEach((cw) => {
      const btn = document.createElement('button');
      btn.className = 'choice';
      btn.textContent = q.type === 'meaning' ? M(cw) : cw.t;
      btn.addEventListener('click', () => answer(cw, btn));
      box.appendChild(btn);
    });
  }

  function answer(chosen, btn) {
    if (answered) return;
    answered = true;
    const q = questions[qIndex];
    const correct = chosen.t === q.w.t;
    const label = q.type === 'meaning' ? M(q.w) : q.w.t;
    document.querySelectorAll('.choice').forEach((b) => {
      b.disabled = true;
      if (b.textContent === label) b.classList.add('correct');
    });
    if (!correct) {
      btn.classList.add('wrong');
      hearts--;
      missed.push(q.w);
      results.push('miss');
    } else {
      results.push('done');
    }
    renderQuizHeader();

    const fb = $('feedback');
    fb.className = 'feedback ' + (correct ? 'good' : 'bad');
    fb.innerHTML =
      '<span class="verdict">' + (correct ? S().correct : S().wrong) + '</span>' +
      '<span class="word-line"><em>' + q.w.t + '</em> = ' + M(q.w) + '</span>' +
      '<span>' + D(q.w) + '</span>' +
      '<span class="ex">💬 ' + q.w.ex + (lang === 'ko' ? ' — ' + q.w.exKo : '') + '</span>';
    fb.classList.remove('hidden');

    if ((!correct && hearts <= 0) || qIndex === questions.length - 1) {
      $('nextQuestionBtn').textContent = S().seeResults;
    } else {
      $('nextQuestionBtn').textContent = S().nextQ;
    }
    $('nextQuestionBtn').classList.remove('hidden');
  }

  $('nextQuestionBtn').addEventListener('click', () => {
    if (hearts <= 0 || qIndex === questions.length - 1) { finishQuiz(); return; }
    qIndex++;
    renderQuestion();
  });

  // ---------- result ----------
  function finishQuiz() {
    const passed = hearts > 0;
    const correctCount = results.filter((r) => r === 'done').length;
    if (passed && currentLevel === clearedCount) {
      clearedCount++;
      saveProgress();
    }
    const allDone = clearedCount >= LEVELS.length;
    $('resultEmoji').textContent = passed ? '🎉' : '💔';
    $('resultTitle').textContent = passed ? S().clearTitle : S().failTitle;
    $('resultText').innerHTML = passed ? S().clearText(questions.length, correctCount, allDone) : S().failText;

    const mb = $('missedBox');
    if (missed.length > 0) {
      mb.classList.remove('hidden');
      mb.innerHTML = '<span class="label">' + S().missedLabel + '</span>' +
        missed.map((w) => '<div class="missed-item"><strong>' + w.t + '</strong> = ' + M(w) + '<br>' + D(w) + '</div>').join('');
    } else {
      mb.classList.add('hidden');
    }

    const mainBtn = $('resultMainBtn');
    if (passed && clearedCount < LEVELS.length && currentLevel === clearedCount - 1) {
      mainBtn.textContent = S().nextLevel;
      mainBtn.onclick = () => openLearn(clearedCount);
    } else if (passed) {
      mainBtn.textContent = S().backHome;
      mainBtn.onclick = () => { renderHome(); show('home'); };
    } else {
      mainBtn.textContent = S().retry;
      mainBtn.onclick = () => openLearn(currentLevel);
    }
    show('result');
  }

  $('resultHomeBtn').addEventListener('click', () => { renderHome(); show('home'); });

  $('resetBtn').addEventListener('click', () => {
    if (confirm(S().resetConfirm)) {
      clearedCount = 0;
      saveProgress();
      renderHome();
    }
  });

  $('langBtn').addEventListener('click', () => {
    lang = lang === 'en' ? 'ko' : 'en';
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) { /* private mode */ }
    applyLang();
    renderHome();
  });

  applyLang();
  renderHome();
})();
</script>
</body>
</html>
