<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<title>Torch Dive — One More Floor</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0805">
<style>
/* 토치 다이브 — 횃불빛 지하. 파스텔 낮(퍼즐 삼형제)도, 네온 우주(코멧 슬링)도 아닌
   세 번째 얼굴: 검은 흙, 호박색 불빛, 금화의 반짝임. */

:root {
  --bg: #0d0805;
  --bg-deep: #060302;
  --ember: #ff9a3c;
  --ember-dim: #b96a2a;
  --gold: #ffd34d;
  --bone: #e8dcc8;
  --ash: #8a7663;
  --blood: #ff5a4e;
  --moss: #79d97c;
  --door-hi: #6b4423;
  --door-lo: #3a2412;
  --card: #1a100a;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

html,
body {
  height: 100%;
  overscroll-behavior: none;
}

body {
  background: var(--bg-deep);
  color: var(--bone);
  font-family: 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  display: flex;
  justify-content: center;
  touch-action: manipulation;
}

#app {
  position: relative;
  width: 100%;
  max-width: 430px;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  /* 화면 위쪽 모서리에서 횃불이 타는 듯한 잔광 */
  background:
    radial-gradient(120% 55% at 50% -12%, rgba(255, 154, 60, 0.16), transparent 60%),
    radial-gradient(70% 40% at 50% 110%, rgba(0, 0, 0, 0.7), transparent),
    var(--bg);
}

#app.shake {
  animation: shake 0.45s;
}

@keyframes shake {
  15% { transform: translate(-7px, 2px); }
  30% { transform: translate(6px, -3px); }
  45% { transform: translate(-5px, -2px); }
  60% { transform: translate(4px, 2px); }
  75% { transform: translate(-2px, 1px); }
}

/* ----- HUD ----- */

#hud {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: max(10px, env(safe-area-inset-top)) 14px 6px;
  font-size: 14px;
  letter-spacing: 0.08em;
}

.hud-cell {
  min-width: 92px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.hud-right {
  justify-content: flex-end;
}

#torchRow {
  font-size: 17px;
  letter-spacing: 0.02em;
}

#torchRow.free {
  font-size: 12px;
  color: var(--ash);
}

.torch {
  filter: drop-shadow(0 0 6px rgba(255, 154, 60, 0.55));
  animation: flicker 2.2s infinite;
}

.torch:nth-child(2) { animation-delay: 0.7s; }
.torch:nth-child(3) { animation-delay: 1.3s; }

.torch.spent {
  filter: grayscale(1) brightness(0.45);
  animation: none;
}

@keyframes flicker {
  0%, 100% { opacity: 1; }
  47% { opacity: 0.82; }
  53% { opacity: 0.95; }
  71% { opacity: 0.85; }
}

#depthLabel {
  font-weight: 700;
  color: var(--ember);
  text-shadow: 0 0 14px rgba(255, 154, 60, 0.4);
}

#todayLabel {
  color: var(--gold);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.hud-btn {
  background: none;
  border: none;
  font-size: 17px;
  cursor: pointer;
  opacity: 0.85;
}

/* ----- 던전 ----- */

#dungeon {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 18px;
  padding: 0 22px;
  min-height: 0;
}

/* 층 구성 pips — 이 층의 문 뒤에 무엇이 있는지, 게임은 거짓말하지 않는다 */
#compRow {
  display: flex;
  justify-content: center;
  gap: 7px;
  min-height: 30px;
}

.pip {
  font-size: 15px;
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 211, 77, 0.14);
  border-radius: 50%;
}

.pip-skull {
  border-color: rgba(255, 90, 78, 0.4);
  background: rgba(255, 90, 78, 0.08);
}

/* ----- 문 ----- */

#doors {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.door {
  position: relative;
  aspect-ratio: 3 / 4;
  max-height: 30vh;
  perspective: 700px;
  cursor: pointer;
}

.door.drop-in {
  animation: drop-in 0.4s backwards cubic-bezier(0.2, 0.9, 0.3, 1.1);
}

@keyframes drop-in {
  from {
    opacity: 0;
    transform: translateY(26px) scale(0.94);
  }
}

.door-inner {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.3, 0.8, 0.3, 1);
}

.door.open .door-inner {
  transform: rotateY(180deg);
}

.door-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 46% 46% 12px 12px / 30% 30% 12px 12px; /* 위가 둥근 석굴 문 */
}

.door-front {
  background:
    radial-gradient(70% 45% at 50% 0%, rgba(255, 190, 110, 0.18), transparent 70%),
    repeating-linear-gradient(90deg, transparent 0 21%, rgba(0, 0, 0, 0.28) 21% 23%),
    linear-gradient(175deg, var(--door-hi), var(--door-lo) 70%);
  border: 2px solid #241408;
  box-shadow:
    inset 0 2px 0 rgba(255, 210, 150, 0.18),
    0 10px 24px rgba(0, 0, 0, 0.55);
}

/* 문고리 */
.door-front::after {
  content: '';
  position: absolute;
  left: 50%;
  top: 56%;
  width: 17%;
  aspect-ratio: 1;
  transform: translateX(-50%);
  border: 3px solid rgba(255, 211, 77, 0.5);
  border-radius: 50%;
  box-shadow: 0 0 10px rgba(255, 211, 77, 0.18), inset 0 0 6px rgba(0, 0, 0, 0.5);
}

.door-back {
  transform: rotateY(180deg);
  background:
    radial-gradient(80% 60% at 50% 35%, rgba(255, 154, 60, 0.14), transparent 75%),
    linear-gradient(180deg, #17100b, #0a0604);
  border: 2px solid #241408;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.door-back .loot {
  font-size: clamp(38px, 11vw, 52px);
  filter: drop-shadow(0 0 14px rgba(255, 211, 77, 0.35));
}

.door-back .gain {
  font-size: 17px;
  font-weight: 700;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
}

.door.good .door-back {
  box-shadow: 0 0 26px rgba(255, 211, 77, 0.22);
}

.door.bad .door-back {
  background:
    radial-gradient(80% 60% at 50% 35%, rgba(255, 90, 78, 0.22), transparent 75%),
    linear-gradient(180deg, #17100b, #0a0604);
  box-shadow: 0 0 30px rgba(255, 90, 78, 0.3);
}

.door.bad .loot {
  filter: drop-shadow(0 0 14px rgba(255, 90, 78, 0.6));
}

/* 해골 뒤에 함께 까지는 나머지 문들 — 놓친 것들은 반쯤 어둠 속에 */
.door.ghost .door-back {
  opacity: 0.55;
}

/* ----- 등불 엿보기 ----- */

.peek-tag {
  position: absolute;
  top: 7%;
  right: 9%;
  font-size: 19px;
  opacity: 0.95;
  filter: drop-shadow(0 0 8px rgba(255, 154, 60, 0.8));
  animation: peek-in 0.35s backwards;
  pointer-events: none;
}

@keyframes peek-in {
  from {
    opacity: 0;
    transform: scale(1.7);
  }
}

.door.peek-bad .door-front {
  box-shadow:
    inset 0 2px 0 rgba(255, 210, 150, 0.18),
    0 0 18px rgba(255, 90, 78, 0.35);
}

.door.peek-good .door-front {
  box-shadow:
    inset 0 2px 0 rgba(255, 210, 150, 0.18),
    0 0 18px rgba(121, 217, 124, 0.3);
}

/* 엿보기 모드 — 등불을 든 손이 어느 문을 비출지 고르는 중 */
#app.peek-mode #doors .door:not(.open) .door-front {
  outline: 2px dashed rgba(255, 154, 60, 0.55);
  outline-offset: 4px;
}

.hidden {
  display: none !important;
}

/* ----- 가르침 — 문구 없이 손가락 하나 ----- */

.finger-hint {
  position: absolute;
  left: 50%;
  top: 62%;
  font-size: 34px;
  pointer-events: none;
  animation: nudge 1.1s infinite;
  filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.8));
}

@keyframes nudge {
  0%, 100% { transform: translate(-50%, 0); }
  50% { transform: translate(-50%, -12px); }
}

/* ----- 액션 ----- */

#actions {
  display: flex;
  gap: 12px;
  padding: 10px 18px max(16px, env(safe-area-inset-bottom));
}

.action-btn {
  border: 1px solid rgba(255, 211, 77, 0.25);
  background: var(--card);
  color: var(--bone);
  border-radius: 14px;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.04em;
  padding: 15px 16px;
  cursor: pointer;
  transition: transform 0.08s, opacity 0.2s;
}

.action-btn:active:not(:disabled) {
  transform: scale(0.96);
}

.action-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

#btnLantern {
  flex: 0 0 auto;
  min-width: 88px;
}

#btnLantern.active {
  border-color: var(--ember);
  box-shadow: 0 0 16px rgba(255, 154, 60, 0.35);
}

#btnBank {
  flex: 1;
  background: linear-gradient(180deg, #3a2a10, #241806);
  color: var(--gold);
  border-color: rgba(255, 211, 77, 0.45);
  font-variant-numeric: tabular-nums;
}

#btnBank.pulse {
  animation: bank-pulse 1.3s infinite;
}

@keyframes bank-pulse {
  0%, 100% { box-shadow: 0 0 0 rgba(255, 211, 77, 0); }
  50% { box-shadow: 0 0 22px rgba(255, 211, 77, 0.45); }
}

/* ----- 다이브 종료 오버레이 ----- */

#overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(4, 2, 1, 0.78);
  backdrop-filter: blur(3px);
  z-index: 10;
  cursor: pointer;
}

.overlay-card {
  text-align: center;
  padding: 34px 46px;
  border-radius: 20px;
  background: rgba(20, 12, 7, 0.92);
  border: 1px solid rgba(255, 154, 60, 0.22);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
  animation: card-in 0.35s backwards cubic-bezier(0.2, 0.9, 0.3, 1.15);
}

@keyframes card-in {
  from {
    opacity: 0;
    transform: translateY(18px) scale(0.95);
  }
}

#ovKicker {
  font-size: 13px;
  letter-spacing: 0.22em;
  color: var(--ash);
}

#ovBig {
  font-size: 54px;
  font-weight: 800;
  margin: 6px 0 4px;
  font-variant-numeric: tabular-nums;
}

#ovBig.ov-good {
  color: var(--gold);
  text-shadow: 0 0 24px rgba(255, 211, 77, 0.4);
}

#ovBig.ov-bad {
  color: var(--blood);
  text-shadow: 0 0 24px rgba(255, 90, 78, 0.4);
}

#ovSub {
  font-size: 14px;
  color: var(--bone);
  opacity: 0.85;
}

#ovTorches {
  margin-top: 12px;
  font-size: 18px;
  letter-spacing: 0.2em;
}

.retry-note {
  margin-top: 16px;
  font-size: 13px;
  color: var(--ash);
  animation: breathe 1.8s infinite;
}

@keyframes breathe {
  0%, 100% { opacity: 0.55; }
  50% { opacity: 1; }
}

/* ----- 가입 게이트 ----- */

#gate {
  position: absolute;
  inset: 0;
  z-index: 15; /* 다이브 오버레이보다 위, 광고보다 아래 */
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(4, 2, 1, 0.82);
  backdrop-filter: blur(4px);
}

.gate-card {
  width: min(86vw, 330px);
  text-align: center;
  padding: 30px 26px 22px;
  border-radius: 20px;
  background: rgba(20, 12, 7, 0.96);
  border: 1px solid rgba(255, 154, 60, 0.22);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
  animation: card-in 0.35s backwards cubic-bezier(0.2, 0.9, 0.3, 1.15);
}

.gate-flame {
  font-size: 40px;
  filter: drop-shadow(0 0 16px rgba(255, 154, 60, 0.6));
  animation: flicker 2.2s infinite;
}

.gate-title {
  margin-top: 6px;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 0.18em;
  color: var(--ember);
  text-shadow: 0 0 18px rgba(255, 154, 60, 0.4);
}

.gate-sub {
  margin-top: 4px;
  font-size: 13px;
  color: var(--ash);
}

#googleBtn {
  margin-top: 18px;
  display: flex;
  justify-content: center;
  min-height: 44px;
}

.gate-or {
  margin: 10px 0 2px;
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--ash);
}

#emailForm {
  margin-top: 14px;
  display: flex;
  gap: 8px;
}

#emailInput {
  flex: 1;
  min-width: 0;
  user-select: text;
  -webkit-user-select: text;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid rgba(255, 211, 77, 0.25);
  background: rgba(255, 255, 255, 0.04);
  color: var(--bone);
  font-size: 15px;
  outline: none;
}

#emailInput:focus {
  border-color: var(--ember);
  box-shadow: 0 0 12px rgba(255, 154, 60, 0.25);
}

#emailInput::placeholder {
  color: var(--ash);
  opacity: 0.7;
}

#btnJoin {
  flex: 0 0 auto;
  padding: 12px 18px;
  border-radius: 12px;
  border: 1px solid rgba(255, 211, 77, 0.45);
  background: linear-gradient(180deg, #3a2a10, #241806);
  color: var(--gold);
  font-weight: 800;
  letter-spacing: 0.08em;
  cursor: pointer;
}

#btnJoin:active {
  transform: scale(0.96);
}

.gate-note {
  margin-top: 12px;
  font-size: 11px;
  color: var(--ash);
}

.gate-skip {
  margin-top: 14px;
  background: none;
  border: none;
  color: var(--ash);
  font-size: 13px;
  cursor: pointer;
  opacity: 0.8;
}

.gate-skip:active {
  opacity: 1;
}

/* ----- 광고 자리 ----- */

#adSlot {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.85);
}

.ad-frame {
  width: min(86vw, 340px);
  border-radius: 16px;
  overflow: hidden;
  background: #171310;
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.ad-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 12px;
  background: rgba(255, 255, 255, 0.05);
}

.ad-tag {
  font-size: 11px;
  letter-spacing: 0.15em;
  color: var(--ash);
  border: 1px solid var(--ash);
  border-radius: 4px;
  padding: 1px 6px;
}

.ad-close {
  background: none;
  border: none;
  color: var(--bone);
  font-size: 15px;
  min-width: 28px;
  cursor: pointer;
}

.ad-close:disabled {
  opacity: 0.5;
  cursor: default;
}

.ad-body {
  padding: 38px 20px 44px;
  text-align: center;
}

.ad-title {
  font-weight: 700;
}

.ad-sub {
  margin-top: 8px;
  font-size: 13px;
  color: var(--ash);
}

</style>
</head>
<body>
<div id="app">
    <header id="hud">
      <div id="torchRow" class="hud-cell"></div>
      <div id="depthLabel" class="hud-mid">FLOOR 1</div>
      <div class="hud-cell hud-right">
        <div id="todayLabel">TODAY 0</div>
        <button id="btnSignup" class="hud-btn hidden" title="Join with email" aria-label="Join with email">✉️</button>
        <button id="btnMute" class="hud-btn" title="Sound on/off" aria-label="Sound">🔊</button>
      </div>
    </header>

    <main id="dungeon">
      <div id="compRow"></div>
      <div id="doors"></div>
    </main>

    <footer id="actions">
      <button id="btnLantern" class="action-btn" aria-label="Peek with a lantern">🏮 ×1</button>
      <button id="btnBank" class="action-btn primary" aria-label="Bank and climb out"><span id="bankLabel">CLIMB OUT</span></button>
    </footer>

    <div id="overlay" class="hidden">
      <div class="overlay-card">
        <div id="ovKicker">BANKED</div>
        <div id="ovBig" class="ov-good">+0</div>
        <div id="ovSub"></div>
        <div id="ovTorches"></div>
        <p class="retry-note" id="ovNote">tap to dive again</p>
      </div>
    </div>

    <div id="gate" class="hidden">
      <div class="gate-card">
        <div class="gate-flame">🔥</div>
        <div class="gate-title">TORCH DIVE</div>
        <p class="gate-sub">3 torches a day · keep your loot</p>
        <div id="googleBtn" class="hidden"></div>
        <div id="gateOr" class="gate-or hidden">or</div>
        <form id="emailForm" novalidate>
          <input id="emailInput" type="email" autocomplete="email" inputmode="email"
                 placeholder="you@email.com" aria-label="Email">
          <button id="btnJoin" type="submit">JOIN</button>
        </form>
        <p class="gate-note">Launch news only. No spam, ever.</p>
        <button id="btnSkip" type="button" class="gate-skip">play as guest →</button>
      </div>
    </div>

    <div id="adSlot" class="hidden">
      <div class="ad-frame">
        <div class="ad-head">
          <span class="ad-tag">AD</span>
          <button id="adClose" class="ad-close" disabled>5</button>
        </div>
        <div class="ad-body">
          <p class="ad-title">Ad placeholder</p>
          <p class="ad-sub">An interstitial ad will appear here once an ad network is connected.</p>
        </div>
      </div>
    </div>
  </div>
<script type="module">

const safeStorage = (() => {
  try {
    localStorage.setItem('__probe', '1');
    localStorage.removeItem('__probe');
    return localStorage;
  } catch {
    const mem = new Map();
    return {
      getItem: (k) => (mem.has(k) ? mem.get(k) : null),
      setItem: (k, v) => mem.set(k, String(v)),
      removeItem: (k) => mem.delete(k),
    };
  }
})();

// ===== torch-dive/engine.js =====
// 순수 게임 로직 — DOM 없음. 시드 RNG, 층 생성, 문 열기/등불 엿보기/챙겨 나가기 판정.
//
// 계약 두 가지, 테스트가 검증한다:
//  1) 결정론 — 같은 (daySeed, runIndex) + 같은 행동 순서 = 같은 던전, 같은 결과.
//     층은 내려가는 순서로만 생성되고 RNG는 그 순서로만 소비된다.
//  2) 정직함 — 층 위에 표시되는 구성(pips)은 문 뒤 내용물과 정확히 일치한다.
//     게임은 절대 거짓말하지 않는다. 확률을 읽고 배짱을 내는 것이 곧 실력이다.

const CONFIG = {
  doorsPerFloor: 4,
  torchesPerDay: 3, // 하루에 주어지는 다이브 수 — 자정이 지나면 새 던전과 함께 리필
  lanternStart: 1,
  maxLanterns: 2,
};

// mulberry32 — 작고 결정적인 시드 RNG (형제 게임들과 동일)
function makeRng(seed) {
  let s = seed >>> 0;
  return function rng() {
    s = (s + 0x6d2b79f5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// FNV-1a — 날짜 문자열('2026-08-06')을 그날의 시드로. 전 세계가 같은 던전을 받는다.
function hashSeed(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

// 보상 곡선 — 깊을수록 단조 증가. 테스트가 단조성을 검증한다.
function valueAt(floor) {
  return { coin: 10 * floor, gem: 40 * floor };
}

// 해골 수의 하한/상한 — 둘 다 깊이에 대해 단조 증가.
// 상한은 언제나 문 수 - 1: 어떤 층에도 안전한 문이 최소 하나는 있다.
function skullBoundsAt(floor) {
  if (floor <= 1) return { min: 0, max: 0 }; // 1층은 무조건 안전 — 첫 손맛은 공짜다
  if (floor === 2) return { min: 1, max: 1 };
  if (floor <= 4) return { min: 1, max: 2 };
  if (floor <= 7) return { min: 2, max: 2 };
  return { min: 2, max: 3 };
}

function gemChanceAt(floor) {
  return Math.min(0.4, 0.12 + 0.02 * floor);
}

function lanternChanceAt(floor) {
  return floor >= 2 ? 0.22 : 0;
}

function shuffle(arr, rng) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// 층 하나를 생성한다. RNG 소비 순서는 고정: 해골 수 → 등불 → 보석 → 섞기.
function makeFloor(rng, n) {
  const { min, max } = skullBoundsAt(n);
  const skulls = min + Math.floor(rng() * (max - min + 1));
  const doors = new Array(skulls).fill('skull');
  let rest = CONFIG.doorsPerFloor - skulls;
  if (rest > 0) {
    if (rng() < lanternChanceAt(n)) {
      doors.push('lantern');
      rest -= 1;
    }
  }
  if (rest > 0) {
    if (rng() < gemChanceAt(n)) {
      doors.push('gem');
      rest -= 1;
    }
  }
  while (rest-- > 0) doors.push('coin');
  shuffle(doors, rng);
  const comp = { coin: 0, gem: 0, lantern: 0, skull: 0 };
  for (const d of doors) comp[d] += 1;
  return { n, doors, comp };
}

// 다이브 하나를 시작한다. runIndex가 다르면 같은 날에도 배치가 다르다 —
// 하루 3번의 다이브는 각각 다른 던전이라 외워서 이기는 길이 없다.
function newDive(daySeed, runIndex = 0) {
  const seed = ((daySeed >>> 0) ^ Math.imul(runIndex + 1, 0x9e3779b9)) >>> 0;
  const s = {
    seed,
    rng: makeRng(seed),
    runIndex,
    floorNum: 0,
    floor: null,
    carried: 0, // 지금 들고 있는 것 — 죽으면 전부 잃는다
    lanterns: CONFIG.lanternStart,
    peeked: [], // 이 층에서 등불로 미리 본 문들
    over: false,
    busted: false,
    banked: 0, // 챙겨 나가는 데 성공한 금액
    lost: 0, // 해골에게 뺏긴 금액 (연출용 기록)
  };
  descend(s);
  return s;
}

function descend(s) {
  s.floorNum += 1;
  s.floor = makeFloor(s.rng, s.floorNum);
  s.peeked = [];
}

// 문을 연다. 안전하면 자동으로 한 층 내려가고, 해골이면 다이브가 끝난다.
// 반환값은 연출용 스냅샷 — doors는 열던 순간의 층 전체 (해골이면 전부 까 보여준다).
function openDoor(s, i) {
  if (s.over || i < 0 || i >= s.floor.doors.length) return null;
  const type = s.floor.doors[i];
  const v = valueAt(s.floorNum);
  const res = { type, gain: 0, floor: s.floorNum, doors: s.floor.doors.slice() };
  if (type === 'skull') {
    s.busted = true;
    s.over = true;
    s.lost = s.carried;
    s.carried = 0;
  } else if (type === 'coin') {
    res.gain = v.coin;
    s.carried += v.coin;
  } else if (type === 'gem') {
    res.gain = v.gem;
    s.carried += v.gem;
  } else if (type === 'lantern') {
    s.lanterns = Math.min(CONFIG.maxLanterns, s.lanterns + 1);
  }
  if (!s.over) descend(s);
  return res;
}

// 등불 하나를 태워 문 하나를 미리 본다. 내용물은 그대로 — 정보만 산다.
function peekDoor(s, i) {
  if (s.over || s.lanterns <= 0 || i < 0 || i >= s.floor.doors.length) return null;
  if (s.peeked.includes(i)) return null;
  s.lanterns -= 1;
  s.peeked.push(i);
  return s.floor.doors[i];
}

// 들고 있는 것을 챙겨 지상으로 — 다이브는 여기서 끝난다. 빈손으로는 못 나간다(나갈 이유도 없다).
function bankOut(s) {
  if (s.over || s.carried <= 0) return 0;
  s.banked = s.carried;
  s.over = true;
  return s.banked;
}

// ===== torch-dive/render.js =====
// DOM 렌더러 — 캔버스 없이 문 카드와 CSS 전환만으로 그린다.
// 엔진 상태를 읽기만 하고, 게임 규칙은 전혀 모른다.

const ICONS = { coin: '🪙', gem: '💎', lantern: '🏮', skull: '💀' };

// 구성 pips 표시 순서 — 좋은 것부터, 위협은 마지막에
const PIP_ORDER = ['coin', 'gem', 'lantern', 'skull'];

class Renderer {
  constructor(dom) {
    this.dom = dom;
    this.doorEls = [];
  }

  // ----- HUD -----

  updateHud(game) {
    const { dom } = this;
    const s = game.state;
    if (game.practice) {
      dom.torchRow.textContent = 'FREE DIVE';
      dom.torchRow.classList.add('free');
    } else {
      dom.torchRow.classList.remove('free');
      dom.torchRow.replaceChildren(
        ...Array.from({ length: game.torchesPerDay }, (_, i) => {
          const el = document.createElement('span');
          el.className = 'torch' + (i < game.day.used ? ' spent' : '');
          el.textContent = '🔥';
          return el;
        })
      );
    }
    dom.depthLabel.textContent = s ? `FLOOR ${s.floorNum}` : '';
    dom.todayLabel.textContent = `TODAY ${game.day.total}`;
    this.updateActions(game);
  }

  updateActions(game) {
    const s = game.state;
    const carried = s && !s.over ? s.carried : 0;
    this.dom.bankLabel.textContent = carried > 0 ? `CLIMB OUT +${carried}` : 'CLIMB OUT';
    this.dom.btnBank.disabled = carried <= 0;
    const lanterns = s && !s.over ? s.lanterns : 0;
    this.dom.btnLantern.textContent = `🏮 ×${lanterns}`;
    this.dom.btnLantern.disabled = lanterns <= 0;
  }

  pulseBank(on) {
    this.dom.btnBank.classList.toggle('pulse', on);
  }

  // ----- 층 -----

  renderFloor(game, { animate = true } = {}) {
    const s = game.state;
    this.renderComp(s.floor.comp);
    const wrap = this.dom.doors;
    wrap.replaceChildren();
    this.doorEls = s.floor.doors.map((_, i) => {
      const door = document.createElement('div');
      door.className = 'door';
      door.dataset.i = String(i);
      if (animate) door.style.animationDelay = `${i * 55}ms`;
      door.innerHTML = `
        <div class="door-inner">
          <div class="door-face door-front"></div>
          <div class="door-face door-back"><span class="loot"></span><span class="gain"></span></div>
        </div>
        <div class="peek-tag hidden"></div>`;
      if (animate) door.classList.add('drop-in');
      wrap.appendChild(door);
      return door;
    });
    this.updateHud(game);
  }

  renderComp(comp) {
    const row = this.dom.compRow;
    row.replaceChildren();
    for (const t of PIP_ORDER) {
      for (let k = 0; k < comp[t]; k++) {
        const pip = document.createElement('span');
        pip.className = `pip pip-${t}`;
        pip.textContent = ICONS[t];
        row.appendChild(pip);
      }
    }
  }

  _fillBack(el, type, gain) {
    el.querySelector('.loot').textContent = ICONS[type];
    el.querySelector('.gain').textContent = type === 'skull' ? '' : gain > 0 ? `+${gain}` : '';
  }

  // 문 하나를 연다 — 결과에 따라 좋은/나쁜 잔광
  revealDoor(i, res) {
    const el = this.doorEls[i];
    if (!el) return;
    this._fillBack(el, res.type, res.gain);
    el.classList.add('open', res.type === 'skull' ? 'bad' : 'good');
  }

  // 해골을 밟았다 — 나머지 문도 전부 까서 무엇을 놓쳤는지 보여준다
  revealRest(doors, openedIdx) {
    doors.forEach((type, i) => {
      if (i === openedIdx) return;
      const el = this.doorEls[i];
      if (!el) return;
      this._fillBack(el, type, 0);
      el.style.transitionDelay = `${120 + i * 90}ms`;
      el.classList.add('open', 'ghost');
    });
  }

  // 등불로 미리 보기 — 문은 닫힌 채, 내용물의 그림자만 문틈으로 비친다
  showPeek(i, type) {
    const el = this.doorEls[i];
    if (!el) return;
    const tag = el.querySelector('.peek-tag');
    tag.textContent = ICONS[type];
    tag.classList.remove('hidden');
    el.classList.add('peeked', type === 'skull' ? 'peek-bad' : 'peek-good');
  }

  setPeekMode(on) {
    this.dom.app.classList.toggle('peek-mode', on);
    this.dom.btnLantern.classList.toggle('active', on);
  }

  // ----- 가르침 (문구 없이 손가락 하나로) -----

  showFingerHint() {
    const first = this.doorEls[0];
    if (!first) return;
    const hint = document.createElement('div');
    hint.className = 'finger-hint';
    hint.textContent = '👆';
    first.appendChild(hint);
  }

  hideFingerHint() {
    this.dom.doors.querySelector('.finger-hint')?.remove();
  }

  // ----- 다이브 종료 오버레이 -----

  showDiveEnd({ kicker, big, cls, sub, torches, note }) {
    const { dom } = this;
    dom.ovKicker.textContent = kicker;
    dom.ovBig.textContent = big;
    dom.ovBig.className = cls;
    dom.ovSub.textContent = sub;
    dom.ovTorches.textContent = torches;
    dom.ovNote.textContent = note;
    dom.overlay.classList.remove('hidden');
  }

  hideOverlay() {
    this.dom.overlay.classList.add('hidden');
  }

  shake() {
    this.dom.app.classList.remove('shake');
    void this.dom.app.offsetWidth; // 리플로우로 애니메이션 재시작
    this.dom.app.classList.add('shake');
  }
}

// ===== torch-dive/audio.js =====
// WebAudio 신시사이저 — 오디오 파일 없이 코드로만 효과음을 만든다.
// 형제들의 Sound와 같은 뼈대지만 소리의 결이 또 다르다:
// 장난감의 딸깍도, 속도의 휘익도 아닌 **지하의 소리** — 동전의 쨍그랑, 낮은 북, 심장 박동.

const STORAGE_MUTED = 'tdv.muted';

class Sound {
  constructor() {
    this.muted = safeStorage.getItem(STORAGE_MUTED) === '1';
    this._ctx = null;
  }

  get ctx() {
    if (typeof AudioContext === 'undefined' && typeof webkitAudioContext === 'undefined') return null;
    if (!this._ctx) {
      try {
        this._ctx = new (window.AudioContext || window.webkitAudioContext)();
      } catch {
        return null;
      }
    }
    if (this._ctx.state === 'suspended') this._ctx.resume().catch(() => {});
    return this._ctx;
  }

  setMuted(m) {
    this.muted = m;
    safeStorage.setItem(STORAGE_MUTED, m ? '1' : '0');
  }

  _tone(freq, { type = 'sine', dur = 0.12, gain = 0.1, delay = 0, slide = 0 } = {}) {
    if (this.muted) return;
    const ctx = this.ctx;
    if (!ctx) return;
    try {
      const t0 = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t0 + dur);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(gain, t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
      osc.connect(g).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
    } catch {}
  }

  // 삐걱 — 문이 돌아간다
  creak() {
    this._tone(180, { type: 'triangle', dur: 0.09, gain: 0.05, slide: -60 });
  }

  // 쨍그랑 — 동전
  coin() {
    this._tone(1180, { type: 'triangle', dur: 0.1, gain: 0.11 });
    this._tone(1570, { type: 'triangle', dur: 0.14, gain: 0.08, delay: 0.05 });
  }

  // 반짝 — 보석 (동전보다 높고 길게)
  gem() {
    this._tone(1245, { type: 'sine', dur: 0.16, gain: 0.1 });
    this._tone(1661, { type: 'sine', dur: 0.18, gain: 0.09, delay: 0.07 });
    this._tone(2093, { type: 'sine', dur: 0.22, gain: 0.07, delay: 0.14 });
  }

  // 화르륵 — 등불을 줍거나 켠다
  lantern() {
    this._tone(520, { type: 'sine', dur: 0.14, gain: 0.09, slide: 260 });
  }

  // 쿵 — 한 층 내려간다
  step() {
    this._tone(105, { type: 'sine', dur: 0.13, gain: 0.12, slide: -35 });
  }

  // 두둥 — 해골. 낮고 길게, 심장이 한 번 멎는 소리
  skull() {
    this._tone(72, { type: 'sawtooth', dur: 0.5, gain: 0.14, slide: -30 });
    this._tone(54, { type: 'sine', dur: 0.65, gain: 0.16, delay: 0.05, slide: -18 });
  }

  // 좌르륵 — 챙겨 나가기. 동전 폭포는 올라가는 아르페지오
  bank() {
    [660, 880, 1100, 1320, 1570].forEach((f, i) =>
      this._tone(f, { type: 'triangle', dur: 0.12, gain: 0.1, delay: i * 0.07 })
    );
  }

  // 틱 — 소소한 UI
  ui() {
    this._tone(440, { type: 'sine', dur: 0.05, gain: 0.05 });
  }
}

// ===== torch-dive/ads.js =====
// 전면 광고 자리와 노출 빈도 관리 — 형제 게임들과 같은 뼈대, 다른 단위.
//
// 이 게임의 단위는 '다이브'다. 규칙:
//   - 처음 몇 다이브는 무조건 무광고 (긴장의 맛을 느끼기 전에 끊으면 그대로 이탈한다)
//   - 다이브 도중에는 절대 안 뜬다. 죽거나 챙겨 나온 뒤의 전환 순간에만 뜬다
//   - 몇 초 만에 끝난 다이브 뒤에는 안 뜬다 (2층 즉사에 광고까지 겹치면 최악이다)
//   - 하루 3다이브 구조라 실전 다이브 사이에는 거의 안 뜨고, 자연히 무료 다이브 구간에 몰린다

const STORAGE_AD = 'tdv.ads';

const AD_CONFIG = {
  // 이 횟수만큼 다이브를 마치기 전에는 광고를 띄우지 않는다
  freeDives: 5,
  // 그 뒤로는 이 다이브 수마다
  everyNDives: 3,
  // 아무리 자주 끝나도 이 시간(초) 안에는 두 번 띄우지 않는다
  minSecondsBetween: 90,
  // 이 시간(초)보다 짧았던 다이브 뒤에는 띄우지 않는다
  minDiveSeconds: 12,
  // 닫기 버튼이 열리기까지의 시간(초)
  countdownSeconds: 5,
};

// 광고 자리만 보여주는 기본 제공자 — 실제 SDK를 붙일 때 이 객체만 갈아끼운다.
function createPlaceholderProvider({ root, closeBtn, config = AD_CONFIG }) {
  return {
    name: 'placeholder',
    isReady: () => true,
    show() {
      return new Promise((resolve) => {
        let left = config.countdownSeconds;
        root.classList.remove('hidden');
        closeBtn.disabled = true;
        closeBtn.textContent = String(left);

        const tick = setInterval(() => {
          left -= 1;
          if (left > 0) {
            closeBtn.textContent = String(left);
            return;
          }
          clearInterval(tick);
          closeBtn.disabled = false;
          closeBtn.textContent = '✕';
          closeBtn.setAttribute('aria-label', 'Close ad');
        }, 1000);

        const done = () => {
          clearInterval(tick);
          closeBtn.removeEventListener('click', done);
          root.classList.add('hidden');
          resolve();
        };
        closeBtn.addEventListener('click', done);
      });
    },
  };
}

class AdManager {
  constructor({ provider, config = AD_CONFIG, enabled = true }) {
    this.provider = provider;
    this.config = config;
    this.enabled = enabled;
    this.showing = false;

    let saved = {};
    try {
      saved = JSON.parse(safeStorage.getItem(STORAGE_AD) || '{}');
    } catch {
      saved = {};
    }
    this.divesTotal = Number(saved.divesTotal) || 0;
    this.divesSinceAd = Number(saved.divesSinceAd) || 0;
    // 마지막 광고 시각은 저장하지 않는다 — 앱을 다시 열었을 때
    // "너무 이르다"는 이유로 건너뛰는 게 더 이상하다.
    this.lastShownAt = 0;
  }

  _save() {
    try {
      safeStorage.setItem(
        STORAGE_AD,
        JSON.stringify({ divesTotal: this.divesTotal, divesSinceAd: this.divesSinceAd })
      );
    } catch {}
  }

  // 다이브가 하나 끝났다. 노출 여부 판단은 maybeShow에서.
  noteDiveEnded() {
    this.divesTotal += 1;
    this.divesSinceAd += 1;
    this._save();
  }

  shouldShow(diveSeconds, now = Date.now()) {
    if (!this.enabled || this.showing) return false;
    if (this.divesTotal <= this.config.freeDives) return false;
    if (this.divesSinceAd < this.config.everyNDives) return false;
    if (diveSeconds < this.config.minDiveSeconds) return false;
    if (this.lastShownAt && now - this.lastShownAt < this.config.minSecondsBetween * 1000) {
      return false;
    }
    return this.provider.isReady();
  }

  // 조건이 맞으면 광고를 띄우고 닫힐 때까지 기다린다. 아니면 즉시 넘어간다.
  async maybeShow(diveSeconds, now = Date.now()) {
    if (!this.shouldShow(diveSeconds, now)) return false;
    this.showing = true;
    try {
      await this.provider.show();
    } catch {
      // 광고를 못 띄워도 게임 흐름은 멈추지 않는다
    }
    this.showing = false;
    this.divesSinceAd = 0;
    this.lastShownAt = Date.now();
    this._save();
    return true;
  }
}

// ===== torch-dive/signup.js =====
// 가입 게이트 — 게임 시작 전에 이메일을 모은다. 서버 없이도 굴러가는 3단 구조:
//
//   1) 이메일 직접 입력 — 항상 켜져 있다. 어디서든(file:// 포함) 동작한다
//   2) Google 원탭 버튼 — SIGNUP_CONFIG.googleClientId를 넣으면 켜진다.
//      구글이 검증한 이메일이 토큰으로 오므로 오타·가짜 메일이 없다
//   3) 수집 — SIGNUP_CONFIG.collectUrl(Apps Script → 구글 시트)로 보낸다.
//      아직 URL이 없거나 오프라인이면 로컬 큐에 쌓아 두고 다음 실행 때 재시도한다
//
// 게이트는 건너뛸 수 있다(play as guest) — 가입 벽에 첫 손맛을 막히게 하지 않는다.
// 건너뛴 사람에게는 HUD에 ✉️ 버튼이 남아 언제든 다시 가입할 수 있다.

const SIGNUP_CONFIG = {
  // Google Cloud Console → APIs & Services → Credentials → OAuth client ID (Web)
  // 예: '1234567890-abc.apps.googleusercontent.com'  (비우면 Google 버튼이 숨는다)
  googleClientId: '',
  // 이메일을 받을 곳. 두 가지 중 하나 (비우면 로컬 큐에만 쌓인다):
  //  A) 구글 폼 (가장 쉬움, 스크립트·배포 불필요): 폼의 …/formResponse URL을 넣고
  //     아래 formEntry에 이메일 질문의 필드 이름(entry.123456789)을 넣는다
  //  B) Apps Script 웹앱 URL (README의 스니펫 참고): formEntry는 비워 둔다
  collectUrl: '',
  formEntry: '',
};

const STORAGE_USER = 'tdv.user';
const STORAGE_QUEUE = 'tdv.signupQueue';
const GIS_SRC = 'https://accounts.google.com/gsi/client';

// ----- 순수 헬퍼 (테스트 대상) -----

function validateEmail(s) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(s || '').trim());
}

// Google ID 토큰(JWT)의 payload를 읽는다 — 서명 검증은 하지 않는다.
// 여기서는 인증이 아니라 이메일 수집이 목적이라 payload의 email만 쓰면 충분하다.
function decodeJwtPayload(jwt) {
  try {
    const part = String(jwt).split('.')[1];
    if (!part) return null;
    const b64 = part.replace(/-/g, '+').replace(/_/g, '/');
    const pad = b64 + '='.repeat((4 - (b64.length % 4)) % 4);
    const bin = atob(pad);
    const json = decodeURIComponent(
      Array.from(bin, (c) => '%' + c.charCodeAt(0).toString(16).padStart(2, '0')).join('')
    );
    return JSON.parse(json);
  } catch {
    return null;
  }
}

function makeRecord(email, via, dayKey) {
  return { game: 'torch-dive', email: String(email).trim().toLowerCase(), via, day: dayKey, at: new Date().toISOString() };
}

// 수집 요청의 본문을 만든다 — 구글 폼이면 urlencoded, Apps Script면 JSON.
// 둘 다 CORS preflight가 없는 '단순 요청'이라 no-cors로 어디서든 보내진다.
function buildCollectRequest(record, config) {
  if (config.formEntry) {
    return {
      contentType: 'application/x-www-form-urlencoded',
      body: new URLSearchParams({ [config.formEntry]: record.email }).toString(),
    };
  }
  return { contentType: 'text/plain', body: JSON.stringify(record) };
}

// ----- 게이트 -----

class Signup {
  constructor({ dom, sound, dayKey, config = SIGNUP_CONFIG, onDone }) {
    this.dom = dom;
    this.sound = sound;
    this.dayKey = dayKey;
    this.config = config;
    this.onDone = onDone;
    this._gisLoaded = false;

    dom.emailForm.addEventListener('submit', (e) => {
      e.preventDefault();
      this._joinWithEmail();
    });
    dom.btnSkip.addEventListener('click', () => this.skip());
    dom.btnSignup.addEventListener('click', (e) => {
      e.stopPropagation();
      this.show();
    });
  }

  get user() {
    try {
      return JSON.parse(safeStorage.getItem(STORAGE_USER) || 'null');
    } catch {
      return null;
    }
  }

  _saveUser(u) {
    try {
      safeStorage.setItem(STORAGE_USER, JSON.stringify(u));
    } catch {}
  }

  // 아직 가입도 거절도 안 했으면 게이트를 보여준다
  needsGate() {
    return !this.user;
  }

  show() {
    this.dom.gate.classList.remove('hidden');
    this.dom.emailInput.setCustomValidity('');
    this._mountGoogleButton();
    this._updateBadge();
  }

  hide() {
    this.dom.gate.classList.add('hidden');
    this._updateBadge();
    this.onDone?.(this.user);
  }

  // 게스트로 계속 — 강요하지 않는다. HUD의 ✉️로 언제든 돌아올 수 있다
  skip() {
    if (!this.user) this._saveUser({ guest: true });
    this.sound?.ui();
    this.hide();
  }

  _updateBadge() {
    const u = this.user;
    this.dom.btnSignup.classList.toggle('hidden', !!(u && u.email));
  }

  _joinWithEmail() {
    const email = this.dom.emailInput.value;
    if (!validateEmail(email)) {
      this.dom.emailInput.setCustomValidity('Please enter a valid email');
      this.dom.emailInput.reportValidity();
      return;
    }
    this._finish(email, 'email');
  }

  _finish(email, via) {
    this._saveUser({ email: String(email).trim().toLowerCase(), via });
    this._enqueue(makeRecord(email, via, this.dayKey));
    this.flushQueue();
    this.sound?.bank();
    this.hide();
  }

  // ----- Google Identity Services (설정했을 때만) -----

  async _mountGoogleButton() {
    const { googleClientId } = this.config;
    const slot = this.dom.googleBtn;
    const or = this.dom.gateOr;
    if (!googleClientId) {
      slot.classList.add('hidden');
      or.classList.add('hidden');
      return;
    }
    slot.classList.remove('hidden');
    or.classList.remove('hidden');
    try {
      await this._loadGis();
      window.google.accounts.id.initialize({
        client_id: googleClientId,
        callback: (resp) => {
          const payload = decodeJwtPayload(resp && resp.credential);
          if (payload && payload.email) this._finish(payload.email, 'google');
        },
      });
      slot.replaceChildren();
      window.google.accounts.id.renderButton(slot, {
        theme: 'filled_black',
        size: 'large',
        shape: 'pill',
        text: 'continue_with',
        width: 260,
      });
    } catch {
      // GIS를 못 불러오는 환경(오프라인, file://, 웹뷰) — 이메일 폼만으로 계속
      slot.classList.add('hidden');
      or.classList.add('hidden');
    }
  }

  _loadGis() {
    if (this._gisLoaded && window.google?.accounts?.id) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = GIS_SRC;
      s.async = true;
      s.onload = () => {
        this._gisLoaded = true;
        resolve();
      };
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  // ----- 수집 큐 -----

  _queue() {
    try {
      const q = JSON.parse(safeStorage.getItem(STORAGE_QUEUE) || '[]');
      return Array.isArray(q) ? q : [];
    } catch {
      return [];
    }
  }

  _setQueue(q) {
    try {
      safeStorage.setItem(STORAGE_QUEUE, JSON.stringify(q));
    } catch {}
  }

  _enqueue(record) {
    const q = this._queue();
    q.push(record);
    this._setQueue(q);
  }

  // 쌓인 기록을 시트로 보낸다. 성공한 것만 큐에서 뺀다 (앱을 켤 때마다 재시도)
  async flushQueue() {
    const { collectUrl } = this.config;
    if (!collectUrl) return;
    const q = this._queue();
    if (!q.length) return;
    const remaining = [];
    for (const record of q) {
      try {
        const { contentType, body } = buildCollectRequest(record, this.config);
        await fetch(collectUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': contentType },
          body,
        });
      } catch {
        remaining.push(record);
      }
    }
    this._setQueue(remaining);
  }
}

// ===== torch-dive/game.js =====
// 게임 흐름 — 하루(횃불 3개·오늘의 합계·최고 기록)와 다이브 하나하나를 잇는 상태 기계.
// 규칙 판정은 전부 engine.js에 있고, 여기는 타이밍·연출·저장만 오케스트레이션한다.


const STORAGE_DAY = 'tdv.day';
const STORAGE_BEST = 'tdv.best';
const STORAGE_TAUGHT = 'tdv.taught';

const REVEAL_MS = 620; // 문이 돌아가고 내용물을 읽는 시간
const BUST_MS = 1400; // 해골 뒤 나머지 문이 까지는 것을 지켜보는 시간

class Game {
  constructor({ renderer, sound, dom, dayKey, onDiveEnded }) {
    this.r = renderer;
    this.sound = sound;
    this.dom = dom;
    this.onDiveEnded = onDiveEnded;
    this.torchesPerDay = CONFIG.torchesPerDay;

    this.dayKey = dayKey;
    this.daySeed = hashSeed(dayKey);

    this.best = Number(safeStorage.getItem(STORAGE_BEST)) || 0;
    let day = {};
    try {
      day = JSON.parse(safeStorage.getItem(STORAGE_DAY) || '{}');
    } catch {}
    // 자정이 지났으면 새 던전, 새 횃불
    this.day = day.key === dayKey ? day : { key: dayKey, used: 0, total: 0 };

    try {
      this.taught = JSON.parse(safeStorage.getItem(STORAGE_TAUGHT) || '{}');
    } catch {
      this.taught = {};
    }

    this.state = null;
    this.practice = false; // 횃불을 다 쓴 뒤의 무료 다이브 — 기록에 안 들어간다
    this.peekMode = false;
    this.busy = false; // 연출 중 입력 잠금
    this.diveStartedAt = 0;
    this._forcedSeed = null; // ?seed= 테스트용
  }

  _saveDay() {
    try {
      safeStorage.setItem(STORAGE_DAY, JSON.stringify(this.day));
    } catch {}
  }

  _saveTaught() {
    try {
      safeStorage.setItem(STORAGE_TAUGHT, JSON.stringify(this.taught));
    } catch {}
  }

  // ----- 다이브 시작/종료 -----

  startDive() {
    this.practice = this.day.used >= this.torchesPerDay;
    if (this._forcedSeed != null) {
      this.state = newDive(this._forcedSeed, 0);
    } else if (this.practice) {
      // 연습은 매번 다른 던전 — 기록에 안 들어가므로 결정론이 필요 없다
      this.state = newDive((Math.random() * 0xffffffff) >>> 0, 0);
    } else {
      this.state = newDive(this.daySeed, this.day.used);
    }
    this.peekMode = false;
    this.busy = false;
    this.diveStartedAt = performance.now();
    this.r.setPeekMode(false);
    this.r.hideOverlay();
    this.r.renderFloor(this);
    if (!this.taught.open) this.r.showFingerHint();
  }

  async _endDive(kind) {
    const s = this.state;
    const floorReached = s.floorNum;
    if (!this.practice) {
      if (kind === 'bank') this.day.total += s.banked;
      this.day.used += 1;
      this._saveDay();
      if (this.day.total > this.best) {
        this.best = this.day.total;
        try {
          safeStorage.setItem(STORAGE_BEST, String(this.best));
        } catch {}
      }
    }
    this.r.updateHud(this);

    // 광고는 다이브가 끝난 이 전환 순간에만 — 도중에는 절대 안 뜬다
    const diveSeconds = (performance.now() - this.diveStartedAt) / 1000;
    await this.onDiveEnded?.(diveSeconds);

    const torchesLeft = Math.max(0, this.torchesPerDay - this.day.used);
    const dayOver = !this.practice && torchesLeft === 0;
    const torches = '🔥'.repeat(torchesLeft) + '·'.repeat(this.torchesPerDay - torchesLeft);
    const prefix = this.practice ? 'FREE DIVE — ' : '';

    if (kind === 'bank') {
      this.r.showDiveEnd({
        kicker: `${prefix}BANKED`,
        big: `+${s.banked}`,
        cls: 'ov-good',
        sub: `floor ${floorReached} · today ${this.day.total}${this.best ? ` · best ${this.best}` : ''}`,
        torches,
        note: dayOver ? 'new dungeon at midnight · tap for a free dive' : 'tap to dive again',
      });
    } else {
      this.r.showDiveEnd({
        kicker: `${prefix}LOST`,
        big: `−${s.lost}`,
        cls: 'ov-bad',
        sub: `floor ${floorReached} · today ${this.day.total}${this.best ? ` · best ${this.best}` : ''}`,
        torches,
        note: dayOver ? 'new dungeon at midnight · tap for a free dive' : 'tap to dive again',
      });
    }
    this.busy = false;
  }

  // ----- 입력 -----

  tapDoor(i) {
    const s = this.state;
    if (!s || s.over || this.busy) return;
    if (this.peekMode) {
      this._peek(i);
      return;
    }

    const res = openDoor(s, i);
    if (!res) return;
    if (!this.taught.open) {
      this.taught.open = 1;
      this._saveTaught();
      this.r.hideFingerHint();
    }

    this.busy = true;
    this.peekMode = false;
    this.r.setPeekMode(false);
    this.sound.creak();
    this.r.revealDoor(i, res);

    if (res.type === 'skull') {
      this.sound.skull();
      this.r.shake();
      this.r.revealRest(res.doors, i);
      this.r.updateActions(this);
      setTimeout(() => this._endDive('bust'), BUST_MS);
      return;
    }

    if (res.type === 'coin') this.sound.coin();
    else if (res.type === 'gem') this.sound.gem();
    else if (res.type === 'lantern') this.sound.lantern();
    this.r.updateActions(this);

    setTimeout(() => {
      this.sound.step();
      this.r.renderFloor(this);
      // 3층까지 내려와 주머니가 찼는데 나가 본 적이 없다면 — 나가는 문을 한 번 반짝인다
      if (!this.taught.bank && s.floorNum >= 3 && s.carried > 0) this.r.pulseBank(true);
      this.busy = false;
    }, REVEAL_MS);
  }

  togglePeek() {
    const s = this.state;
    if (!s || s.over || this.busy || s.lanterns <= 0) return;
    this.peekMode = !this.peekMode;
    this.sound.ui();
    this.r.setPeekMode(this.peekMode);
  }

  _peek(i) {
    const t = peekDoor(this.state, i);
    this.peekMode = false;
    this.r.setPeekMode(false);
    if (t == null) return;
    this.sound.lantern();
    this.r.showPeek(i, t);
    this.r.updateActions(this);
  }

  bank() {
    const s = this.state;
    if (!s || s.over || this.busy || s.carried <= 0) return;
    bankOut(s);
    if (!this.taught.bank) {
      this.taught.bank = 1;
      this._saveTaught();
    }
    this.r.pulseBank(false);
    this.busy = true;
    this.sound.bank();
    this._endDive('bank');
  }

  // 오버레이 탭 — 다음 다이브로
  continueFromOverlay() {
    if (this.dom.overlay.classList.contains('hidden')) return;
    this.startDive();
  }
}

// ===== torch-dive/main.js =====
// 부트스트랩 — DOM 연결, 입력 위임, 오늘 날짜 → 시드, 디버그 API.







const $ = (id) => document.getElementById(id);
const dom = {
  app: $('app'),
  torchRow: $('torchRow'),
  depthLabel: $('depthLabel'),
  todayLabel: $('todayLabel'),
  btnMute: $('btnMute'),
  compRow: $('compRow'),
  doors: $('doors'),
  btnLantern: $('btnLantern'),
  btnBank: $('btnBank'),
  bankLabel: $('bankLabel'),
  overlay: $('overlay'),
  ovKicker: $('ovKicker'),
  ovBig: $('ovBig'),
  ovSub: $('ovSub'),
  ovTorches: $('ovTorches'),
  ovNote: $('ovNote'),
  gate: $('gate'),
  googleBtn: $('googleBtn'),
  gateOr: $('gateOr'),
  emailForm: $('emailForm'),
  emailInput: $('emailInput'),
  btnSkip: $('btnSkip'),
  btnSignup: $('btnSignup'),
};

const params = new URLSearchParams(location.search);

// 오늘의 열쇠 — 기기 로컬 자정에 던전이 바뀐다 (?day=2026-08-07 로 흉내낼 수 있다)
function localDayKey() {
  if (params.has('day')) return params.get('day');
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

const renderer = new Renderer(dom);
const sound = new Sound();

// ?noads 로 광고를 끌 수 있다 (개발·자동화 테스트용)
const ads = new AdManager({
  enabled: !params.has('noads'),
  provider: createPlaceholderProvider({
    root: $('adSlot'),
    closeBtn: $('adClose'),
    config: AD_CONFIG,
  }),
});

const game = new Game({
  renderer,
  sound,
  dom,
  dayKey: localDayKey(),
  // 광고는 다이브 사이의 전환 순간에만
  onDiveEnded: async (diveSeconds) => {
    ads.noteDiveEnded();
    await ads.maybeShow(diveSeconds);
  },
});

// ?seed=123 으로 던전을 고정할 수 있다 (리플레이/테스트용)
if (params.has('seed')) game._forcedSeed = Number(params.get('seed')) >>> 0;

// 가입 게이트 — 게임 위에 얹히는 막이라 게임 흐름은 전혀 모른다.
// ?gclient= / ?collect= 로 설정을 임시 주입할 수 있다 (개발·테스트용)
const signupConfig = {
  ...SIGNUP_CONFIG,
  googleClientId: params.get('gclient') || SIGNUP_CONFIG.googleClientId,
  collectUrl: params.get('collect') || SIGNUP_CONFIG.collectUrl,
  formEntry: params.get('entry') || SIGNUP_CONFIG.formEntry,
};
const signup = new Signup({ dom, sound, dayKey: localDayKey(), config: signupConfig });

// ----- 입력 -----

// 문 — 손가락이 닿는 순간 반응한다
dom.doors.addEventListener('pointerdown', (e) => {
  const door = e.target.closest('.door');
  if (!door) return;
  e.preventDefault();
  game.tapDoor(Number(door.dataset.i));
});

dom.btnLantern.addEventListener('click', () => game.togglePeek());
dom.btnBank.addEventListener('click', () => game.bank());
dom.overlay.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  game.continueFromOverlay();
});

function updateMuteIcon() {
  dom.btnMute.textContent = sound.muted ? '🔇' : '🔊';
}
dom.btnMute.addEventListener('click', (e) => {
  e.stopPropagation();
  sound.setMuted(!sound.muted);
  updateMuteIcon();
});
updateMuteIcon();

// 길게 눌러도 컨텍스트 메뉴·더블탭 줌이 끼어들지 않게
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('dblclick', (e) => e.preventDefault());

game.startDive();

// 게임이 먼저 그려지고, 그 위에 게이트가 얹힌다 — 문 너머가 살짝 보여야 가입할 이유가 생긴다.
// 이미 가입했거나 게스트를 택한 사람에게는 다시 묻지 않는다 (?signup 으로 강제 표시)
if (params.has('signup') || signup.needsGate()) signup.show();
else signup._updateBadge();
signup.flushQueue(); // 지난번에 못 보낸 이메일이 있으면 재시도

// 디버그/자동화용 — 콘솔에서 상태를 들여다볼 수 있다
window.__tdv = { game, ads, signup, engine: { CONFIG, hashSeed, newDive } };

</script>
